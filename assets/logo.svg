<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="dg-title">
  <title id="dg-title">development-graph — two linked graphs, joined at one seam</title>
  <!-- The drawing is 51x45; this centres it in the square box and scales it to
       fill, so the mark works as an avatar and a favicon without a second file. -->
  <g transform="translate(32 32) scale(1.15) translate(-28 -29)">

  <!-- Decisions: a question and the two it opens. Filled circles; dependency is
       the structure, so the edges are the whole of what a vertex "has". -->
  <g stroke="#4c8fd6" stroke-width="3.5" stroke-linecap="round">
    <line x1="13.6" y1="18.6" x2="10.4" y2="27.4"/>
    <line x1="18.4" y1="18.6" x2="21.6" y2="27.4"/>
  </g>
  <g fill="#4c8fd6">
    <circle cx="16" cy="12" r="5.5"/>
    <circle cx="8"  cy="34" r="5.5"/>
    <circle cx="24" cy="34" r="5.5"/>
  </g>

  <!-- Work: a different shape, because it is a different store. -->
  <g stroke="#7d8590" stroke-width="3.5" stroke-linecap="round" fill="none">
    <line x1="48" y1="29.5" x2="48" y2="38.5"/>
    <rect x="42.5" y="16.5" width="11" height="11" rx="2.5"/>
    <rect x="42.5" y="40.5" width="11" height="11" rx="2.5"/>
  </g>

  <!-- The seam: the one link that crosses, and the only dashed line here. -->
  <line x1="30.7" y1="30.6" x2="40.7" y2="25.6" stroke="#a371f7"
        stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.1 6.5"/>
  </g>
</svg>
