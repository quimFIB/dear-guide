<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="dg-fav-title">
  <title id="dg-fav-title">dear-guide — two linked graphs, joined at one seam</title>
  <!-- assets/logo.svg with the diary taken away. At 16px the book outline
       closes over its own pages and the whole mark goes to a smudge, so the
       favicon keeps only what survives that size: the two graphs and the seam
       between them. Same three colours, same shapes, same meaning.
       The drawing is 51x45; this centres it in the square box and scales it
       to fill. -->
  <g transform="translate(32 32) scale(1.15) translate(-28 -29)">

  <g stroke="#4c8fd6" stroke-width="3.5" stroke-linecap="round">
    <line x1="13.6" y1="18.6" x2="10.4" y2="27.4"/>
    <line x1="18.4" y1="18.6" x2="21.6" y2="27.4"/>
  </g>
  <g fill="#4c8fd6">
    <circle cx="16" cy="12" r="5.5"/>
    <circle cx="8"  cy="34" r="5.5"/>
    <circle cx="24" cy="34" r="5.5"/>
  </g>

  <g stroke="#7d8590" stroke-width="3.5" stroke-linecap="round" fill="none">
    <line x1="48" y1="29.5" x2="48" y2="38.5"/>
    <rect x="42.5" y="16.5" width="11" height="11" rx="2.5"/>
    <rect x="42.5" y="40.5" width="11" height="11" rx="2.5"/>
  </g>

  <line x1="30.7" y1="30.6" x2="40.7" y2="25.6" stroke="#a371f7"
        stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0.1 6.5"/>
  </g>
</svg>
