      return {cls:"ghost", tag:"+", note:`${id} would be added by ${PREVIEW.label}`};
    if(d.removed.includes(id))
      return {cls:"gone", tag:"✗", note:`${id} would be removed by ${PREVIEW.label}`};
    if(d.status[id])
      return {cls:"moved", status:`${d.status[id][0]} → ${d.status[id][1]}`,
              note:`${id} would move from ${d.status[id][0]} to ${d.status[id][1]} — ${PREVIEW.label}`};
    if(d.changed.includes(id))
      return {cls:"moved", tag:"~", note:`${id} would change — ${PREVIEW.label}`};
  }
  const ctx = PREVIEW.context||{};
  for(const d of [ctx.decisions, ctx.tasks]){
    if(!d) continue;
    if(d.added.includes(id) || d.status[id] || d.changed.includes(id))
      return {cls:"assumed", tag:"…", note:`${id} is assumed: an earlier act this one rests on (${(PREVIEW.rests_on||[]).join(", ")}) adds or changes it, and is not part of this preview's change`};
  }
  return {};
}

/* What the preview lights: every record the act touches, and one hop around
   each, in the view being drawn. Everything else is dimmed — the difference
   is small against a whole graph, and a ghost among fifty lit boxes is a
   box. `null` when no preview is on, so the drawers fall back to the
   selection's own dimming. */
function previewLit(){
  if(!PREVIEW) return null;
  const seeds=new Set();
  for(const d of [PREVIEW.diff.decisions, PREVIEW.diff.tasks]){
    if(!d) continue;
    [...d.added, ...d.removed, ...Object.keys(d.status), ...d.changed].forEach(i=>seeds.add(i));
    [...d.edges_added, ...d.edges_removed].forEach(e=>{
      if((e[2]||"precedes")==="precedes"){ seeds.add(e[0]); seeds.add(e[1]); }
    });
  }
  const lit=new Set(seeds);
  const around = id => {
    const out=[];
    if(G && G.derived && G.derived[id]) out.push(...G.derived[id].depends, ...G.derived[id].children);
    if(T && T.derived && T.derived[id]){
      const d=T.derived[id]; out.push(...d.prerequisites, ...d.unblocks);
      if(tab==="joined"){
        d.cross.premises.forEach(p=>out.push(p.id));
        if(d.cross.evidence_for) out.push(d.cross.evidence_for);
      }
    }
    return out;
  };
  seeds.forEach(s=>around(s).forEach(n=>lit.add(n)));
  /* The join runs the other way too: work resting on a decision the act
     touches is one hop from it, and only the task knows. */
  if(tab==="joined" && T) T.tasks.forEach(x=>{
    const c=T.derived[x.id].cross;
    if(c.premises.some(p=>seeds.has(p.id)) || (c.evidence_for && seeds.has(c.evidence_for)))
      lit.add(x.id);
  });
  return lit;
}

/* Whether the preview draws this edge where the store has none: "ghost"
   for the act's own edge, "assumed" for one an earlier act adds, "" for an
   edge the store has. */
function edgeAdded(a, b){
  if(!PREVIEW) return "";
  const hit = d => d && d.edges_added.some(e=>e[0]===a && e[1]===b && (e[2]||"precedes")==="precedes");
  if(hit(PREVIEW.diff.decisions) || hit(PREVIEW.diff.tasks)) return "ghost";
  const ctx = PREVIEW.context||{};
  if(hit(ctx.decisions) || hit(ctx.tasks)) return "assumed";
  return "";
}

/* The edges the preview cuts, drawn struck between records the canvas still
   holds — the route put a removed record back for exactly this. Task edges
   carry a kind, and only `precedes` is a line on the canvas. */
function goneEdges(kind){
  const d = PREVIEW && PREVIEW.diff[kind];
  if(!d) return "";
  return d.edges_removed
    .filter(e=>(e[2]||"precedes")==="precedes" && edgeIn(e[0],e[1]))
    .map(e=>edgeSvg(e[0],e[1],"edge gone"+(ESEL?" dim":""))).join("");
}

/* Turn a preview on, or re-ask for the one that is on after the stores were
   re-read (`resync`). A scope the tray no longer holds — the act was applied
   or dropped underneath — clears the preview and says why, which is the one
   way a preview ends without the reader asking. */
async function previewOn(scope, resync){
  const agent = scope==="all" ? (resync && PREVIEW ? PREVIEW.agent : TRAYWHO) : null;
  let r;
  try{
    r = await api("/api/preview?scope="+encodeURIComponent(scope)
                  +(agent?"&agent="+encodeURIComponent(agent):""));
  }catch(err){
    if(resync){ previewOff(`Preview cleared — ${err.message}`); return; }
    say(err.message,"bad"); previewBar(err.message); return;
  }
  if(!STORE) STORE={G,T,JOIN};
  if(r.graph) G=r.graph;
  if(r.tasks) T=r.tasks;
  JOIN=r.joined||JOIN;
  PREVIEW={scope, agent, label:r.label, refs:r.refs, diff:r.diff,
           context:r.context, rests_on:r.rests_on||[]};
  /* A ghost may be filed under an area the store has never used. Appended,
     never recoloured: the palette is what makes the joined view readable. */
  [...new Set([...G.areas, ...(T?T.areas:[])])].forEach(a=>{
    if(!(a in AREA_COLOR)) AREA_COLOR[a]=PALETTE[Object.keys(AREA_COLOR).length%PALETTE.length];
  });
  layout(); draw(); previewBar(); tray();
  repaintPanel();
}

/* Put the store back. `why` is shown in the bar when the preview ended
   without the reader asking; a plain clear leaves nothing behind. */
function previewOff(why){
  if(!PREVIEW) return;
  if(STORE){ G=STORE.G; T=STORE.T; JOIN=STORE.JOIN; STORE=null; }
  PREVIEW=null;
  /* A ghost that was open has no record in the store to show. */
  const keep = cur();
  const here = keep && ((G && G.vertices.some(v=>v.id===keep))
                     || (T && T.tasks.some(x=>x.id===keep)));
  if(keep && !here){
    sel=null; tsel=null;
    $("#side").innerHTML=`<p class="muted">${esc(keep)} was a preview — the
      store does not hold it. Click a node to inspect it.</p>`;
  }
  layout(); draw(); previewBar(why); tray();
  if(here) repaintPanel();
}

/* The bar over the canvas: what is being previewed and the way out — or,
   with `msg` and no preview, one line saying why it ended, dismissable. */
function previewBar(msg){
  const bar=$("#previewBar");
  if(PREVIEW){
    bar.hidden=false;
    const rests = PREVIEW.rests_on && PREVIEW.rests_on.length
      ? ` It rests on act ${esc(PREVIEW.rests_on.join(", "))}, staged earlier — drawn as assumed, not as this change; the ✓ and a per-writer Apply are refused until that act is taken.` : "";
    bar.innerHTML=`<b>Preview</b><span>${esc(PREVIEW.label)} — the store is
      unchanged. Glowing is added or moved, struck is removed; one hop around
      the change is lit and the rest is dimmed.${rests}</span>
      <span class="grow"></span>
      <button class="chip" data-preview-off title="Draw the store again. Pan, zoom and the open inspector are kept.">clear preview</button>`;
  }else if(msg){
    bar.hidden=false;
    bar.innerHTML=`<span class="muted">${esc(msg)}</span><span class="grow"></span>
      <button class="chip" data-preview-off>&times;</button>`;
  }else{ bar.hidden=true; bar.innerHTML=""; }
  bar.querySelectorAll("[data-preview-off]").forEach(b=>b.onclick=()=>{
    if(PREVIEW) previewOff(); else previewBar();
  });
}

/* The open inspector, redrawn over whichever graph is current — so a record
   the preview moves reads as moved, with the banner saying so. */
function repaintPanel(){
  if(sel) panel(); else if(tsel) taskPanel();
}

/* The line at the top of a panel while a preview is on. */
function previewBanner(id){
  if(!PREVIEW) return "";
  return `<div class="warn" style="margin:0 0 8px">Preview — ${esc(id)} as it
    would read after ${esc(PREVIEW.label)}. The store is unchanged.</div>`;
}

/* The tray keeps its preview honest after the tray moved: an act that was
   dropped ends the preview, and "everything staged" re-asks when the set
   of refs it drew is not the set staged now. Called from `tray()`, which
   every path that reloads `PEND` or `TPEND` already calls. */
function syncPreview(){
  if(!PREVIEW) return;
  const refs = new Set(PEND.concat(TPEND).map(o=>o.ref));
  if(PREVIEW.scope!=="all"){
    if(!refs.has(PREVIEW.scope)) previewOff("Preview cleared — the act it drew is no longer staged.");
    return;
  }
  const now = PEND.concat(TPEND)
    .filter(o=>!PREVIEW.agent||whoOf(o)===PREVIEW.agent).map(o=>o.ref);
  const same = now.length===PREVIEW.refs.length && now.every(r=>PREVIEW.refs.includes(r));
  if(!same) previewOn("all", true);
}

/* ---- side panel ---- */
/* One click handler for both stores: the id says which. In the joined view
   both kinds are on screen at once, so this is not a formality. */
/* An edge click: the reading narrows to the edge and its ends, and the
   inspector opens the record the answer lives on, scrolled to the card for
   that answer where there is one. */
function selectEdge(from, to, pick){
  select(pick);
  ESEL={from, to};
  draw();
  const card=$("#edge-card"); if(card) card.scrollIntoView({block:"nearest"});
}

function select(id){
  ESEL=null;
  captureDraft();
  const isTask = T && T.tasks.some(x=>x.id===id);
  if(isTask){ tsel=id; sel=null; } else { sel=id; tsel=null; }
  draw();
  isTask ? taskPanel() : panel();
}

/* Keyed by element id, so this works for both the decide and the reopen form
   without either having to declare its fields. */
/* Whichever node the panel is showing. Drafts and notes are keyed by node id
   across both stores, so a half-written outcome survives a trip through the
   decision it is `because` of. */
function cur(){ return sel || tsel; }

function captureDraft(){
  if(!cur() || !$("#side")) return;
  const d={};
  let any=false;
  $("#side").querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{
    const val = el.multiple ? [...el.selectedOptions].map(o=>o.value) : el.value;
    d[el.id]=val;
    if(el.multiple ? val.length : val.trim()) any=true;
  });
  /* A picker is a set of boxes under one id; kept as the ids picked. */
  $("#side").querySelectorAll(".picker").forEach(p=>{
    const val=pickerValues(p.id); d[p.id]=val; if(val.length) any=true;
  });
  /* An empty form is not a draft. Storing it would make the "opens" list
     remember a deselection the user never made. */
  if(any) DRAFTS[cur()]=d; else delete DRAFTS[cur()];
}

function restoreDraft(){
  const d=DRAFTS[cur()]; if(!d) return;
  Object.entries(d).forEach(([id,val])=>{
    const el=document.getElementById(id); if(!el) return;
    if(el.classList && el.classList.contains("picker")){
      el.querySelectorAll('input[type=checkbox],input[type=radio]').forEach(c=>c.checked=val.includes(c.value) || (c.type==="radio" && !c.value && !val.length));
      if(el.onchange) el.onchange();
      /* A pick behind a disclosure is a pick the reader should see. */
      const more = el.closest("details"); if(more && val.length) more.open = true;
    }
    else if(el.multiple) [...el.options].forEach(o=>o.selected=val.includes(o.value));
    else el.value=val;
  });
}

/* The editor button exists only when the server says a windowed editor can
   actually be launched. A button whose failure mode is a hung request is worse
   than no button at all. */
const editBtn = () => {
  if(!(ED && ED.available)) return "";
  const name = ED.name || (ED.emacs ? "emacs" : "editor");
  /* While an editor holds the project's one buffer, the button says so rather
     than letting the click come back as a bare 409. */
  if(EDITING) return EDITING.vertex===sel
    ? `<button class="ghost" id="doEdit" disabled>waiting for ${name}…</button>`
    : `<button class="ghost" id="doEdit" disabled
         title="an editor is open for ${esc(EDITING.vertex)}">Compose in ${name}</button>`;
  return `<button class="ghost" id="doEdit">Compose in ${name}</button>`;
};
/* The reason there is no button is said where the button would be. A vim
   user whose server found no terminal emulator, or a machine with no emacs,
   otherwise sees a panel with nothing to click and nothing to read — and the
   variable that would fix it is one only the server knows. */
const editKeys = () => !ED ? ""
  : !ED.available
    ? (ED.reason ? `<div class="keys">No editor button: ${esc(ED.reason)}</div>` : "")
  : ED.emacs
    ? `<div class="keys">emacs opens with this decision's context ·
       <kbd>C-c C-c</kbd> stage · <kbd>C-c C-k</kbd> cancel ·
       <kbd>C-c C-o</kbd> follow a <code>dg:</code> link</div>`
    : `<div class="keys">${esc(ED.name||ED.editor)} opens on the buffer${
         ED.terminal ? ` in a terminal window (${esc(ED.terminal)})` : ""}${
         ED.dialect==="markdown" ? ", as markdown" : ""}; save and exit
       to stage, or empty the Input section to cancel.</div>`;

/* A "Compose in <editor>" button for a form that is *not* the decision
   inspector's — the new-task form (`T108`) and the shared Reword form
   (`T110`). Same gate as `editBtn`: only where the server says a windowed
   editor can be launched, and disabled while one already holds the project's
   one buffer. These forms fill on exit and stage through their own door, so
   the hint says "back into the form", never "stage". */
function composeBtn(id){
  if(!(ED && ED.available)) return "";
  const name=ED.name||(ED.emacs?"emacs":"editor");
  return `<button class="ghost" id="${esc(id)}"${EDITING?" disabled":""
    }>Compose in ${esc(name)}</button>`;
}
function composeKeys(){
  if(!(ED && ED.available))
    return ED && ED.reason
      ? `<div class="keys">No editor button: ${esc(ED.reason)}</div>` : "";
  return ED.emacs
    ? `<div class="keys">emacs opens on the buffer ·
       <kbd>C-c C-c</kbd> bring it back into the form ·
       <kbd>C-c C-k</kbd> cancel</div>`
    : `<div class="keys">${esc(ED.name||ED.editor)} opens on the buffer${
         ED.dialect==="markdown" ? ", as markdown" : ""}; save and exit to
       bring what you wrote back into the form, or leave it empty to
       cancel.</div>`;
}

/* Set a picker's checked boxes to `values`, and refresh its "picked:" count.
   Used to reflect the relations an editor composed (`after`, `because`, …)
   back into the form's pickers, so a Compose fills them the way it fills the
   text inputs. A radio picker's "— none —" row has an empty value and is
   checked when nothing is wanted. */
function setPicker(id, values){
  const p=$("#"+id); if(!p) return;
  const want=new Set(values||[]);
  p.querySelectorAll('input[type=checkbox],input[type=radio]').forEach(c=>{
    c.checked = c.value ? want.has(c.value) : want.size===0;
  });
  p.dispatchEvent(new Event("change"));
}
/* ---- is the store sound? --------------------------------------------------

   The browser had no way to ask. An invalid store — the merge, rebase, partial
   checkout or second clone `pending.repairs` exists for — looked normal here
   until an unrelated Apply was refused for a reason that had nothing to do with
   what was staged, naming a CLI command as the remedy.

   Quiet when clean: the chip is hidden entirely, so its appearing is the whole
   signal. The `dg brief` treatment, not a wall. */

let SOUND=null;

async function soundness(){
  try{ SOUND = await api("/api/check"); }
  catch(err){ SOUND = null; }
  const chip=$("#soundBtn");
  if(!SOUND){ chip.style.display="none"; return; }
  const all=[...SOUND.stored, ...SOUND.staged];
  if(!all.length){ chip.style.display="none"; return; }
  const bad=all.some(f=>f.severity!=="warning");
  chip.style.display="";
  chip.className="chip "+(bad?"bad":"warn");
  chip.textContent=`${all.length} finding${all.length===1?"":"s"}`;
  chip.title="What `dg check` says about this project";
}

function findingRows(rows){
  return rows.map(f=>`<div class="finding${f.severity==="warning"?" warning":""}">
    <b>${esc(f.check)}</b>${f.origin?` <span class="muted">${esc(f.origin)}</span>`:""}
    <div>${esc(f.message)}</div></div>`).join("");
}

/* The findings verbatim, remedy strings and all — they already carry them, and
   a second wording here is the two doors disagreeing about one store. */
function soundPanel(){
  if(!SOUND) return;
  sel=null; tsel=null; NEWKIND=null; RELATING=null; draw();
  const {stored, staged, repairs} = SOUND;
  let h=`<h2>What `+"`dg check`"+` says</h2>`;
  if(!stored.length && !staged.length)
    h+=`<p class="muted">Every invariant holds, in both stores and in what is
      staged.</p>`;
  if(stored.length){
    h+=`<p class="muted">In the store as it sits — this is what
      <code>dg check</code> reports and what the commit gate reads.</p>`
      + findingRows(stored);
  }
  if(staged.length){
    /* A different question from the one above: not "is the record sound" but
       "would this batch leave it sound", which is what `dg apply` will judge
       and what a person needs before staging more. */
    h+=`<p class="muted" style="margin-top:14px">With the trays applied — what
      <code>Apply</code> would judge.</p>` + findingRows(staged);
  }
  if(repairs)
    h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <p class="muted">${repairs} decision(s) rest on a premise under review
        without saying so — a reopen that reached this store by some route
        other than <code>dg reopen</code>.</p>
      <p style="margin:10px 0"><button class="primary" id="doRepair">Mark them PROVISIONAL</button></p>`;
  h+=`<div class="note" id="note"></div>`;
  $("#side").innerHTML=h;
  $("#doRepair")&&($("#doRepair").onclick=async()=>{
    try{
      const res=await api("/api/repair",{method:"POST"});
      PEND=await api("/api/pending"); tray();
      await soundness();
      soundPanel();
      say((res.notes||[]).join(" "), "ok");
    }catch(err){ say(err.message,"bad"); }
  });
}

/* ---- opening a question, and recording a piece of work --------------------

   The graph could be read here and answered here, and never *grown* here: every
   vertex on screen had been typed at a terminal. That is the whole of audit F1,
   and it is what made the browser a viewer with buttons rather than an
   interface — an `OPEN` vertex is the model's reason for existing, and a person
   who noticed an unrecorded question had to leave to write it down, which is
   the moment prose wins.

   Neither form validates against the graph itself. `pending.compose_add` and
   `task_pending.compose_add` own every rule, `dg add` and `dg task add` call
   the same two functions, and what is checked here is only what a form can
   check without asking: that the required boxes have something in them. A
   second set of rules in JavaScript is how the two doors come to disagree
   about what a legal id is. */

let NEWKIND=null;          /* "decision" | "task" while a form is open */

function newNode(){
  sel=null; tsel=null; draw();
  /* In a single-store view the tab has already answered the question. In
     **joined** it has not, and guessing is how a piece of work gets recorded as
     a decision — the one confusion the two-store model exists to prevent. So
     joined asks, and the two options say what each store is for rather than
     repeating the tab names. */
  if(tab==="joined" && T) return chooseStore();
  NEWKIND = tab==="tasks" ? "task" : "decision";
  NEWKIND==="task" ? newTaskForm() : newDecisionForm();
}

function chooseStore(){
  $("#side").innerHTML=`<h2>What are you recording?</h2>
    <p class="muted">Two stores, and the difference is not which view you are
      in. A decision is a question with a falsifier; a task is work with an
      outcome.</p>
    <p style="margin:10px 0;display:flex;gap:8px">
      <button class="ghost" id="cD">A question</button>
      <button class="ghost" id="cT">A piece of work</button></p>`;
  $("#cD").onclick=()=>{ NEWKIND="decision"; newDecisionForm(); };
  $("#cT").onclick=()=>{ NEWKIND="task"; newTaskForm(); };
}

/* The ids a relation control offers. Sorted, and labelled the way every other
   list here is — id first, because ids never clip and titles do. */
/* Every premise above `id`, transitively — what it rests on, and what those
   rest on. Also every record below it (`down`), through `children`. Used to
   keep a picker from offering a cycle: a decision cannot open an ancestor
   or rest on a descendant, and `link_acyclic` would refuse the op at apply
   — the picker just does not ask. */
function reach(id, down){
  const out=new Set(), stack=[id];
  while(stack.length){
    const v=stack.pop(); const d=G.derived[v]; if(!d) continue;
    (down ? d.children : d.depends).forEach(n=>{ if(!out.has(n)){ out.add(n); stack.push(n); } });
  }
  return out;
}

/* What the decide form may offer as "opens": every decision that is not
   this one, not above it, and not already opened by it — those last are
   edges in the store that Apply keeps, said as text rather than as boxes
   that could not be unticked. */
function opensCandidates(id){
  const linked = new Set((G.derived[id]||{}).children||[]);
  const above = reach(id, false);
  return {fixed: [...linked],
          rows: G.vertices.filter(v=>v.id!==id && !above.has(v.id) && !linked.has(v.id))};
}

/* A filterable checklist of records. `rows` are `{id, title}`; the filter
   matches the id or any word of the title. `pickerValues` reads it back.
   `single` makes it one choice — radios, with a "none" row so the choice
   can be cleared — for a slot that holds one id, like evidence-for. */
function idPicker(id, rows, placeholder, single){
  const kind = single ? `type="radio" name="${esc(id)}"` : `type="checkbox"`;
  return `<div class="picker" id="${esc(id)}">
    <input class="picker-q" placeholder="${esc(placeholder||"filter by id or a word of the title…")}" autocomplete="off">
    <div class="picker-list">${single ? `<label><input ${kind} value="" checked> <span class="muted">— none —</span></label>` : ""}${rows.map(r=>
      `<label><input ${kind} value="${esc(r.id)}"> <b>${esc(r.id)}</b> — ${esc(r.title)}</label>`).join("")
      || `<span class="muted">nothing to offer</span>`}</div>
    <div class="picker-count"></div></div>`;
}
function pickerValues(id){
  const p=$("#"+id); if(!p) return [];
  return [...p.querySelectorAll('input[type=checkbox]:checked,input[type=radio]:checked')]
    .map(c=>c.value).filter(Boolean);
}
function bindPickers(){
  document.querySelectorAll(".picker").forEach(p=>{
    const q=p.querySelector(".picker-q"), count=p.querySelector(".picker-count");
    const labels=[...p.querySelectorAll("label")];
    /* Written only when it changes: `sideSync` binds pickers from the
       inspector's mutation observer, and a write here on every call would
       be a mutation that calls this again. */
    const say=()=>{ const v=pickerValues(p.id);
      const txt = v.length ? `picked: ${v.join(", ")}` : "none picked";
      if(count.textContent!==txt) count.textContent = txt; };
    q.oninput=()=>{ const t=q.value.trim().toLowerCase();
      labels.forEach(l=>l.classList.toggle("off", !!t && !l.textContent.toLowerCase().includes(t))); };
    p.onchange=say; say();
  });
}

function idOptions(rows, idKey, titleKey){
  return rows.map(r=>`<option value="${esc(r[idKey])}">${esc(r[idKey])} — ${
    esc(r[titleKey])}</option>`).join("");
}


/* An area control that can name an area nobody has used yet.
   Areas accumulate — the store's `areas` list is a registry, not a whitelist —
   so a <select> over the known ones would make this browser the one door where
   a new corner of a project cannot be filed. A datalist keeps the known ones one
   keystroke away and still lets a new name be typed.

   The checkbox is `--new-area`, and it is the same rule the CLI has: a typed
   name that RESEMBLES one already in use is refused, naming what it resembles,
   because two spellings of one area is what that guard is for. Ticking this says
   the resemblance is a coincidence. It is unticked by default and stays that way
   for the ordinary case, which is picking an area that already exists. */
/* Empty on a new form, never the first known area: a datalist filters its
   options by what the box holds, so a prefilled "scope" offered nothing but
   "scope" until it was deleted, and travelled into the compose buffer as if
   somebody had chosen it (T130, met running T125). */
function areaField(known, current){
  const id = "areaOptions";
  const opts = known.map(a=>`<option value="${esc(a)}"></option>`).join("");
  return `<label>Area</label>
    <input id="nArea" list="${id}" value="${esc(current||"")}"
           placeholder="one in use, or a new one">
    <datalist id="${id}">${opts}</datalist>
    <label style="font-weight:normal;display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="nNewArea">
      <span class="muted">it is a new area, even if it resembles one in
      use</span></label>`;
}

/* The tags a record carries, beside its area (`D95`). Words for a person,
   drawn as dim pills so they read as labels and not as a status. Nothing when
   there are none: most records carry none, and an empty row teaches the eye
   past the line on the ones that say something. */
function tagPills(tags){
  return (tags||[]).map(t=>` <span class="muted">#${esc(t)}</span>`).join("");
}

/* A tags control: free words, comma-separated. Tags accumulate like areas and
   meet the same similarity guard at the staging door; the checkbox is
   `--new-tag`, and it is the same rule the CLI has. */
function tagsField(){
  return `<label>Tags — words this is filed under beside its area (optional)</label>
    <input id="nTags" placeholder="e.g. perf, recall">
    <label style="font-weight:normal;display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="nNewTag">
      <span class="muted">a new tag is meant, even if it resembles one in
      use</span></label>`;
}

/* Every area either store knows. The two share their vocabulary, so an area
   used only for work is one a question may be filed under — offering only this
   store's would send somebody to invent a synonym for one that exists. */
function knownAreas(){
  return [...new Set([...(G?G.areas:[]), ...(T?T.areas:[])])];
}

function newDecisionForm(){
  /* No blocked control: a vertex waits on whichever of the decisions in
     "rests on" is unsettled, read off the edges (`D68`). The picker that used
     to ask "blocked until which decision is settled?" was a second copy of
     that list, one typo away from a block on a decision it did not rest on. */
  $("#side").innerHTML = `<h2>A new question</h2>
    <p class="muted">Nothing is written until Apply, as with everything else here.</p>
    <label>Id</label><input id="nId" value="${esc(G.next_id||"")}">
    ${idFault(G)}
    <label>Title — the question this decision answers, in one line</label>
    <input id="nTitle" placeholder="e.g. Which index for the served vectors?">
    ${areaField(knownAreas())}
    ${tagsField()}
    <label>Status</label>
    <select id="nStatus">
      <option value="OPEN">OPEN — nobody has answered it yet</option>
    </select>
    <label>Rests on — none = a root; it waits on whichever is unsettled</label>
    ${idPicker("nAfter", G.vertices)}
    <label>Note — what is undecided, and why (optional)</label>
    <textarea id="nNote"></textarea>
    <p style="margin:10px 0;display:flex;gap:8px">
      <button class="primary" id="nGo">Stage new decision</button>
      ${composeBtn("nCompose")}
      <button class="ghost" id="nNo">Cancel</button></p>
    ${composeKeys()}
    <div class="note" id="note"></div>`;
  COMPOSED_ADD=null;
  $("#nNo").onclick=closeNew;
  $("#nGo").onclick=stageNewDecision;
  $("#nCompose")&&($("#nCompose").onclick=composeNewDecision);
}

async function stageNewDecision(){
  const id=$("#nId").value.trim(), title=$("#nTitle").value.trim();
  if(!id || !title){ say("An id and a title are required.","bad"); return; }
  const status = $("#nStatus").value;
  /* The fields the form has no input for, carried from a Compose (`T129`,
     as `T108` for a task): read once and cleared. */
  const c=COMPOSED_ADD; COMPOSED_ADD=null;
  await postNew("/api/add", {
    id, title, area:$("#nArea").value.trim(), new_area:$("#nNewArea").checked,
    tags:$("#nTags").value, new_tag:$("#nNewTag").checked,
    status,
    after:pickerValues("nAfter"),
    note:$("#nNote").value.trim()||null,
    rule:c?c.rule||null:null,
    probe:c?c.probe||null:null,
    format:c?c.format||null:null,
  }, id);
}

/* Compose a new decision in an editor, then fill the form (`T129`, on `D99`):
   `composeNewTask`'s twin for the other store, and the same rule — the form
   is the one staging door; what it has no input for (`rule`, `probe`, the
   buffer's `format`) rides in `COMPOSED_ADD` to Stage. */
async function composeNewDecision(){
  const seed={
    id:$("#nId").value.trim(), title:$("#nTitle").value.trim(),
    area:$("#nArea").value.trim(), note:$("#nNote").value.trim(),
    status:$("#nStatus").value,
    tags:$("#nTags").value.split(",").map(s=>s.trim()).filter(Boolean),
    after:pickerValues("nAfter"),
  };
  const go=$("#nGo"), cmp=$("#nCompose");
  EDITING={vertex:"a new decision", kind:"add_vertex"};
  if(go) go.disabled=true; if(cmp) cmp.disabled=true;
  say(ED.emacs
      ? "emacs is open. Compose there, then C-c C-c to bring it back into the form, or C-c C-k to cancel."
      : `${ED.name||"The editor"} is open. Save and exit to bring what you wrote back into the form, or leave it empty to cancel.`,
      "wait");
  try{
    const r=await api("/api/compose",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op:"add_vertex", seed,
                           new_area:!!($("#nNewArea")&&$("#nNewArea").checked)})});
    if(r.aborted)
      say(`Cancelled in the editor — ${r.aborted}. What you typed here is still here.`,"");
    else{
      const f=r.fields||{};
      if(f.id!==undefined) $("#nId").value=f.id;
      if(f.title!==undefined) $("#nTitle").value=f.title;
      if(f.area!==undefined) $("#nArea").value=f.area;
      if(f.note!==undefined) $("#nNote").value=f.note||"";
      if(f.tags!==undefined) $("#nTags").value=(f.tags||[]).join(", ");
      if(f.status!==undefined && $("#nStatus").querySelector(`option[value="${f.status}"]`))
        $("#nStatus").value=f.status;
      setPicker("nAfter", f.after||[]);
      COMPOSED_ADD={rule:f.rule, probe:f.probe, format:f.format};
      say("Filled the form from the editor — review it and press Stage new decision.","ok");
    }
  }catch(err){ say(err.message,"bad"); }
  finally{
    EDITING=null;
    const g2=$("#nGo"), c2=$("#nCompose");
    if(g2) g2.disabled=false; if(c2) c2.disabled=false;
  }
}

function newTaskForm(){
  /* The frontier first, then everything else: `because` almost always names a
     question that is still open, and a select whose first entries are the
     settled ones buries it. A blank first option is what "no link" looks like,
     and it is the default because most work has neither. */
  $("#side").innerHTML = `<h2>A new piece of work</h2>
    <p class="muted">Nothing is written until Apply, as with everything else here.</p>
    <label>Id</label><input id="nId" value="${esc(T.next_id||"")}">
    ${idFault(T)}
    <label>Title — what doing this means</label>
    <input id="nTitle" placeholder="e.g. Build the HNSW index and sweep efSearch">
    ${areaField(knownAreas())}
    ${tagsField()}
    <label>After — work that must be resolved first</label>
    ${idPicker("nAfter", T.tasks)}
    <label>Discovered during — work whose doing turned this up</label>
    ${idPicker("nDuring", T.tasks)}
    <p class="muted" style="margin:4px 0 0">These are different claims. <b>After</b>
      asserts an order and holds this work back; <b>discovered during</b> only
      records where it came from and blocks nothing.</p>
    ${G ? `<label>Because — the decisions this work exists because of</label>
    ${idPicker("nBecause", G.vertices)}
    <label>Evidence for — a decision this work will inform</label>
    ${idPicker("nEvidence", G.vertices, null, true)}` :
    `<p class="muted" style="margin:10px 0 0">This project has no decision graph,
      so there is nothing to link this work to. <code>dg init</code> starts one.</p>`}
    <label>Note (optional)</label>
    <textarea id="nNote"></textarea>
    <p style="margin:10px 0;display:flex;gap:8px">
      <button class="primary" id="nGo">Stage new task</button>
      ${composeBtn("nCompose")}
      <button class="ghost" id="nNo">Cancel</button></p>
    ${composeKeys()}
    <div class="note" id="note"></div>`;
  COMPOSED_ADD=null;
  $("#nNo").onclick=closeNew;
  $("#nGo").onclick=stageNewTask;
  $("#nCompose")&&($("#nCompose").onclick=composeNewTask);
}

async function stageNewTask(){
  const id=$("#nId").value.trim(), title=$("#nTitle").value.trim();
  if(!id || !title){ say("An id and a title are required.","bad"); return; }
  /* The two fields the form has no input for, plus the buffer's dialect,
     carried from a Compose (`T108`). Read once and cleared, so a second Stage
     of a hand-typed task does not resurrect a composed definition-of-done. */
  const c=COMPOSED_ADD; COMPOSED_ADD=null;
  await postNew("/api/add-task", {
    id, title, area:$("#nArea").value.trim(),
    new_area:$("#nNewArea").checked,
    tags:$("#nTags").value, new_tag:$("#nNewTag").checked,
    after:pickerValues("nAfter"),
    discovered_during:pickerValues("nDuring"),
    /* A set, joined the way the CLI's `--because D01,D05` arrives. The server
       splits on commas for both doors, so the two stage the identical op. */
    because:$("#nBecause")?pickerValues("nBecause").join(","):null,
    evidence_for:$("#nEvidence")?(pickerValues("nEvidence")[0]||null):null,
    note:$("#nNote").value.trim()||null,
    done_when:c?c.done_when||null:null,
    probe:c?c.probe||null:null,
    format:c?c.format||null:null,
  }, id);
}

/* Compose a new task in an editor, then fill the form (`T108`, on `D99`). The
   request blocks for the whole editing session, exactly as `composeIn` does
   for a decision; whatever is already typed is sent as a seed so switching to
   the editor mid-thought costs no work. On exit the parsed fields fill every
   input the form has — text and pickers alike — and `COMPOSED_ADD` carries the
   two the form does not (`done_when`, `probe`) plus the buffer's `format`, so
   Stage loses nothing. The form is the one staging door. */
async function composeNewTask(){
  const seed={
    id:$("#nId").value.trim(), title:$("#nTitle").value.trim(),
    area:$("#nArea").value.trim(), note:$("#nNote").value.trim(),
    tags:$("#nTags").value.split(",").map(s=>s.trim()).filter(Boolean),
    after:pickerValues("nAfter"), discovered_during:pickerValues("nDuring"),
    because:$("#nBecause")?pickerValues("nBecause").join(","):"",
    evidence_for:$("#nEvidence")?(pickerValues("nEvidence")[0]||""):"",
  };
  const go=$("#nGo"), cmp=$("#nCompose");
  EDITING={vertex:"a new task", kind:"add_task"};
  if(go) go.disabled=true; if(cmp) cmp.disabled=true;
  say(ED.emacs
      ? "emacs is open. Compose there, then C-c C-c to bring it back into the form, or C-c C-k to cancel."
      : `${ED.name||"The editor"} is open. Save and exit to bring what you wrote back into the form, or leave it empty to cancel.`,
      "wait");
  try{
    const r=await api("/api/compose",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({store:"tasks", op:"add_task", seed,
                           new_area:!!($("#nNewArea")&&$("#nNewArea").checked)})});
    if(r.aborted)
      say(`Cancelled in the editor — ${r.aborted}. What you typed here is still here.`,"");
    else{
      const f=r.fields||{};
      if(f.id!==undefined) $("#nId").value=f.id;
      if(f.title!==undefined) $("#nTitle").value=f.title;
      if(f.area!==undefined) $("#nArea").value=f.area;
      if(f.note!==undefined) $("#nNote").value=f.note||"";
      if(f.tags!==undefined) $("#nTags").value=(f.tags||[]).join(", ");
      setPicker("nAfter", f.after||[]);
      setPicker("nDuring", f.discovered_during||[]);
      if($("#nBecause")) setPicker("nBecause", f.because||[]);
      if($("#nEvidence")) setPicker("nEvidence", f.evidence_for?[f.evidence_for]:[]);
      COMPOSED_ADD={done_when:f.done_when, probe:f.probe, format:f.format};
      say("Filled the form from the editor — review it and press Stage new task.","ok");
    }
  }catch(err){ say(err.message,"bad"); }
  finally{
    EDITING=null;
    const g2=$("#nGo"), c2=$("#nCompose");
    if(g2) g2.disabled=false; if(c2) c2.disabled=false;
  }
}

/* One post path for both forms. The reload is the part worth explaining: an
   `add` changes what every *other* control on this page can offer — a new id to
   depend on, a new premise to link to — so the graph is re-read rather than
   patched locally. `panel()` and `taskPanel()` can patch because they change
   one node; this changes the vocabulary. */
async function postNew(route, body, id){
  try{
    const res = await api(route, {method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)});
    const n = (res.staged||[]).length;
    NEWKIND=null;
    await boot(); fit(); draw();
    $("#side").innerHTML=`<p class="muted">Staged ${esc(id)} — ${n} op(s),
      including the edges that attach it. Nothing is written until Apply.</p>`;
  }catch(err){ say(err.message,"bad"); }
}

function closeNew(){
  NEWKIND=null;
  $("#side").innerHTML=`<p class="muted">Click a node to inspect it.</p>`;
}

/* ---- the task panel ------------------------------------------------------

   Two kinds of change, and this panel now offers both. **Status** moves a task
   along its own machine — start, done, park, drop. **Structure** changes the
   graph it sits in: a prerequisite discovered later, provenance, and the seam
   into the decision store.

   Structure used to stay in the CLI, on the argument that these are
   corrections, that they are rare, and that each wants a sentence of
   explanation a form has nowhere to put. Only the first of those survived the
   interface audit (F4). *Rare* was measured on the people who use the CLI —
   `because` is not rare, it is the tool's central claim, and a browser user
   meets it on their first task. And the *sentence* is not collected by
   `dg task dep`, `undep`, `link` or `unlink` either; none of them takes a
   `--why`, so there was never one to lose.

   What a correction does want is deliberation, and `askFallout` below had
   already shown a form can hold that: it asks a question per released task and
   acts on the answers. So the removing verbs ask too — `relateFallout` shows
   what stops waiting *before* anything is staged, which is the part a
   confirmation dialog cannot do.

   `rm` is still not here, and that is a stance rather than a gap. Removal
   erases a record instead of superseding it, which is the one thing this model
   refuses; friction is the intended behaviour, and a ✕ is the wrong
   affordance for it. */
function taskPanel(){
  const x=T.tasks.find(y=>y.id===tsel), d=T.derived[tsel], c=d.cross;
  let h=previewBanner(x.id)+`<h2>${esc(x.id)} — ${esc(x.title)}</h2>
    <span class="pill" style="background:${TASK_COLOR[x.status]};color:#04121f">${esc(x.status)}</span>
    <span class="muted"> ${esc(x.area)}</span>${tagPills(x.tags)}
    <div class="kv">
      <div>after</div><div>${esc(d.prerequisites.join(", "))||"—"}</div>
      <div>unblocks</div><div>${esc(d.unblocks.join(", "))||"—"}</div>`;
  /* Provenance, printed only where it holds — unlike the two rows above, which
     are always shown. Most work has no origin recorded, and a dash on every
     panel teaches the eye past the line on the tasks where it says something.
     Not drawn in the graph: the layout ranks by prerequisite depth, and an
     edge that orders nothing has no rank to sit at. */
  if(d.discovered_during.length)
    h+=`<div>found doing</div><div>${esc(d.discovered_during.join(", "))}</div>`;
  if(d.prompted.length)
    h+=`<div>turned up</div><div>${esc(d.prompted.join(", "))}</div>`;
  if(d.waiting_on.length)
    h+=`<div>waiting on</div><div style="color:var(--warn)">${esc(d.waiting_on.join(", "))}</div>`;
  /* Every premise on its own line with its own status, and the ones that
     resolve to nothing named as such. `c.premises` is empty rather than falsy
     when there are none — an empty array is truthy, which is how this row came
     to be drawn on every task in the graph. */
  if(c.premises.length || c.dangling.length)
    h+=`<div>because</div><div>${
      c.premises.map(p=>`${dgLink(p.id)} <span class="muted">${esc(p.status)}</span>`)
        .concat(c.dangling.map(id=>dgLink(id, true)))
        .join("<br>")}</div>`;
  if(c.evidence_for)
    h+=`<div>evidence for</div><div>${dgLink(c.evidence_for)}</div>`;
  if(x.done) h+=`<div>done</div><div>${esc(x.done)}</div>`;
  /* As on the decision panel: the domains scaffold's fields, where present
     (audit `N-F5`). `d.unfinished` comes from the server for the reason
     `done_label` does. */
  if(x.binds&&x.binds.length)
    h+=`<div>bound to</div><div>${esc(x.binds.map(b=>`${b.kind}:${b.ref}`).join(", "))}</div>`;
  if(x.done_when) h+=`<div>done when</div><div>${esc(x.done_when)}</div>`;
  if(x.probes&&x.probes.length)
    h+=`<div>done when (probe)</div><div>${x.probes.map((p,i)=>
      `<span class="muted">${esc(p.date)}</span> ${esc(p.kind)} <span class="muted">${
        esc(JSON.stringify(p.args))}</span>${
        i===x.probes.length-1 && d.unfinished ? ' <span class="pill">live</span>' : ""}`
      ).join("<br>")}</div>`;
  h+=`</div>`;
  if(x.note) h+=`<div class="answer muted">${mdFold(x.note, x.format)}</div>`;
  /* The one result. `DONE` is terminal (`D81`), so a task has one outcome and
     a second attempt is a child task reached by its edge. `done_label` comes
     from the server for the reason the stop label does: a fourth renderer
     choosing its own word is how the last one drifted. */
  if(x.outcome){
    const tag = d.done_label
      ? ` <span class="pill" style="background:${TASK_COLOR[x.status]};color:#04121f">${
          esc(d.done_label)}</span>` : "";
    h+=`<div class="answer"><b>outcome</b> <span class="muted">${esc(x.done||"")}</span>${tag} — ${mdFold(x.outcome, x.format)}</div>`;
  }
  /* Only where the status supports it — see `task_render._section`. A store
     cannot hold a `why` under work in progress any more, but a view is drawn
     from broken stores too. */
  /* Every stoppage, and no status guard: a stop describes something that
     happened, so no later status can contradict it. Only the *last* entry can
     be the live reason, and only while the status still claims one — the same
     reading `Task.stopped_because` makes, so the page and the store cannot
     disagree about which reason is current. */
  (x.stops||[]).forEach((k,i)=>{
    /* The word comes from the server (`tasks.STOP_LABEL`), not from a status
       test here: three renderers picking their own label is how the parked
       reason came to be printed by one and dropped by the others. */
    const live = i===(x.stops.length-1) && !!d.stop_label;
    const tag = live
      ? ` <span class="pill" style="background:${TASK_COLOR[x.status]};color:#04121f">${
          esc(d.stop_label.toLowerCase())}</span>` : "";
    h+=`<div class="answer muted"><b>stopped</b> <span class="muted">${esc(k.date)}</span>${tag} — ${mdFold(k.why, x.format)}</div>`;
  });

  /* Say why it is not startable before offering the buttons: the gate is the
     cross-graph one, and "blocked" without a reason is what sends people to
     the CLI to find out. */
  if(c.gated_by)
    h+=`<p class="wait">Waiting on ${dgLink(c.gated_by)}, which is not settled — starting now is a bet on the answer.</p>`;
  else if(d.waiting_on.length)
    h+=`<p class="wait">Waiting on ${esc(d.waiting_on.join(", "))}.</p>`;

  h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">`;
  if(x.status==="PARKED"){
    /* Picking it up is the only thing offered here. Finishing or dropping work
       nobody is doing skips a step somebody has to take deliberately, and the
       park record says the last person to look at this decided not to. */
    h+=`<p style="margin:0 0 10px"><button class="primary" id="doStart">Pick it up again</button></p>
      <p class="muted">Stopped ${esc((x.stops&&x.stops.length)||0)} time(s). The record is kept.</p>`;
  }else if(x.status==="TODO" || x.status==="DOING"){
    if(x.status==="TODO")
      h+=`<p style="margin:0 0 10px"><button class="ghost" id="doStart">Start it</button></p>`;
    h+=`<label>Outcome — what this work produced</label>
      <input id="outcome" placeholder="a path, a PR, a measurement">
      <p style="margin:10px 0"><button class="primary" id="doDone">Mark done</button></p>
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <label>Or put it down — what stopped it?</label>
      <input id="pwhy" placeholder="what you are stuck on">
      <p style="margin:10px 0"><button class="ghost" id="doPark">Park it</button></p>
      <label>Or drop it — why is it not being done?</label>
      <input id="dwhy" placeholder="what made this unnecessary">
      <p style="margin:10px 0"><button class="ghost" id="doDrop">Drop it</button></p>`;
  }else{
    h+=`<p class="muted">${x.status==="DONE"?"Finished":"Dropped"}. Reopening finished work is a correction, and corrections live in <code>dg task</code>.</p>`;
  }
  /* Offered whatever the status is. A prerequisite recorded against the wrong
     task, or a link pointing at the wrong decision, is wrong whether or not
     the work is finished — and `link` after the fact is the *usual* case, since
     work is what turns the question up. */
  h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">`
    + structureBtn("tasks", tsel)
    + amendForm(knownAreas(), x);
  h+=`<div class="note" id="note"></div>`;
  $("#side").innerHTML=h;
  $("#side").querySelectorAll("a[data-dg]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault(); jump(a.dataset.dg);
  });
  bindStructure();
  restoreDraft();
  const n=NOTES[tsel]; if(n) say(n.msg, n.cls);
  $("#doAmend")&&($("#doAmend").onclick=()=>postTask(amendOp("task", tsel)));
  $("#doComposeAmend")&&($("#doComposeAmend").onclick=()=>composeAmend("tasks", tsel));
  $("#doStart")&&($("#doStart").onclick=()=>
    postTask({op:"set_status",task:tsel,status:"DOING"}));
  $("#doPark")&&($("#doPark").onclick=()=>{
    const w=$("#pwhy").value.trim();
    /* `dg task park` requires it for the same reason `drop` does: the reason
       is the record, and this one is the half that survives being resumed. */
    if(!w){ say("Say what stopped it — that is the part that is kept.","bad"); return; }
    const dt=new Date(), pad=n=>String(n).padStart(2,"0");
    postTask({op:"set_status",task:tsel,status:"PARKED",why:w,
              date:`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`});
  });
  $("#doDrop")&&($("#doDrop").onclick=()=>askFallout(tsel));
  $("#doDone")&&($("#doDone").onclick=()=>{
    const o=$("#outcome").value.trim();
    /* `dg task done` requires it, so the form does too — a DONE task with no
       outcome is a record of nothing. */
    if(!o){ say("An outcome is required: what did this produce?","bad"); return; }
    const dt=new Date(), pad=n=>String(n).padStart(2,"0");
    postTask({op:"set_status",task:tsel,status:"DONE",outcome:o,
              done:`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`});
  });
  $("#side").addEventListener("input", captureDraft);
  $("#side").addEventListener("change", captureDraft);
}

/* ---- structure: prerequisites, provenance, and the seam -------------------

   One builder for both stores, because the shape is the same in each: pick
   ids, choose what the relation *means*, and — for anything that removes —
   read what it sets loose before deciding. What differs is the vocabulary,
   which is the table below and nothing else. */

const REL_FORMS = {
  tasks: {
    route: "/api/task-dep", store: "tasks",
    add: [["after", "After — work that must be resolved first"],
          ["discovered_during", "Discovered during — work whose doing turned this up"]],
    seam: [["because", "Because — the decision this work exists for"],
           ["evidence_for", "Evidence for — a decision this work informs"]],
  },
  decisions: {
    route: "/api/dep", store: "decisions",
    add: [["after", "Rests on — premises this question depends on"]],
    seam: [],
  },
};

let RELATING=null;   /* {store, id, verb} while a structure form is open */

/* Correcting how a record is worded or filed — `dg amend` and `dg task amend`,
   the same `set_fields` op through the same rules (`pending.vet_fields`), which
   is why there is one form here and not one per store. Collapsed by default: a
   correction is rare beside the acts above it, and an open form on every panel
   would compete with them for the eye.

   **Prefilled as placeholders, not as values, and that is not cosmetic.**
   `captureDraft` sweeps every input on the panel and treats a non-empty one as
   unconfirmed work, so a form carrying the record's current title would make
   every node a person merely *looked at* into a draft. Empty means unchanged,
   which also makes the op literal: only what somebody typed is written. The
   cost is that a note cannot be emptied from here — `dg amend D07 --note ""`
   can, and clearing prose is rare enough not to earn a second control. */
function amendForm(areas, rec){
  /* A datalist rather than a select, for the reason `areaField` gives — areas
     accumulate, so a correction may name one nobody has used yet. Blank still
     means unchanged, which is why the field is empty rather than prefilled
     with the record's current area. */
  const opts=areas.map(a=>
    `<option value="${esc(a)}"></option>`).join("");
  return `<details><summary class="muted">Reword this record</summary>
    <label>Title — blank leaves it as it is</label>
    <input id="amTitle" placeholder="${esc(rec.title)}">
    <label>Area — blank leaves it as it is</label>
    <input id="amArea" list="amAreaOptions" placeholder="${esc(rec.area)}">
    <datalist id="amAreaOptions">${opts}</datalist>
    <label style="font-weight:normal;display:flex;gap:6px;align-items:center">
      <input type="checkbox" id="amNewArea">
      <span class="muted">it is a new area, even if it resembles one in
      use</span></label>
    <label>Note — replaces the one above</label>
    <textarea id="amNote" placeholder="blank leaves it as it is"></textarea>
    <p style="margin:10px 0;display:flex;gap:8px">
      <button class="ghost" id="doAmend">Stage the correction</button>
      ${composeBtn("doComposeAmend")}</p>
    ${composeKeys()}
    <p class="muted">A title, an area and a note are how this record is referred
      to and where it is filed, so nothing is superseded and the old wording is
      not kept — citations of it elsewhere are not updated, and nothing can find
      them. An answer, an outcome or a reason work stopped is a dated claim and
      is never edited in place.</p></details>`;
}

/* The op the form describes. Built from what was typed rather than from the
   whole form, so a field somebody read and left alone does not arrive as a
   write — and an op that changes nothing is refused by the server, which is
   the same reading `dg amend` makes: the caller has usually lost track. */
function amendOp(key, id){
  const op={op:"set_fields", [key]:id};
  const title=$("#amTitle").value.trim(), area=$("#amArea").value.trim(),
        note=$("#amNote").value.trim();
  if(title) op.title=title;
  if(area) op.area=area;
  if(note) op.note=note;
  /* Only where an area is actually being written. `new_area` is read at the
     staging door and never stored, so sending it on an op that names no area
     would be a permission nothing is asking about. */
  if(area && $("#amNewArea") && $("#amNewArea").checked) op.new_area=true;
  carryAmend(op, id);
  return op;
}

/* Put back the two fields the Reword form has no input for that a composed
   amend can carry (`T110`): a decision's `rule`, a task's `done_when`, and the
   buffer's `format` so their dialect is not lost. Keyed to the record it was
   composed against and consumed once, like `carryComposed`. The form's own
   title / area / note are the reader's and are read straight off it. */
function carryAmend(op, id){
  if(!(COMPOSED_AMEND && COMPOSED_AMEND.id===id)) return;
  for(const k of ["rule","done_when","format"])
    if(COMPOSED_AMEND[k]!==undefined && op[k]===undefined) op[k]=COMPOSED_AMEND[k];
  COMPOSED_AMEND=null;
}

/* Compose an amendment in an editor, then fill the Reword form (`T110`, on
   `D99`). One path for both stores — the amend op is the same `set_fields`
   through the same rules — so the caller passes which store and which record.
   The editor prefills the record as it stands and returns only what changed;
   the form shows title / area / note, and `COMPOSED_AMEND` carries `rule` or
   `done_when`. The form stays the one staging door. */
async function composeAmend(store, id){
  const btn=$("#doComposeAmend"), stage=$("#doAmend");
  EDITING={vertex:id, kind:"amend"};
  if(btn) btn.disabled=true; if(stage) stage.disabled=true;
  say(ED.emacs
      ? "emacs is open. Edit there, then C-c C-c to bring the changes into the form, or C-c C-k to cancel."
      : `${ED.name||"The editor"} is open. Save and exit to bring the changes into the form, or leave it unchanged to cancel.`,
      "wait", id);
  try{
    const r=await api("/api/compose",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({store, op:"amend", vertex:id})});
    if(r.aborted)
      say(`Cancelled in the editor — ${r.aborted}. What you typed here is still here.`,"",id);
    else{
      const f=r.fields||{};
      if(f.title!==undefined) $("#amTitle").value=f.title;
      if(f.area!==undefined) $("#amArea").value=f.area;
      if(f.note!==undefined && f.note!==null) $("#amNote").value=f.note;
      COMPOSED_AMEND={id, rule:f.rule, done_when:f.done_when, format:f.format};
      say("Filled the correction from the editor — review it and press Stage the correction.","ok",id);
    }
  }catch(err){ say(err.message,"bad",id); }
  finally{
    EDITING=null;
    const b2=$("#doComposeAmend"), s2=$("#doAmend");
    if(b2) b2.disabled=false; if(s2) s2.disabled=false;
  }
}

/* Why the id could not be prefilled, where that is the case. This clone
   allocates from a granted range (`dgraph/ranges.py`) and a used-up grant is
   the one thing that stops the form filling itself — every other reading on
   the page still holds, so the payload carries the fault beside the id rather
   than failing, and the form says it where the number would have been. */
function idFault(store){
  return store && store.next_id_fault
    ? `<p class="wait">${esc(store.next_id_fault)}</p>` : "";
}

function structureBtn(store, id){
  return `<p style="margin:10px 0"><button class="ghost" data-rel="${
    esc(store)}|${esc(id)}">Edit structure</button></p>`;
}

function bindStructure(){
  const b=$("#side").querySelector("button[data-rel]");
  if(!b) return;
  b.onclick=()=>{
    const [store,id]=b.dataset.rel.split("|");
    RELATING={store, id, verb:"dep"};
    structureForm();
  };
}

/* The ids this node could relate to. Never itself, and for a removal only what
   it already holds — offering an id that is not there is how "unknown task"
   became a thing a form could produce. */
function relCandidates(store, id, field, verb){
  if(store==="decisions"){
    const held = G.derived[id] ? G.derived[id].depends : [];
    /* A premise cannot be this record, one it already rests on, or anything
       below it — that last is a cycle, which `link_acyclic` would refuse at
       apply; the picker does not ask. */
    const below = reach(id, true);
    return verb==="undep"
      ? G.vertices.filter(v=>held.includes(v.id))
      : G.vertices.filter(v=>v.id!==id && !held.includes(v.id) && !below.has(v.id));
  }
  const d = T.derived[id] || {};
  const held = field==="after" ? (d.prerequisites||[]) : (d.discovered_during||[]);
  return verb==="undep"
    ? T.tasks.filter(t=>held.includes(t.id))
    : T.tasks.filter(t=>t.id!==id && !held.includes(t.id));
}

function structureForm(){
  const {store, id, verb} = RELATING;
  const spec = REL_FORMS[store];
  const removing = verb==="undep" || verb==="unlink";
  const seam = verb==="link" || verb==="unlink";
  let h=`<h2>${esc(id)} — structure</h2>
    <p style="margin:0 0 10px;display:flex;gap:6px;flex-wrap:wrap">`;
  const verbs = spec.seam.length
    ? [["dep","add a relation"],["undep","remove a relation"],
       ["link","set a link"],["unlink","remove a link"]]
    : [["dep","add a premise"],["undep","remove a premise"]];
  verbs.forEach(([v,label])=>
    h+=`<button class="chip${v===verb?" on":""}" data-v="${v}">${label}</button>`);
  h+=`</p>`;

  if(seam){
    /* A task rests on a set of premises and informs at most one question, so
       `because` is a multi-select and `evidence for` is not. Both are still
       fields rather than edges: there is no edge list across the two stores,
       and `dgraph/cross.py` says why inventing one costs the barrier. */
    spec.seam.forEach(([field,label])=>{
      const rec = T.tasks.find(t=>t.id===id)||{};
      /* `because` is a list on the record and `evidence_for` a single id.
         Normalised here so the four branches below read one shape — the store
         keeps them different because they *are* different, and this is the one
         place the page has to care. */
      const held = field==="because" ? (rec.because||[]) : (rec[field]?[rec[field]]:[]);
      if(verb==="unlink"){
        /* Which one goes has to be said: a task rests on several premises, and
           a checkbox could name none of them. Offered from what the record
           actually holds, so a link that is not there cannot be asked for. */
        if(!held.length){
          h+=`<label class="muted">${esc(label)} — not set</label>`;
        }else if(field==="because"){
          const rows = held.map(d=>{ const v=G&&G.vertices.find(x=>x.id===d); return {id:d, title:v?v.title:""}; });
          h+=`<label>${esc(label)} — remove which?</label>${idPicker("r_"+field, rows)}`;
        }else{
          h+=`<label style="display:flex;gap:8px;align-items:center">
            <input type="checkbox" id="r_${field}" style="width:auto"> ${esc(label)}
            <span class="muted">${esc(held[0])}</span></label>`;
        }
      }else{
        const nowSaid = held.length?` <span class="muted">(now ${esc(held.join(", "))})</span>`:"";
        if(field==="because"){
          /* Offered from what is not already held. */
          const rows = G ? G.vertices.filter(v=>!held.includes(v.id)) : [];
          h+=`<label>${esc(label)}${nowSaid}</label>${idPicker("r_"+field, rows)}`;
        }else{
          h+=`<label>${esc(label)}${nowSaid}</label>${
            idPicker("r_"+field, G ? G.vertices : [], null, true)}`;
        }
      }
    });
  }else{
    spec.add.forEach(([field,label])=>{
      const rows=relCandidates(store, id, field, verb);
      h+=`<label>${esc(label)}${removing?" — remove which?":""}</label>`
        + (rows.length ? idPicker("r_"+field, rows)
                       : `<p class="muted" style="margin:4px 0">Nothing to remove here.</p>`);
    });
    if(store==="tasks" && !removing)
      h+=`<p class="muted" style="margin:6px 0">These are different claims.
        <b>After</b> asserts an order and holds this work back;
        <b>discovered during</b> only records where it came from and blocks nothing.</p>`;
  }

  h+=`<p style="margin:12px 0;display:flex;gap:8px">
      <button class="primary" id="rGo">${removing?"Check, then stage":"Stage"}</button>
      <button class="ghost" id="rNo">Cancel</button></p>
    <div class="note" id="note"></div>`;
  $("#side").innerHTML=h;
  $("#side").querySelectorAll("button[data-v]").forEach(b=>b.onclick=()=>{
    RELATING.verb=b.dataset.v; structureForm();
  });
  $("#rNo").onclick=()=>{ RELATING=null; store==="tasks"?taskPanel():panel(); };
  $("#rGo").onclick=()=>removing?relateFallout():postRelate();
}

/* What the body of a structure post looks like, read off the form. One reader,
   so the fallout preview and the staging post cannot describe different acts —
   which would make the preview a reassurance about something else. */
function relateBody(){
  const {store, id, verb} = RELATING;
  const body={verb, id, store:REL_FORMS[store].store};
  const spec=REL_FORMS[store];
  if(verb==="link"||verb==="unlink"){
    spec.seam.forEach(([f])=>{
      const el=$("#r_"+f); if(!el) return;
      /* `because` is comma-joined ids in both directions — the server parses
         one shape for both doors. `evidence_for` is a single slot, so unlink
         stays a flag for it and only for it. Sending a bool for `because` is
         what made the unlink route raise instead of refuse (`V-F2`). */
      if(f==="because"){
        body[f] = pickerValues("r_"+f).join(",");
      }else{
        body[f] = verb==="unlink" ? !!el.checked : (pickerValues("r_"+f)[0]||null);
      }
    });
  }else{
    spec.add.forEach(([f])=>{
      if(!$("#r_"+f)) return;
      body[f]=pickerValues("r_"+f);
    });
  }
  return body;
}

/* The `askFallout` pattern, for the two verbs that release something. A
   removal is refused nothing — it is legal — so this is not a gate; it is the
   sentence a person needs in order to mean it. */
async function relateFallout(){
  /* Read once, here. `postRelate` used to read the form again on the way out,
     and by then this function has replaced `#side` with the confirmation — so
     the second read found no form and posted an empty body, which the server
     correctly refused as "nothing to unlink". The act a person confirmed and
     the act that gets staged are now literally the same object. */
  const body=relateBody();
  let res;
  try{ res=await api("/api/fallout",{method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}); }
  catch(err){ say(err.message,"bad"); return; }
  if(res.error){ say(res.error,"bad"); return; }
  const lines=[...(res.releases||[]), ...(res.findings||[])];
  if(!lines.length) return postRelate();
  let h=`<p class="warn">Removing this changes more than ${esc(RELATING.id)}:</p>
    <ul class="muted">${lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
    <p style="margin:10px 0;display:flex;gap:8px">
      <button class="primary" id="rYes">Stage it anyway</button>
      <button class="ghost" id="rBack">Back</button></p>
    <div class="note" id="note"></div>`;
  $("#side").innerHTML=h;
  $("#rBack").onclick=structureForm;
  $("#rYes").onclick=()=>postRelate(body);
}

async function postRelate(body){
  const {store, id} = RELATING;
  body = body || relateBody();
  try{
    const res=await api(REL_FORMS[store].route,{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    RELATING=null;
    await boot(); fit(); draw();
    const n=(res.staged||[]).length;
    const notes=(res.notes||[]).map(x=>`<li>${esc(x)}</li>`).join("");
    $("#side").innerHTML = (n
        ? `<p class="muted">Staged ${n} op(s) for ${esc(id)}. Nothing is
             written until Apply.</p>`
        : `<p class="muted">Nothing staged — ${esc(id)} already held what was
             asked for.</p>`)
      + (notes?`<ul class="muted">${notes}</ul>`:"");
  }catch(err){ say(err.message,"bad"); }
}

/* ---- what a drop leaves standing -------------------------------------

   `dg task drop` refuses (exit 2, non-interactive) until every released and
   orphaned task has a keep/drop verdict, because **both defaults are wrong
   somewhere**: assuming "keep" leaves a task in the backlog whose whole
   purpose died with its prerequisite, and assuming "drop" throws away work
   that was only ever incidentally connected. This button used to post one op
   and ask nothing, which is picking one of those defaults silently.

   So it asks, and — this is the part a confirmation dialog cannot do — it can
   act on the answer: each row carries its own verdict, and the drop plus every
   `drop` verdict reach the tray as one write. */
function today(){
  /* local date, not toISOString(): that is UTC, and near midnight it disagrees
     with the date `dg task drop` would file for the same act. */
  const t=new Date(), p=n=>String(n).padStart(2,"0");
  return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
}

async function askFallout(tid){
  const w=($("#dwhy")&&$("#dwhy").value.trim())||"";
  if(!w){ say("Say why it is not being done — the record is the point.","bad"); return; }
  let res;
  try{ res=await api("/api/task-fallout?task="+encodeURIComponent(tid)); }
  catch(err){ say(err.message,"bad",tid); return; }
  if(res.error){ say(res.error,"bad",tid); return; }
  const rows=res.fallout||[];
  if(!rows.length) return dropWith(tid, w, []);   /* nothing standing: no question */

  /* Refused, not defaulted — the same refusal the CLI makes, with the same
     remedy attached rather than a bare "no". */
  let h=`<p class="warn">${rows.length} task(s) need a verdict before ${esc(tid)}
    can be dropped. Nothing is staged until each one is answered.</p>`;
  rows.forEach((r,i)=>{
    h+=`<div class="answer"><b>${esc(r.id)}</b> ${esc(r.title)}
      <div class="muted">${esc(r.why)}</div>
      <label style="display:inline;margin-right:12px">
        <input type="radio" name="fo${i}" value="keep" checked> still worth doing</label>
      <label style="display:inline">
        <input type="radio" name="fo${i}" value="drop"> drop it too</label></div>`;
  });
  h+=`<p style="margin:10px 0"><button class="primary" id="foGo">Drop ${esc(tid)}</button>
      <button class="ghost" id="foNo">Cancel</button></p>
      <div class="note" id="note"></div>`;
  $("#side").innerHTML=h;
  $("#foNo").onclick=()=>taskPanel();
  $("#foGo").onclick=()=>{
    const doomed=rows.filter((r,i)=>
      $("#side").querySelector(`input[name=fo${i}]:checked`).value==="drop")
      .map(r=>r.id);
    dropWith(tid, w, doomed);
  };
}

/* The drop and its cascade, as one write. `dg task drop` builds exactly this
   list and hands it to `_tstage_all`; a task named in `--drop-too` has its
   *own* fallout left unwalked here too — one command, one judgement, and
   `dg check` picks up whatever the cascade releases. */
function dropWith(tid, why, doomed){
  const date=today();
  postTasks([{op:"set_status",task:tid,status:"DROPPED",why,date}].concat(
    doomed.map(t=>({op:"set_status",task:t,status:"DROPPED",
                    why:`abandoned along with ${tid}`,date}))));
}

/* A reference to a node in either store, clickable when it resolves. A
   dangling one is shown as what it is rather than hidden — `dg check` reports
   it and the panel should not disagree. */
function dgLink(id, dangling){
  if(dangling) return `${esc(id)} <span class="muted">(not in the store)</span>`;
  return `<a href="#" data-dg="${esc(id)}">${esc(id)}</a>`;
}

/* Follow a reference across the two stores. In the decisions or tasks tab a
   link into the *other* store switches tab first, rather than selecting
   something the current view cannot show. */
function jump(id){
  const isTask = T && T.tasks.some(x=>x.id===id);
  const known = isTask || G.vertices.some(v=>v.id===id);
  if(!known) return;
  const need = isTask ? "tasks" : "decisions";
  if(tab!=="joined" && tab!==need){
    tab=need; tabs(); chips(); layout(); fit();
  }
  select(id);
}

/* A list of decision ids, each a link. Not decoration: an edge's targets are
   the edge, and following one is how the graph gets read. A target naming no
   vertex is shown as what it is, the same way `dgLink` does everywhere else —
   `dg check` reports it and the panel must not paper over it. */
function idList(ids, empty){
  const known=new Set(G.vertices.map(x=>x.id));
  return (ids&&ids.length)
    ? ids.map(id=>dgLink(id, !known.has(id))).join(", ") : (empty||"—");
}

/* One line of prose, escaped then rendered. Phrasing content only, for the one
   place a <p> would be wrong: inside a <summary>. */
function mdLine(s, fmt){
  return mdInline(esc(s||"").replace(/\n/g," ").trim(), fmt);
}

/* The active edge as a card of its own: the answer, and the four things that
   qualify it. `date` sits in the head rather than trailing `source`, because
   it dates the edge, not the citation. */
function edgeCard(e, children){
  return `<section class="edge-card" id="edge-card">
    <span class="edge-head">active edge<span class="when muted">${esc(e.date||"")}</span></span>
    <div class="kv">
      <div>opens</div><div>${idList(children, "TERMINAL")}</div>
      <div>falsifier</div><div>${esc(e.falsifier||"—")}</div>${
      e.probe ? `<div>probe</div><div>${esc(e.probe.kind)} <span class="muted">${
        esc(JSON.stringify(e.probe.args))}</span></div>` : ""}
      <div>source</div><div>${esc(e.source||"—")}</div>
    </div>
    <div class="answer">${mdFold(e.answer, e.format)}</div></section>`;
}

/* A superseded edge, shown as the edge it is. Collapsed to the headline — what
   it said, what beat it, and why — with its own targets, falsifier, source and
   archived answer behind the disclosure. That last part is the point: without
   it, an active answer that explains its own reversal cannot be told apart
   from the record it replaced.

   A reversal imported from markdown, or made before those fields were kept,
   has nothing behind the disclosure; it is drawn flat rather than as a drawer
   that opens on nothing. The archived answer is rendered in this record's
   dialect — see the note on `format` in pending.py's reopen. */
/* An answer this project was offered and did not take. Its own card, never
   folded in with the superseded ones: a reversal says the project changed its
   mind, and this says somebody else answered the same question differently.
   Drawn as a reversal it would claim the first about a record where only the
   second happened. */
function declinedCard(x){
  let b=`<div class="kv"><div>from</div><div>${esc(x.from_source||"")}</div>`;
  if(x.source) b+=`<div>source</div><div>${esc(x.source)}</div>`;
  if(x.falsifier) b+=`<div>falsifier</div><div>${esc(x.falsifier)}</div>`;
  if(x.to&&x.to.length) b+=`<div>would open</div><div>${idList(x.to)}</div>`;
  b+=`</div><div class="answer">${mdFold(x.answer||"", x.format)}</div>`;
  return `<details class="edge-card super"><summary><span class="edge-head">offered and not adopted<span class="when muted">${
    esc(x.date||"")}</span></span></summary>${b}</details>`;
}

function supersededCard(x){
  const archived = x.answer && x.answer!==x.summary ? x.answer : null;
  const deep = (x.to&&x.to.length) || x.falsifier || x.source || archived;
  const head = `<span class="edge-head">superseded edge<span class="when muted">${esc(x.date||"")}</span></span>
    <div class="rev"><span class="was">${esc(x.summary||"")}</span> → <b>${esc(x.replaced_by||"(undecided)")}</b></div>
    ${x.why?`<div class="rev muted">${mdLine(x.why, x.format)}</div>`:""}`;
  if(!deep) return `<section class="edge-card super">${head}</section>`;
  let b=`<div class="kv"><div>opened</div><div>${idList(x.to)}</div>`;
  if(x.falsifier) b+=`<div>falsifier</div><div>${esc(x.falsifier)}</div>`;
  if(x.source) b+=`<div>source</div><div>${esc(x.source)}</div>`;
  b+=`</div>`;
  if(archived) b+=`<div class="answer">${mdFold(archived, x.format)}</div>`;
  return `<details class="edge-card super"><summary>${head}</summary>${b}</details>`;
}

/* One card per late result, each with its own reading. Per result rather than
   per decision, because the note is about *that* measurement — answering for
   two at once with one sentence is the box-tick this record exists not to be,
   which is why `dg confirm --against` refuses to default to "all of them". */
function lateEvidence(rows){
  let h=`<div class="answer"><b class="warn">Evidence read after this was
    settled.</b> <span class="muted">It has never been read against the
    answer.</span>`;
  rows.forEach(t=>{
    h+=`<div style="margin-top:9px">${dgLink(t.id)}
      <span class="muted">finished ${esc(t.done||"—")}</span>
      <div class="muted">${esc(t.outcome||"")}</div>
      <label>What does it show about the answer?</label>
      <input id="ev_${esc(t.id)}" placeholder="it confirms the answer, because…">
      <p style="margin:8px 0"><button class="ghost" data-ev="${esc(t.id)}">It confirms the answer</button></p>
      <p class="muted" style="margin:0">Or reopen below, if it does not.</p></div>`;
  });
  return h+`</div>`;
}

async function readEvidence(tid){
  const vid=sel, note=($("#ev_"+tid)||{}).value||"";
  if(!note.trim()){
    say("Say what it showed — without that the record says somebody clicked a button.","bad",vid);
    return;
  }
  try{
    const res=await api("/api/read-evidence",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({vertex:vid, task:tid, note:note.trim()})});
    TPEND=await api("/api/task-pending"); tray();
    /* Where it landed, said out loud: this is a *task* op staged from a
       decision panel, and a tray that gains a row the person cannot account
       for is worse than the button being absent. */
    say((res.notes||[]).join(" "), "ok", vid);
    if(vid===sel) panel();
  }catch(err){ say(err.message,"bad",vid); }
}

/* ---- the readings the page did not have ----------------------------------

   `depends on` is one hop, which is the neighbourhood rather than the
   reasoning. Each of these is computed by the function the CLI uses — a page
   deriving its own premise chain is the drift this tool exists to catch. */

async function showChain(vid){
  let r;
  try{ r=await api("/api/context?id="+encodeURIComponent(vid)); }
  catch(err){ say(err.message,"bad",vid); return; }
  if(r.error){ say(r.error,"bad",vid); return; }
  let h=`<h2>${esc(vid)} — what it rests on</h2>`;
  if(!r.chain.length) h+=`<p class="muted">Nothing. It is a root.</p>`;
  /* The reading first, because it is the reading: a chain with an unsettled
     link makes everything below it a bet rather than a conclusion. */
  if(r.shaky.length)
    h+=`<p class="warn">${esc(r.shaky.join(", "))} ${r.shaky.length===1?"is":"are"}
      not settled — anything resting on ${r.shaky.length===1?"it":"them"} is a
      bet on the answer, not a conclusion from it.</p>`;
  else if(r.chain.length)
    h+=`<p class="muted">Every premise below is settled.</p>`;
  r.chain.forEach(p=>{
    h+=`<div class="finding${p.shaky?"":" warning"}" style="border-left-color:${
      p.shaky?"var(--warn)":"var(--ok)"}">
      <b>${dgLink(p.id)}</b> ${esc(p.title)}
      <div class="muted">${esc(p.status)}${
        p.also_opened.length?` · also opened ${esc(p.also_opened.join(", "))}`:""}</div>
      ${p.answer?`<div>${mdFold(p.answer)}</div>`:""}
      ${p.falsifier?`<div class="muted">falsifier — ${esc(p.falsifier)}</div>`:""}
      ${p.depth < r.chain.length-1
        ? `<a href="#" class="muted" data-path="${esc(p.id)}|${esc(vid)}">the chain from here…</a>`
        : ""}</div>`;
  });
  h+=`<p style="margin:12px 0"><button class="ghost" id="chBack">Back to ${esc(vid)}</button></p>`;
  $("#side").innerHTML=h;
  $("#side").querySelectorAll("a[data-dg]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault(); jump(a.dataset.dg);
  });
  $("#side").querySelectorAll("a[data-path]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault();
    const [from,to]=a.dataset.path.split("|"); showPath(from,to);
  });
  $("#chBack").onclick=()=>{ sel=vid; panel(); };
}

/* `dg path`: how one decision rests on another, which the highlight cannot
   say — it shows a neighbourhood, and this is a single chain. */
async function showPath(a, b){
  let r;
  try{ r=await api(`/api/path?from=${encodeURIComponent(a)}&to=${encodeURIComponent(b)}`); }
  catch(err){ said(esc(err.message), "bad"); return; }
  let h=`<h2>${esc(a)} → ${esc(b)}</h2>`;
  if(r.error||!r.path.length){
    h+=`<p class="muted">${esc(r.error||"no path")}</p>`;
  }else{
    r.path.forEach((n,i)=>{
      h+=`<div style="margin:8px 0"><b>${dgLink(n.id)}</b> ${esc(n.title)}
        <span class="muted">${esc(n.status)}</span></div>`;
      if(n.because) h+=`<div class="muted" style="margin-left:12px">│ ${esc(n.because)}<br>▼</div>`;
    });
  }
  h+=`<p style="margin:12px 0"><button class="ghost" id="pBack">Back</button></p>`;
  $("#side").innerHTML=h;
  $("#side").querySelectorAll("a[data-dg]").forEach(x=>x.onclick=ev=>{
    ev.preventDefault(); jump(x.dataset.dg);
  });
  $("#pBack").onclick=()=>{ sel=a; panel(); };
}

/* `dg areas`: two blocks, never one table. The stores share their areas and
   not their vocabularies — a row summing OPEN with TODO would be counting
   questions and work as if they were the same thing. */
async function showAreas(){
  let r;
  try{ r=await api("/api/areas"); }catch(err){ said(esc(err.message), "bad"); return; }
  sel=null; tsel=null; NEWKIND=null; RELATING=null; draw();
  const block=(title, b)=>{
    if(!b) return "";
    let out=`<h3 style="font-size:12px;color:var(--dim);margin:14px 0 4px">${title}</h3><table>`;
    const statuses=[...new Set(Object.values(b.counts).flatMap(c=>Object.keys(c)))].sort();
    out+=`<tr><th>area</th>${statuses.map(s=>`<th>${esc(s)}</th>`).join("")}</tr>`;
    b.areas.forEach(a=>{
      const c=b.counts[a]||{};
      out+=`<tr><td>${esc(a)}</td>${statuses.map(s=>
        `<td>${c[s]?esc(c[s]):'<span class="muted">·</span>'}</td>`).join("")}</tr>`;
    });
    return out+`</table>`;
  };
  $("#side").innerHTML=`<h2>By area</h2>`+block("decisions", r.decisions)
    +block("work", r.tasks);
}

function panel(){
  const v=G.vertices.find(x=>x.id===sel), d=G.derived[sel];
  const e=G.edges.find(x=>x.from===sel&&x.active);
  const st=base(v.status);
  const decided = !!(e&&e.answer);
  let h=previewBanner(v.id)+`<h2>${esc(v.id)} — ${esc(v.title)}</h2>
    <span class="pill" style="background:${STATUS_COLOR[st]};color:#04121f">${esc(v.status)}</span>${
      (st==="OPEN" && (d.waiting_on||[]).length)
        ? ` <span class="muted">waits ${d.waiting_on.map(esc).join(", ")}</span>` : ""}
    <span class="muted"> ${esc(v.area)}</span>${tagPills(v.tags)}
    <div class="kv">
      <div>depends on</div><div>${idList(d.depends)}${
        d.depends.length?` <a href="#" data-chain="${esc(v.id)}" class="muted">why…</a>`:""}</div>`;
  /* Undecided, the targets are all the edge has, so they stay up here with the
     vertex's own facts. Decided, they are part of an answer and move into its
     card — an edge's targets belong to the edge that declared them. */
  if(!decided) h+=`<div>opens</div><div>${idList(d.children)}</div>`;
  /* The four fields the domains scaffold added, drawn where `dg node` draws
     them and only where present, so a store with none reads as it did
     (audit `N-F5`). The probe on a decided edge is in its card below. */
  if(v.binds&&v.binds.length)
    h+=`<div>bound to</div><div>${esc(v.binds.map(b=>`${b.kind}:${b.ref}`).join(", "))}</div>`;
  if(v.rule) h+=`<div>rule</div><div>${esc(v.rule)}</div>`;
  /* Every entry, the way a task's stops are drawn: the record is what this
     question was going to be judged by, and only the last is live — and only
     while the question is still open to be judged. */
  if(v.probes&&v.probes.length)
    h+=`<div>rule (probe)</div><div>${v.probes.map((p,i)=>
      `<span class="muted">${esc(p.date)}</span> ${esc(p.kind)} <span class="muted">${
        esc(JSON.stringify(p.args))}</span>${
        i===v.probes.length-1 && !decided ? ' <span class="pill">live</span>' : ""}`
      ).join("<br>")}</div>`;
  h+=`</div>`;
  /* Above the answer card, never below it: a reader who meets the caveat
     after the answer has already read the answer as *the* answer. Red rather
     than muted — this is a store `dg check` refuses, not a note. */
  if(d.rival_answers)
    h+=`<p class="wait" style="border-color:var(--bad)">${esc(d.rival_answers)}</p>`;
  if(decided) h+=edgeCard(e, d.children);
  else if(v.note) h+=`<div class="answer muted">${mdFold(v.note, v.format)}</div>`;
