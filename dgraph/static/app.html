<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --line:#2a323d; --ink:#e6edf3; --dim:#8b98a5;
    --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --prov:#39c5cf;
    --reop:#bc8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.2px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--dim);
    border-radius:99px;padding:2px 10px;cursor:pointer;font-size:12px}
  .chip.on{color:var(--ink);border-color:var(--accent);background:#1c2733}
  /* A claim is not a state of the record, so it is a mark *beside* the box and
     never a change to how the box itself reads — no restroking, no undashing.
     A task can be waiting on a premise and claimed at once, and the dashes are
     the first of those; a rule here that cleared them would hide one reading
     to show the other. `G-F5`. */
  .claim-dot{fill:var(--warn,#d8a657)}
  #q{border:1px solid var(--line);background:transparent;color:var(--ink);
    border-radius:99px;padding:3px 12px;font-size:12px;width:24ch;
    font-family:inherit;outline:none}
  #q:focus{border-color:var(--accent)}
  #q.bad{border-color:#e0533d}
  #qnote{font-size:11px;max-width:38ch;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .grow{flex:1}
  button.primary{background:var(--accent);color:#04121f;border:0;border-radius:6px;
    padding:5px 12px;font-weight:650;cursor:pointer}
  button.primary:disabled{opacity:.4;cursor:default}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);
    border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer}
  button.ghost:disabled{opacity:.45;cursor:default}
  .note{font-size:12px;margin-top:8px;white-space:pre-wrap}
  .note.wait{color:var(--prov)}
  /* markup, not a message: no pre-wrap, so it may be written across lines */
  p.wait{color:var(--prov);font-size:12px;margin:8px 0}
  .note.ok{color:var(--ok)}
  .note.bad{color:var(--bad)}
  .keys{color:var(--dim);font-size:11px;margin-top:6px}
  kbd{background:#0d1117;border:1px solid var(--line);border-radius:3px;
    padding:0 4px;font-size:10.5px;font-family:ui-monospace,monospace}
  main{flex:1;display:flex;min-height:0}
  #canvas{flex:1;overflow:hidden;position:relative}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg.drag{cursor:grabbing}
  .node rect{stroke-width:1.6px}
  .node text{font-size:11px;fill:var(--ink);pointer-events:none}
  .node .vid{font-weight:700;font-size:10.5px}
  .node{cursor:pointer}
  .node.dim{opacity:.16}
  /* Drawn *around* the box, never on it: the box's own stroke-dasharray
     already means something (OPEN, PROVISIONAL, a task waiting), and a second
     meaning on the same line would make two facts unreadable at once. */
  .node .bridge{fill:none;stroke:var(--dim);stroke-width:1.2px;
    stroke-dasharray:2 3;pointer-events:none}
  #focusChip{display:inline-flex;align-items:center;gap:2px;border:1px solid
    var(--accent);border-radius:999px;padding:0 2px 0 8px;background:var(--panel)}
  #focusChip[hidden]{display:none}
  #focusQ{border:0;background:transparent;color:var(--ink);font:inherit;
    font-size:11px;width:19ch;outline:none;padding:3px 0}
  #focusChip button{border:0;background:transparent;color:var(--dim);
    cursor:pointer;font-size:13px;line-height:1;padding:2px 6px}
  #focusChip button:hover{color:var(--ink)}
  #focusNote{font-size:11px}
  .edge{fill:none;stroke:var(--line);stroke-width:1.4px}
  /* Direction is the chevrons: one per rank the edge crosses, turned to
     the line's tangent (`edgeSvg`), coloured and faded by the same classes
     as the edge they sit on. Not a head at the landing: on a long edge the
     landing is far from most of the line, and a reader following it
     mid-way had no way to tell which end it was going to. */
  .chev{fill:none;stroke:var(--line);stroke-width:1.6px;pointer-events:none}
  .chev.hot,.chev.ghost,.chev.assumed{stroke:var(--accent)}
  .chev.hot{stroke-width:2.2px}
  /* On a preview edge the line is dashed and glowing, and an outline
     chevron vanished into it: these are filled and half again as large. */
  .chev.ghost,.chev.assumed,.chev.gone{fill:var(--accent);stroke-width:1.2px}
  .chev.gone{fill:var(--bad);stroke:var(--bad);opacity:.7}
  .chev.cross{stroke:var(--prov);opacity:.85}
  .chev.cross.evidence{stroke:var(--reop)}
  .chev.pending-dep{opacity:.75}
  .chev.assumed{opacity:.4}
  .chev.dim{opacity:.07}
  /* The wide invisible twin of every edge, so a 1.4px line can be hovered
     and clicked. */
  .hit{fill:none;stroke:transparent;stroke-width:12px;pointer-events:stroke;cursor:pointer}
  .edge.pending-dep{stroke-dasharray:3 4;opacity:.75}
  .edge.hot{stroke:var(--accent);stroke-width:2.4px}
  .edge.dim{opacity:.07}
  aside{width:420px;border-left:1px solid var(--line);background:var(--panel);
    overflow:auto;padding:14px}
  /* The two panels fold away for a canvas-only reading; `hidden` has to win
     over the display each one sets. */
  aside[hidden],footer[hidden]{display:none}
  /* The outcome of a tray action (D94): one line pinned above the trays,
     read with them folded or open, and never the inspector's third of the
     window. */
  #said{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);
    background:var(--panel);padding:5px 12px;font-size:12px;color:var(--ok)}
  #said[hidden]{display:none}
  #said.wait{color:var(--prov)}
  #said.bad{color:var(--bad)}
  #said .body{flex:1}
  #said .x{color:var(--dim)}   /* a dismiss, not a drop */
  #said .warn{margin-top:4px}
  #said ul{margin:2px 0 0 18px;padding:0;color:var(--dim)}
  aside h2{font-size:14px;margin:0 0 2px}
  .muted{color:var(--dim)}
  /* Monospace and dim: it is a token to compare against another token, and
     comparing hashes by eye is what a proportional font is worst at. */
  .build{color:var(--dim);font:11px/1 ui-monospace,SFMono-Regular,monospace;
    border:1px solid var(--line);border-radius:99px;padding:3px 8px}
  .build:empty{display:none}
  /* An area the graph has not used before. A mark, not a warning: nothing is
     wrong with a new area — see `dgraph/areas.py`. Audit `R-F7`. */
  .fresh-area{color:var(--warn,#d29922)}
  .kv{display:grid;grid-template-columns:92px 1fr;gap:3px 8px;margin:10px 0}
  .kv div:nth-child(odd){color:var(--dim)}
  .answer{background:#0d1117;border:1px solid var(--line);
    border-radius:6px;padding:9px 11px;margin:8px 0;font-size:12.5px}
  .answer p{margin:0 0 7px}
  .answer p:last-child{margin-bottom:0}
  .answer code{background:#1c2330;border-radius:3px;padding:0 4px;font-size:11.5px}
  /* The fold. `--fade` is the colour the body is read against, so the gradient
     has to be redeclared wherever the fold sits on a different card. */
  .fold{--fade:#0d1117}
  .fold .fold-body{max-height:7.6em;overflow:hidden;position:relative}
  .fold.open .fold-body{max-height:none}
  .fold .fold-body::after{content:"";position:absolute;left:0;right:0;bottom:0;
    height:2.4em;background:linear-gradient(transparent,var(--fade))}
  .fold.open .fold-body::after{display:none}
  .fold-tog{margin-top:6px;background:none;border:0;padding:0;cursor:pointer;
    font:inherit;font-size:11px;color:var(--accent)}
  .fold-tog:hover{text-decoration:underline}
  /* An edge, drawn as a card. A decision's payload hangs off one edge, and a
     reversal is a second edge carrying a payload of its own; rendering both as
     one column of prose is what made "which edge does this sentence belong to?"
     unanswerable — a surviving answer that explains its own reversal reads as
     commentary on the record it replaced. The card boundary is the answer. */
  .edge-card{border:1px solid var(--line);border-radius:8px;background:#11161d;
    padding:9px 11px;margin:10px 0}
  /* dashed, the same way the canvas draws an edge that is not load-bearing */
  .edge-card.super{border-style:dashed}
  .edge-card>.kv{margin:7px 0 0}
  .edge-card .answer{margin:8px 0 0}
  .edge-head{display:block;font-size:10.5px;font-weight:700;letter-spacing:.4px;
    color:var(--dim);text-transform:uppercase}
  .edge-head .when{font-weight:600;letter-spacing:0;text-transform:none;
    margin-left:6px}
  details.edge-card>summary{cursor:pointer;list-style:none;position:relative;
    padding-left:15px}
  details.edge-card>summary::-webkit-details-marker{display:none}
  details.edge-card>summary::before{content:"\25B8";position:absolute;left:0;top:0;
    color:var(--dim);font-size:11px;line-height:1.5}
  details.edge-card[open]>summary::before{content:"\25BE"}
  .rev{margin-top:3px;font-size:12.5px}
  .rev .was{text-decoration:line-through;opacity:.6}
  label{display:block;margin:9px 0 3px;color:var(--dim);font-size:12px}
  input,textarea,select{width:100%;background:#0d1117;color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
  textarea{min-height:78px;resize:vertical}
  select[multiple]{height:118px}
  /* The id picker: a filter over a checklist. A ctrl-click multi-select of
     fifty rows was a list to scroll, and clicking one row looked like
     nothing happened. */
  .picker-list{max-height:150px;overflow:auto;border:1px solid var(--line);
    border-radius:6px;background:#0d1117;padding:3px 6px;margin-top:4px}
  .picker-list label{display:block;font-size:12px;cursor:pointer;padding:2px 0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .picker-list label.off{display:none}
  .picker-list input{width:auto;margin:0 6px 0 0;vertical-align:middle}
  .picker-count{font-size:11px;color:var(--dim);margin:3px 0 6px}
  /* A disclosure for a control that is rarely wanted: the chip is the
     summary, the control is behind it. */
  details.more>summary{list-style:none;display:inline-block;margin:4px 0}
  details.more>summary::-webkit-details-marker{display:none}
  details.more[open]>summary{color:var(--ink);border-color:var(--accent)}
  footer{border-top:1px solid var(--line);background:var(--panel);max-height:34%;
    overflow:auto;padding:8px 12px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);
    vertical-align:top}
  th{color:var(--dim);font-weight:600}
  .x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:14px}
  .err{color:var(--bad);white-space:pre-wrap;font-size:12px;margin-top:8px}
  /* An advisory, not a failure: what moved under a batch that applied. */
  .warn{color:var(--warn);font-size:12px;margin-top:10px;margin-bottom:2px}
  .pill{display:inline-block;border-radius:99px;padding:0 7px;font-size:10.5px;
    font-weight:700;letter-spacing:.3px}
  .tab{border:1px solid var(--line);background:transparent;color:var(--dim);
    border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12px;font-weight:600}
  .tab.on{color:#04121f;background:var(--accent);border-color:var(--accent)}
  /* the join, drawn as an edge between the two stores: never solid, so it can
     never be mistaken for a dependency inside either graph */
  /* The preview (D88): what an act would add is a ghost, what it would
     remove is struck, what it would move is ringed — drawn as a difference
     against the store, never as a redrawn store. */
  .node.ghost rect{stroke:var(--accent);stroke-dasharray:2 3;stroke-width:2px}
  .node.ghost{filter:drop-shadow(0 0 5px var(--accent))}
  .node.moved{filter:drop-shadow(0 0 4px var(--accent))}
  /* Assumed: added by an earlier act this one rests on (D89) — a ghost
     without the glow, and dimmer, so it reads as context, not as the change. */
  .node.assumed rect{stroke:var(--accent);stroke-dasharray:2 3;opacity:.55}
  .node.assumed text{opacity:.5}
  .edge.assumed{stroke:var(--accent);stroke-dasharray:6 4;opacity:.4}
  .node.gone rect{stroke:var(--bad);opacity:.45}
  .node.gone text{opacity:.4}
  .node.gone .strike{stroke:var(--bad);stroke-width:1.6px}
  .node.moved rect{stroke-width:2.4px}
  .node .pv{font-size:9px;fill:var(--accent);font-weight:700}
  .edge.ghost{stroke:var(--accent);stroke-dasharray:6 4;stroke-width:1.8px}
  .edge.gone{stroke:var(--bad);stroke-dasharray:2 4;opacity:.7}
  #previewBar{position:absolute;left:10px;top:8px;right:10px;z-index:2;
    display:flex;gap:10px;align-items:center;font-size:12px;
    background:var(--panel);border:1px solid var(--accent);border-radius:8px;
    padding:5px 10px;color:var(--ink)}
  #previewBar[hidden]{display:none}
  #previewBar .grow{flex:1}
  .edge.cross{stroke:var(--prov);stroke-dasharray:2 5;opacity:.85}
  .edge.evidence{stroke:var(--reop)}
  /* One act, one block: a rule down its left edge, no rule between its rows,
     and the spanning control cell drawn as part of the block. */
  tr.act>td:first-child{border-left:2px solid var(--accent);padding-left:8px}
  tr.act:not(.act-last)>td{border-bottom:0}
  td.act-ctl{vertical-align:middle;border-bottom:1px solid var(--line)}
  .tray-split{display:flex;gap:18px;align-items:flex-start}
  .tray-split>div{flex:1;min-width:0}
  .tray-split h3{font-size:11px;margin:0 0 4px;color:var(--dim);
    font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;
    margin-right:4px;vertical-align:middle}
  /* The soundness chip. Quiet when the store is clean — it is not shown at
     all — so its appearing is the whole signal. */
  .chip.bad{color:var(--bad);border-color:var(--bad)}
  .chip.warn{color:var(--warn);border-color:var(--warn)}
  .finding{border-left:2px solid var(--bad);padding-left:9px;margin:9px 0}
  /* A chain entry has no card behind it, so its fold fades to the panel. */
  .finding .fold{--fade:var(--panel)}
  .finding.warning{border-left-color:var(--warn)}
  .finding b{font-size:11px;letter-spacing:.3px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Development graph</h1>
    <!-- The commit the *server* is running, not the page: the page is served
         by that same process, so one stamp answers for both. A number would go
         here instead once there is one worth showing; while this is beta there
         is not, and a stale number in a header is believed. -->
    <span class="build" id="build" title="The commit this dg was installed from. Compare it with `git log -1 --format=%h` where you installed from."></span>
    <span id="tabs"></span>
    <span class="muted" id="counts"></span>
    <span id="statusChips"></span>
    <button class="chip" id="newBtn" title="Open a question, or record a piece of work">+ new</button>
    <button class="chip" id="soundBtn" style="display:none"></button>
    <button class="chip" id="areasBtn" title="Counts by area and status, one block per store">areas</button>
    <button class="chip" id="frontierOnly">frontier only</button>
    <button class="chip" id="deselectBtn" hidden title="Close the inspector and clear the selection: nothing dimmed, the way the page opens. Esc does the same outside a field.">&times; inspector</button>
    <button class="chip" id="focusBtn" title="Keep only a slice and re-lay it out; lit while one is up, and a press then drops it. With a node selected: that node's subgraph, one hop. Otherwise, with a query in the find box: exactly what the box matches, zero hops, and the box keeps its text. With neither, nothing. Same slice as `dg find --subgraph`.">&#8982; focus</button>
    <button class="chip" id="refreshBtn" title="Re-read both stores and both trays. Pan, zoom and the open inspector are kept.">&#8635; refresh</button>
    <button class="chip" id="trayBtn" title="Show or hide the trays. The count stays here while they are hidden.">tray</button>
    <input id="q" placeholder="find…" title="Same query language as `dg find`: a bare word searches prose, field:value matches one field, is:name asks a derived question, under:D04 matches everything below D04. `-` negates, `or` alternates. This box dims what does not match — to draw a slice on its own instead, use the focus chip.">
    <span class="muted" id="qnote"></span>
    <!-- The chip is the *seed*; `#q` beside it is the filter. Two roles, one
         input each: focus decides what is on the canvas, find decides what is
         lit up on it. Both are text, so both can be read, edited and pasted. -->
    <span id="focusChip" hidden>
      <input id="focusQ" spellcheck="false"
             title="`subgraph:N <query>` — N hops from whatever the query matches, `*` for the whole cone. A click seeds at 1; edit the number and it survives the next click. The same slice `dg find --subgraph --hops N` prints.">
      <button id="focusClear" title="Drop the focus and draw the whole graph again">&times;</button>
    </span>
    <span class="muted" id="focusNote"></span>
    <span class="grow"></span>
    <span class="legend" id="legend"></span>
    <button class="primary" id="applyBtn" disabled>Apply</button>
  </header>
  <main>
    <div id="canvas"><div id="previewBar" hidden></div><svg id="svg">
      <g id="viewport"></g></svg></div>
    <aside id="side" hidden><p class="muted">Click a node to inspect it.</p></aside>
  </main>
  <div id="said" hidden></div>
  <footer id="tray"></footer>
</div>

<script>
const AREA_COLOR = {};
const PALETTE = ["#1f6feb","#8957e5","#238636","#9e6a03","#1f7a8c","#bd561d"];
const STATUS_COLOR = {DECIDED:"var(--ok)",OPEN:"var(--bad)",BLOCKED:"var(--warn)",
                      PROVISIONAL:"var(--prov)",REOPENED:"var(--reop)"};
let G=null, PEND=[], sel=null, ED=null;
/* The server's commit, fetched once. `null` is "not asked yet" and `""` is
   "asked, and it would not say" — the second must not retry on every Apply. */
let BUILD=null;
/* The second store, and the reading that joins them. `T` is null in a project
   with no tasks.json — which is not the same as a project whose backlog is
   empty, and the tab says which. */
let T=null, TPEND=[], JOIN=null, tsel=null, TFAULT=null;
/* The preview (D88): while one is on, `G`, `T` and `JOIN` hold the previewed
   payloads and `STORE` keeps the store's, so every drawer and panel reads
   the previewed graph with the code it already has, and `previewOff` puts
   the store back in one assignment. `PREVIEW.diff` is what marks the
   drawing as a preview — see `previewMark`. */
let PREVIEW=null, STORE=null;
/* An edge selection: `{from, to}` while a click on an edge is the reading,
   or null. A node click asks "what is this connected to?" and lights the
   neighbourhood; an edge click asks "what is this one relation?", and the
   answer is the edge and its two ends, nothing else. The inspector shows
   the record the edge's answer lives on, the same as before. */
let ESEL=null;

/* What the four watched files looked like when this page last read them, and
   whether they have moved since. The poll writes STALE and nothing else: it
   never redraws.

   That restraint is the whole design and not caution. The canvas holds a pan,
   a zoom and an open inspector, and a poll that redrew would move all three
   under somebody mid-read — which is the same argument that keeps the graph
   routes reading the store while the tray keeps its own panel. So the page
   says *there is something to take* and the reader takes it.

   The alternative it replaces is worse than either: before this the page was
   a snapshot from the moment it loaded, refreshed only by the viewer's own
   staging, with nothing to say another writer had moved underneath it. */
let STAT=null, STALE=0, POLL=null, BOOTING=false;
/* The run this page was served by, captured once and never updated by a soft
   refresh — because a refresh re-reads the data but keeps the page's original
   token, so if it silently adopted the new run the warning would clear while
   writes still 403. Only a full reload (which re-fetches the page, and its
   token) resets this by re-running the script. `RESTARTED` latches so the line
   is said once. D98, audit AA-F1. */
let RUN0=null, RESTARTED=false;
/* The server's run id, from every `/api/stat`. First sight sets the origin;
   a later change means this page was served by an earlier run, so a write —
   which carries the page's now-stale token — will be refused. Say it above
   the trays before that happens, not as the 403 at submit. */
function noteRun(run){
  if(run==null) return;
  if(RUN0===null){ RUN0=run; return; }
  if(run!==RUN0 && !RESTARTED){
    RESTARTED=true;
    said("This page was served by an earlier run of <code>dg serve</code> — "
       + "reload it to write. Reads still work; anything typed here is not "
       + "saved, so copy it before reloading.", "bad");
  }
}
/* An editor's composed fields, waiting to be staged from the form (D99).
   Carries the fields the form cannot show; cleared when staged or recomposed. */
let COMPOSED=null;
/* The same, for the two forms that are not the decision inspector's close /
   reopen. The new-task form (T108) has no input for a composed `done_when` or
   `probe`, and carries the buffer's `format` so an org note is not stored as
   markdown; the shared Reword form (T110) has no input for a decision's `rule`
   or a task's `done_when`. Each is keyed so a fill meant for one record cannot
   be staged onto another, and cleared when its form is rebuilt or staged. */
let COMPOSED_ADD=null;
let COMPOSED_AMEND=null;
const POLL_EVERY = 4000;
let tab="decisions";
const TASK_COLOR = {TODO:"var(--warn)", DOING:"var(--accent)",
                    /* outstanding, so not dimmed like DROPPED; put down, so
                       not urgent like TODO */
                    PARKED:"var(--prov)",
                    DONE:"var(--ok)", DROPPED:"var(--dim)"};
/* Transient, per-decision, never persisted: the panel is rebuilt from scratch on
   every navigation, so anything the user has not committed yet has to live out
   here or it dies with the old DOM.

     DRAFTS   what is typed into a form but not staged
     NOTES    the last thing said about a decision, so a result that arrives
              after the user has navigated away is filed under the decision it
              is about rather than whichever one happens to be on screen
     EDITING  the decision an editor is currently open for, if any

   Deliberately in memory only. A draft that outlived a reload would be a draft
   the user has forgotten writing, and there is one buffer per project, so a
   restored EDITING could not refer to a live editor anyway. */
const DRAFTS={}, NOTES={};
let EDITING=null;
const TOKEN = document.querySelector('meta[name=dg-token]').content;
/* One filter, and it is a query string. The status chips and `frontier only`
   are sugar that edit this text rather than predicates of their own — the page
   used to carry a second copy in a shared `Set`, which is why selecting
   DECIDED and switching to the tasks tab emptied it. `FOUND` is what the
   server matched; `null` means "not filtered", which is a different thing from
   an empty list ("filtered, and nothing here"). */
let QUERY = "", FOUND = null, QSEQ = 0;

/* The focus chip, and it is a *different* filter from `QUERY` on purpose.
   `QUERY` dims: everything stays where it was and the matches are lit, which
   answers "where do these sit in the whole?". `FOCUS` removes and re-ranks, so
   the slice becomes the graph, which answers "what does this piece look like
   on its own?". Conflating them would lose one of the two questions.

   The membership is the server's, never worked out here. `cross.induced` walks
   decision→decision, task→task, `because` and `evidence_for` as one digraph —
   the same one the acyclicity proof walks — and this page holds `derived` and
   could close over it in five lines. It must not: two answers to "what is
   connected to D04" agree right up until the day they do not, and there would
   be no way to tell which one was lying. */
let FOCUS = null, FSEQ = 0;

const base = s => s.split(":")[0];
const $ = s => document.querySelector(s);

async function api(path, opts){
  opts = opts || {};
  /* On every request, not only the mutating ones. Sending it as a custom
     header is most of the point: a no-cors request cannot carry one at all,
     and a cors one triggers a preflight this server never answers — so the
     header is what keeps another page from reaching a guarded route, with the
     token's secrecy the smaller half.

     This used to be conditional on the method, which was fine while every GET
     returned a fixed payload. `/api/find` runs a caller-supplied regex, so its
     cost is chosen by whoever calls it; sending the token unconditionally
     means the next route like it is covered on the day it is written rather
     than the day somebody notices. */
  opts.headers = Object.assign({"X-DG-Token":TOKEN}, opts.headers||{});
  const r = await fetch(path, opts);
  const j = await r.json().catch(()=>({error:"bad response"}));
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

/* Fetched into locals and published in one go, because `boot()` runs again
   after Apply and after an `add` — over a canvas whose nodes are already on
   screen and already bound to `select`. Assigning `G` at the top left six
   awaits during which the old boxes were clickable and `G.xy` belonged to
   nobody: the click called `draw()`, `xyOf` read a layout that did not exist
   yet, and the exception took the redraw with it. The window is milliseconds
   on localhost, which is exactly long enough to hit and far too short to
   suspect. Nothing is published until every payload is in hand and the layout
   for it has been computed, so there is no moment when the graph on screen and
   the graph in `G` disagree. */
async function boot(){
  const g = await api("/api/graph");
  /* `null` is the server's word for "this project has no tasks.json". A
     store that does not load — a merge left conflict markers in it — is a
     500, and mapping that to `null` too made the tab say the file was absent
     beside a findings chip saying it could not be read. The reason is kept
     so `tabs()` can tell the two apart. Audit `AA-F3`. */
  let tfault = null;
  const t = await api("/api/tasks").catch(err=>{ tfault = err.message; return null; });
  const join = await api("/api/joined").catch(()=>({by_decision:{}}));
  const pend = await api("/api/pending");
  const tpend = t ? await api("/api/task-pending").catch(()=>[]) : [];
  ED = ED || await api("/api/editor").catch(()=>
    ({available:false, reason:"the server did not answer /api/editor"}));
  /* Once per page, not once per boot: `boot()` runs again after every Apply,
     and the process answering cannot have changed its own commit between two
     of them. A server too old to answer leaves the stamp empty, which `:empty`
     hides — an unlabelled blank chip in the header would be worse than no
     chip at all. */
  if(BUILD===null){ BUILD = await api("/api/health").then(h=>h.version||"")
                                                    .catch(()=>""); }
  /* Read *with* the payloads, not after them: a token taken later would
     describe a store this page never drew, and the first poll after it would
     call the page current while it was already behind. Every existing caller
     of `boot()` — Apply, a staged op, a discard — therefore clears the badge
     without knowing this exists, which is the point of putting it here rather
     than in the click handler. */
  const st = await api("/api/stat").catch(()=>null);
  G = g; T = t; TFAULT = tfault; JOIN = join; PEND = pend; TPEND = tpend;
  if(st){ STAT = st; STALE = 0; noteRun(st.run); }
  /* One palette across both stores, so an area is the same colour whichever
     graph you are looking at — that is most of what makes the joined view
     readable. Task-only areas are appended rather than recoloured. */
  const areas=[...new Set([...G.areas, ...(T?T.areas:[])])];
  areas.forEach((a,i)=>AREA_COLOR[a]=PALETTE[i%PALETTE.length]);
  ALL_AREAS = areas;
  if(tab!=="decisions" && !T) tab="decisions";
  bindQuery();
  bindFocus();
  /* The stores were just re-read, so the slice may name records that have
     gone. Re-asking is cheaper than reconciling, and it is the same question.
     `layout()` below runs against the *old* set for one frame; `runFocus`
     re-lays out when it lands, which is what `relayout` is for. */
  if(FOCUS) runFocus();
  STORE=null;
  layout();
  $("#build").textContent = BUILD;
  await soundness();
  tabs(); chips(); legend(); draw(); tray();
  /* The stores were re-read, so a preview that was on is asked for again
     over them — and cleared, with the reason, if its act has gone (applied
     or dropped). `boot()` runs after every Apply, which is how a ✓ on the
     previewed act ends the preview without a handler knowing about it. */
  if(PREVIEW) await previewOn(PREVIEW.scope, true);
}
let ALL_AREAS=[];

/* ---- staying current ---- */

/* What the button says. `STALE` is a count of ops rather than a flag because
   "3 ops staged" and "something changed" are different invitations, and the
   first is the one a supervisor can price before clicking. A change with no
   ops behind it — somebody applied a batch, another writer's `dg decide`
   landed — has no number, and gets the dot alone rather than `0`. */
function refreshBadge(){
  const b=$("#refreshBtn"); if(!b) return;
  const moved = STALE !== 0;
  b.classList.toggle("on", moved);
  b.textContent = !moved ? "\u21bb refresh"
    : STALE > 0 ? `\u21bb refresh \u25cf${STALE}` : "\u21bb refresh \u25cf";
  b.title = !moved
    ? "Re-read both stores and both trays. Pan, zoom and the open inspector are kept."
    : (STALE > 0
        ? `${STALE} op(s) are staged that this page has not read. Click to take them; pan, zoom and the open inspector are kept.`
        : "Both stores or a tray moved since this page read them. Click to take it; pan, zoom and the open inspector are kept.");
}

/* Has anything a reading of this project depends on moved? One small request,
   answered by `stat` on four files, reading no content — so this can run for
   as long as a browser is open without being the reason the machine is busy.

   It draws nothing. See `STAT` above for why that is the design and not
   timidity. */
async function pollStat(){
  if(BOOTING || document.hidden) return;
  let now; try{ now = await api("/api/stat"); }catch(err){ return; }
  /* Before the token check below: a restart that leaves the files untouched
     does not move `token`, so this is the one signal the poll has that the
     server was replaced, and it must not be skipped by the unchanged-token
     early return. */
  noteRun(now.run);
  const before = STAT ? JSON.stringify(STAT.token) : null;
  if(before === null){ STAT = now; return; }
  if(JSON.stringify(now.token) === before) return;
  /* The **difference** in staged ops, not the total. A tray holding twelve
     ops this page has already drawn is not news; three arriving since is. A
     negative difference — somebody applied or discarded — is a change with no
     number to offer, so it reports the dot alone rather than a count that
     would read as newly staged work. */
  const gained = (now.staged||0) - (STAT.staged||0);
  STALE = gained > 0 ? gained : -1;
  refreshBadge();
}

/* Take what the poll found. The three things kept are the three the reader
   would otherwise have to rebuild by hand, and losing any of them is what
   makes people stop pressing a refresh button.

   `fit()` is deliberately **not** called — it resets the viewport, which is
   right after Apply (the graph may have changed shape) and wrong here, where
   somebody is looking at one corner of it. The existing callers pass their
   own `fit()`; this one does not, which is why `boot()` never called it. */
async function refresh(){
  if(BOOTING) return;
  BOOTING = true;
  /* **Dropped before `boot()`, restored after it**, and the order is the whole
     of it. `boot()` ends by calling `draw()`, and `drawDecisions` reads
     `G.derived[sel].depends` to dim what the selection is unrelated to — so a
     `sel` naming a record this refresh is about to *remove* throws inside
     `boot`, before anything below runs. The button then cleared its own badge
     in `finally` and left the panel drawing the vanished record: the exact
     staleness it exists to end, arriving through it.

     The discard path already does this (`sel=null; tsel=null; await boot()`)
     and its reason was never written down, so this one was written without it.
     Reading a node out of the graph is not a case a caller may opt into
     handling — every caller of `boot()` that can drop a node has to clear
     first. */
  const keep = cur();
  sel = null; tsel = null;
  try{
    await boot();
    /* Reselect only if it survived. A node another writer dropped cannot be
       re-shown, and `select()` redraws and repaints the panel, so the kept
       inspector costs nothing extra. */
    reselect(keep);
  }catch(err){ said(esc(err.message), "bad"); }   /* no record to say it under: D94's line (Z-F4) */
  finally{ BOOTING = false; refreshBadge(); }
}

let QTIMER=null;
function bindQuery(){
  const box=$("#q");
  if(box.dataset.bound) return;      /* boot() runs again after Apply */
  box.dataset.bound="1";
  box.oninput=()=>{
    /* Debounced: the query runs server-side so that the page and `dg find`
       cannot disagree about what a term means, and that is a request per
       keystroke otherwise. */
    clearTimeout(QTIMER);
    QTIMER=setTimeout(()=>setQuery(box.value), 160);
  };
  box.onkeydown=e=>{
    if(e.key==="Enter"){ clearTimeout(QTIMER); setQuery(box.value); }
    if(e.key==="Escape"){ box.value=""; setQuery(""); box.blur(); }
    e.stopPropagation();             /* the canvas owns arrows and +/- */
  };
}

/* The three readings. `joined` is the one neither store can produce alone: it
   is the whole reason the two are linked rather than merged. */
function tabs(){
  const names=[["decisions","decisions"],["tasks","tasks"],["joined","joined"]];
  $("#tabs").innerHTML=names.map(([k,label])=>{
    const off = k!=="decisions" && !T;
    /* Two facts, told apart: no file, or a file that could not be read. */
    const why = TFAULT
      ? `tasks.json could not be read — see the findings chip. ${esc(TFAULT)}`
      : "this project has no tasks.json";
    return `<button class="tab${k===tab?" on":""}" data-t="${k}"${off?` disabled title="${why}"`:""}>${label}</button>`;
  }).join(" ");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(b.disabled) return;
    tab=b.dataset.t; sel=null; tsel=null; ESEL=null;
    /* The focused set does not change with the tab — it is one slice of both
       stores, and switching view must not silently change what you are looking
       at. What changes is whether a bridge is drawable, so a node marked
       "reached through work" on the decisions tab loses the mark on the joined
       tab, where the hop is a line you can see. */
    tabs(); chips(); layout(); fit(); draw();
    $("#side").innerHTML=`<p class="muted">Click a node to inspect it.</p>`;
  });
}

/* ---- the one filter -------------------------------------------------------

   Everything that hides a node goes through `runQuery`. The chips compose
   query text; they do not test statuses themselves. */

/* Positive terms only. A hand-typed `-status:DECIDED` is the reader's, not the
   chips', and a click that silently deleted it would be losing typing. */
const STATUS_RE = /(^|\s)status:[^\s]+(\s+or\s+status:[^\s]+)*/g;
const LIVE = "is:unsettled or is:outstanding";

function statusesIn(text){
  const out = new Set();
  (text.match(/(?:^|\s)status:[^\s]+/g) || []).forEach(m =>
    out.add(m.trim().slice("status:".length)));
  return out;
}

function withStatuses(text, set){
  /* Rewrite the status run in place rather than appending: two runs would be
     ANDed, and `status:OPEN status:DECIDED` matches nothing, which reads as a
     broken chip rather than as the contradiction it is. */
  const rest = text.replace(STATUS_RE, " ")
    /* Stripping a run can strand the `or` that joined it to a term the chips
       do not own, and a dangling `or` is a parse fault rather than a filter. */
    .replace(/\s+or\s+or\s+/g, " or ").replace(/^\s*or\s+|\s+or\s*$/g, "")
    .replace(/\s+/g, " ").trim();
  const grp = [...set].sort().map(s => "status:" + s).join(" or ");
  return [grp, rest].filter(Boolean).join(" ");
}

function setQuery(text){
  QUERY = text.trim();
  const box = $("#q");
  if(box.value.trim() !== QUERY) box.value = QUERY;
  runQuery();
}

async function runQuery(){
  const seq = ++QSEQ;
  if(!QUERY){ FOUND = null; $("#qnote").textContent = ""; syncChips(); draw(); return; }
  let r;
  try { r = await api("/api/find?q=" + encodeURIComponent(QUERY)); }
  catch(e){
    /* A transport failure is a fault like a bad query, said in the same
       slot. It used to `return`, which left the query in the box and the
       previous answer on the canvas as though it were this one: against a
       restarted server (`/api/find` is guarded, so a stale token is a 403)
       or a stopped one, the OPEN chip lit and every DECIDED node stayed
       drawn. Audit `AA-F1`, verified in Chrome. */
    if(seq !== QSEQ) return;
    r = {fault: e.message};
  }
  /* A slow answer to an old keystroke must not overwrite a fast answer to a
     new one. */
  if(seq !== QSEQ) return;
  if(r.fault){
    FOUND = null;
    $("#qnote").textContent = "⚠ " + r.fault;
    $("#q").classList.add("bad");
  } else {
    /* An empty `matched` is not "no filter": every lookup into `{}` is
       `undefined`, which `passes` reads as unfiltered, so the canvas drew the
       whole graph under a "0 matches" label — the one reading worse than
       either honest answer. `null` is how the server says "not filtered", and
       nothing else may mean it. */
    const m = r.matched;
    FOUND = (m && Object.keys(m).length) ? m : null;
    $("#q").classList.remove("bad");
    const n = Object.values(FOUND || {}).reduce((a, x) => a + x.length, 0);
    $("#qnote").textContent = FOUND ? n + " match" + (n === 1 ? "" : "es") : "";
  }
  syncChips();
  draw();
}

/* ---- focus: the second filter, which removes rather than dims ------------ */

/* `subgraph:<N|*> <seed query>`. The prefix is this page's spelling of the two
   CLI flags — `--subgraph --hops N` — and never a term in the query language:
   `parse` has no `subgraph` field and must not grow one, because it is not a
   question about a record, it is how far to walk from the records that match.
   So it is stripped here and sent as a parameter. */
const FOCUS_RE = /^\s*subgraph:(\*|\d+)(?:\s+|$)/;

function parseFocus(text){
  const m = String(text||"").match(FOCUS_RE);
  return {hops: m ? (m[1]==="*" ? null : parseInt(m[1],10)) : null,
          seed: (m ? text.slice(m[0].length) : String(text||"")).trim()};
}

function focusText(seed, hops){
  return `subgraph:${hops==null?"*":hops} ${seed}`.trim();
}

/* Whether an id survives the focus. `true` when nothing is focused, so every
   caller reads the same whether or not a chip is up. */
function inFocus(id){ return !FOCUS || FOCUS.ids.has(id); }

/* Why this id is on a canvas that cannot draw the edge that brought it in, or
   null. Only ever set for a hop the *server* saw; the page cannot know it,
   which is the point of shipping it.

   Silent when *everything* drawn is bridged — seed a task and the decisions
   tab is nothing but nodes reached through work, and a ring around every one
   of them distinguishes nothing while making the canvas look broken. The fact
   is still worth one sentence, so it moves to the note beside the chip. A mark
   earns its place by being on some nodes and not others. */
function bridgeNote(id){
  if(!FOCUS || bridgeVisible() || ALL_BRIDGED) return null;
  return FOCUS.bridged[id] || null;
}

/* Set by `draw`, read by `bridgeNote` — of the nodes this tab actually puts on
   screen, is every one of them bridged? */
let ALL_BRIDGED = false;

/* The note is rewritten, never appended to. It was appended to, and the
   sentence then survived the tab switch that made it false: "all of it reached
   through the other store" stayed on screen on the joined tab, which draws
   every bridge as a line. Whether it holds is a fact about the tab, so it is
   recomputed for whichever tab is drawing. */
let FNOTE = "";

function markBridged(ids){
  ALL_BRIDGED = !!(FOCUS && !bridgeVisible() && ids.length
                   && ids.every(id => FOCUS.bridged[id]));
  $("#focusNote").textContent = FNOTE + (ALL_BRIDGED
    ? " · all of it reached through the other store" : "");
}

/* The joined tab draws both stores, so every bridge on it is a line you can
   see and no node needs explaining. On the single-store tabs it does not. */
function bridgeVisible(){ return tab==="joined" && !!T; }

function setFocus(text){
  const box = $("#focusQ");
  if(box.value !== text) box.value = text;
  $("#focusChip").hidden = !text.trim();
  /* The button is lit exactly while a chip is up, whatever seeded it, so it
     reads as the state it toggles: a press with a slice showing drops the
     slice. Synced here and nowhere else, because every road to a chip —
     a node, the box, typing in the chip, `×`, Escape — ends in this call. */
  $("#focusBtn").classList.toggle("on", !!text.trim());
  runFocus();
}

async function runFocus(){
  const seq = ++FSEQ;
  const {hops, seed} = parseFocus($("#focusQ").value);
  if(!seed){ FOCUS = null; FNOTE = ""; relayout(); return; }
  let r;
  try {
    r = await api("/api/find?q=" + encodeURIComponent(seed)
                  + "&subgraph=" + (hops==null ? "" : hops));
  } catch(e){
    /* `runQuery`'s reason: a slice the server did not answer is a fault,
       said where a fault is said, with the previous slice kept. `AA-F1`. */
    if(seq !== FSEQ) return;
    r = {fault: e.message};
  }
  if(seq !== FSEQ) return;              /* an older seed, answered late */
  if(r.fault || !r.subgraph){
    /* The chip keeps its text and the canvas keeps its previous slice: a typo
       mid-edit must not blank the graph out from under the person typing. So
       `FOCUS` is left exactly as it was and nothing is re-laid out — only the
       note and the underline change. It used to null `FOCUS` and relayout,
       which drew the *whole* graph re-fitted on every transiently invalid
       keystroke (audit `U-F5`). A seed that matches nothing is not a fault:
       that is a result, and the empty canvas below is the honest drawing. */
    FNOTE = "\u26a0 " + (r.fault || "no slice");
    $("#focusNote").textContent = FNOTE;
    $("#focusQ").classList.add("bad");
    return;
  }
  const sg = r.subgraph;
  FOCUS = {seed, hops, ids: new Set([...sg.decisions, ...sg.tasks]),
           bridged: sg.bridged || {}};
  $("#focusQ").classList.remove("bad");
  const n = FOCUS.ids.size;
  FNOTE = `${n} in focus` + (hops==null ? "" : `, ${hops} hop${hops===1?"":"s"}`);
  relayout();
}

/* Focus changes which nodes exist, so the ranks and the extent are both stale
   — unlike `QUERY`, which only changes which of them are lit. `fit()` too:
   a slice of six nodes left at the whole graph's zoom is a canvas of empty. */
function relayout(){ layout(); fit(); draw(); }

/* Seeding from a node keeps the hop count, because the hop count is the
   reader's setting and the seed is the reader's gesture. Replacing both would
   throw away a `subgraph:1` they had deliberately typed.

   A fresh chip seeded from a node starts at one hop, not the whole cone. `*`
   is unbounded in *every* direction, and on any connected graph that is every
   node there is: the first focus drew the same picture re-fitted, and the
   reader could not tell it had happened (the docstring on `cross.induced` had
   said one hop all along). The hop count typed into a chip already up is
   kept, `*` included — only an empty chip gets the default. */
const DEFAULT_HOPS = 1;

function focusOn(id){
  const box = $("#focusQ");
  const hops = box.value.trim() ? parseFocus(box.value).hops : DEFAULT_HOPS;
  setFocus(focusText("id:" + id, hops));
}

/* The find box's text becomes the seed, at zero hops, and the box keeps it
   (D93). Zero because the reader typed a *set*, not a node to grow from:
   `is:unsettled or is:outstanding` promoted at one hop would draw the
   frontier and everything it rests on, which is not what was typed, and the
   number is one edit in the chip away. The box is left alone because its
   text is the reader's, and because the two filters stay two inputs under
   D64 — the box now dims within the slice it just seeded, which on the first
   frame lights everything, and that is the honest reading of "all of these
   match". Promoting is a snapshot, not a binding: editing the box afterwards
   dims, it does not re-slice, so a half-typed query never re-lays the canvas
   out on every keystroke. */
function focusQuery(){
  setFocus(focusText(QUERY, 0));
}

function bindFocus(){
  const btn = $("#focusBtn"), box = $("#focusQ");
  /* A toggle. Lit, with a slice up: the press drops it, and the canvas is
     the whole graph again with the find box still dimming — the same set,
     now lit over the rest instead of drawn alone. Unlit, three cases in
     order: a node selected, focus it — the press is about the node just
     clicked; else text in the find box, promote it; else nothing. Dropping
     wins over re-seeding while a slice is up because a selected node is the
     ordinary reading state inside a slice, and a press that re-sliced from
     it would leave the toggle no way off. Seeding from another node is two
     presses: off, click, on.

     The button used to *arm* instead, and the next node click seeded; the
     arm was a one-shot so the click after it could read inside the slice.
     That state bought nothing a selection does not: a click selects, and a
     press then focuses, and the record you focused is open beside it, which
     is the next thing wanted anyway. So the arm went with D93 rather than
     growing a third meaning. */
  btn.onclick = () => {
    if(box.value.trim()) setFocus("");
    else if(cur()) focusOn(cur());
    else if(QUERY) focusQuery();
  };
  $("#focusClear").onclick = () => setFocus("");
  if(box.dataset.bound) return;        /* boot() runs again after Apply */
  box.dataset.bound = "1";
  let timer = null;
  box.oninput = () => { clearTimeout(timer);
                        timer = setTimeout(() => setFocus(box.value), 160); };
  box.onkeydown = e => {
    if(e.key==="Enter"){ clearTimeout(timer); setFocus(box.value); }
    if(e.key==="Escape"){ setFocus(""); box.blur(); }
    e.stopPropagation();
  };
}

function syncChips(){
  const on = statusesIn(QUERY);
  $("#statusChips").querySelectorAll("button").forEach(b =>
    b.classList.toggle("on", on.has(b.dataset.s)));
  $("#frontierOnly").classList.toggle("on", QUERY.includes(LIVE));
}

function toggleStatus(s){
  const set = statusesIn(QUERY);
  set.has(s) ? set.delete(s) : set.add(s);
  setQuery(withStatuses(QUERY, set));
}

function toggleLive(){
  setQuery(QUERY.includes(LIVE)
    ? QUERY.replace(LIVE, "").replace(/\s+/g, " ").trim()
    : (QUERY ? LIVE + " " + QUERY : LIVE));
}

/* `matched` omits a store the query is not about, and that absence means "this
   tab is not filtered" — as opposed to an empty list, which means "filtered,
   and nothing here matches". Conflating the two would blank a tab whenever
   somebody searched a field the other store owns. */
function passes(kind, id){
  if(!FOUND) return true;
  const hits = FOUND[kind];
  return hits === undefined ? true : hits.includes(id);
}

function chips(){
  if(tab==="tasks"){ taskChips(); return; }
  const seen = [...new Set(G.vertices.map(v=>base(v.status)))].sort();
  $("#statusChips").innerHTML = seen.map(s=>
    `<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join(" ");
  $("#statusChips").querySelectorAll("button").forEach(b=>
    b.onclick=()=>toggleStatus(b.dataset.s));
  $("#frontierOnly").onclick = toggleLive;
  syncChips();
  const c={}; G.vertices.forEach(v=>c[base(v.status)]=(c[base(v.status)]||0)+1);
  let txt = G.vertices.length+" decisions · "+
    Object.entries(c).map(([k,n])=>`${n} ${k.toLowerCase()}`).join(", ");
  if(tab==="joined" && T) txt += `  ·  ${T.tasks.length} tasks`;
  $("#counts").textContent = txt;
}

function taskChips(){
  const seen=[...new Set(T.tasks.map(x=>x.status))].sort();
  $("#statusChips").innerHTML = seen.map(s=>
    `<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join(" ");
  $("#statusChips").querySelectorAll("button").forEach(b=>
    b.onclick=()=>toggleStatus(b.dataset.s));
  $("#frontierOnly").onclick = toggleLive;
  syncChips();
  /* `ready` here is the cross-graph one: prerequisites resolved *and* the
     premise settled. Reporting the task store's own narrower answer would
     promise work that `dg task start` is about to say is blocked. */
  const ready=T.frontier.filter(id=>T.derived[id].cross.ready).length;
  $("#counts").textContent = T.tasks.length+" tasks · "+
    Object.entries(T.counts).map(([k,n])=>`${n} ${k.toLowerCase()}`).join(", ")+
    `  ·  ${ready} ready`;
}

function legend(){
  $("#legend").innerHTML = G.areas.map(a=>
    `<span><i style="background:${AREA_COLOR[a]}"></i>${esc(a)}</span>`).join("");
}

/* ---- layered DAG layout: rank by longest path, barycentre within rank ----
   One implementation for all three views. It knows nothing about decisions or
   tasks: give it ids, a rank per id, and the two neighbour functions, and it
   gives back positions. The joined view is only possible because of that — it
   ranks over the union of both graphs plus the links between them. */
const NW=168, NH=46, GAPX=26, GAPY=64;

function layerLayout(ids, rankOf, upOf, downOf){
  /* An edge spanning more than one rank is broken into a chain of placeholder
     nodes, one per rank it crosses. That is what stops it being drawn straight
     through the boxes in between: measured on the generated stores, 46% of all
     edges span more than one rank and **98-99% of those crossed a node box**
     before this. With the placeholders it is 0%.

     They are not here to reduce crossings, and it is worth saying so because
     the obvious metric says they make it slightly worse (about 6%). A straight
     line between two well-placed endpoints already routes well; what it does
     not do is get out of the way of anything. */
  const rk={}, up={}, down={}, chains=[];
  ids.forEach(id=>{ rk[id]=rankOf(id); });
  const link=(a,b)=>{ (down[a]=down[a]||[]).push(b); (up[b]=up[b]||[]).push(a); };
  let seq=0;
  const all=[...ids];
  ids.forEach(a=>{
    (downOf(a)||[]).forEach(b=>{
      if(!(b in rk)) return;              // an id outside this view
      const gap=rk[b]-rk[a];
      if(gap<=1){ link(a,b); return; }
      let prev=a; const chain=[a];
      for(let r=rk[a]+1;r<rk[b];r++){
        const d="\u0000bend"+(seq++);
        all.push(d); rk[d]=r; link(prev,d); prev=d; chain.push(d);
      }
      link(prev,b); chain.push(b); chains.push(chain);
    });
  });

  const layers={};
  all.forEach(id=>{ (layers[rk[id]]=layers[rk[id]]||[]).push(id); });
  const ranks=Object.keys(layers).map(Number).sort((a,b)=>a-b);
  ranks.forEach(r=>layers[r].sort());
  const pos={};
  const index=()=>ranks.forEach(r=>layers[r].forEach((id,i)=>pos[id]=i));
  index();
  const mean=(list)=>{ const k=(list||[]).filter(i=>i in pos);
    return k.length?k.reduce((s,i)=>s+pos[i],0)/k.length:null; };
  /* Four sweeps, and no more: the barycentre sort reaches a fixed point almost
     at once. Measured at 8, 16, 24, 32 and 48 sweeps it returns the identical
     crossing count, so anything above four is time spent for nothing. */
  for(let sweep=0;sweep<4;sweep++){
    const down_ = sweep%2===0;
    (down_?ranks:[...ranks].reverse()).forEach(r=>{
      layers[r].sort((a,b)=>{
        const ka=mean(down_?up[a]:down[a]);
        const kb=mean(down_?up[b]:down[b]);
        if(ka===null&&kb===null) return a<b?-1:1;
        if(ka===null) return 1; if(kb===null) return -1;
        return ka-kb || (a<b?-1:1);
      });
      index();
    });
  }
  /* A placeholder is a bend in a line, not a box, so it gets a lane wide
     enough to keep two edges apart and no more. Giving it a full node's width
     is the obvious thing and it is wrong: it made the canvas 4.2x wider at
     2,000 nodes, which costs more readability than the routing wins back. */
  const LANE=18;
  const wide=id=>id.charCodeAt(0)===0 ? LANE : NW+GAPX;
  const rowWidth=row=>row.reduce((s,id)=>s+wide(id),0);
  const W=Math.max(...ranks.map(r=>rowWidth(layers[r])), NW+GAPX);
  const xy={};
  ranks.forEach(r=>{
    const row=layers[r];
    let x=(W-rowWidth(row))/2;
    row.forEach(id=>{ xy[id]={x, y:r*(NH+GAPY)}; x+=wide(id); });
  });
  /* The waypoints an edge bends through, keyed by its two real endpoints. The
     placeholders stay out of `xy`'s callers by never being real ids: nothing
     iterates this map to draw a node. */
  const bends={};
  chains.forEach(ch=>{
    bends[ch[0]+"\u0000"+ch[ch.length-1]] =
      ch.slice(1,-1).map(d=>({x:xy[d].x+LANE/2, y:xy[d].y+NH/2}));
  });
  return {xy, bends,
          extent:{w:W+GAPX, h:(Math.max(...ranks,0)+1)*(NH+GAPY)}};
}

/* Longest path from a root, over an arbitrary parent map. Iterative and
   cycle-guarded for the reason the Python side is: a graph deep enough to
   blow the stack, or one with a cycle the validator is about to report, must
   still render something to look at rather than a blank canvas. */
function longestPath(ids, parentsOf){
  const depth={}, state={};
  ids.forEach(root=>{
    const stack=[[root,false]];
    while(stack.length){
      const [cur,done]=stack.pop();
      if(done){
        const ps=parentsOf(cur).filter(p=>p in depth);
        depth[cur]=ps.length?Math.max(...ps.map(p=>depth[p]))+1:0;
        state[cur]=2; continue;
      }
      if(state[cur]) continue;      /* done, or on the stack: a cycle */
      state[cur]=1;
      stack.push([cur,true]);
      parentsOf(cur).forEach(p=>{ if(!state[p]) stack.push([p,false]); });
    }
  });
  return depth;
}

/* The union of both graphs, as the joined view ranks it: a decision's
   dependencies, a task's prerequisites, and the two link directions —
   `because` puts the task below its premise, `evidence_for` puts the decision
   below the work that will settle it. Exactly the digraph `dgraph/cross.py`
   walks to prove there is no cycle across the two stores. */
function unionParents(){
  const up={};
  const add=(node,parent)=>{ (up[node]=up[node]||[]).push(parent); };
  G.vertices.forEach(v=>G.derived[v.id].depends.forEach(d=>add(v.id,d)));
  if(T){
    T.tasks.forEach(x=>T.derived[x.id].prerequisites.forEach(pq=>add(x.id,pq)));
    T.tasks.forEach(x=>{
      const c=T.derived[x.id].cross;
      c.premises.forEach(p=>add(x.id, p.id));
      if(c.evidence_for && G.derived[c.evidence_for]) add(c.evidence_for, x.id);
    });
  }
  return up;
}

/* Ranks are recomputed inside a focus rather than inherited from the whole
   graph. A slice of D02 and D45 carries their store-wide depths of 1 and 12,
   which would draw them eleven empty ranks apart — the layout of a graph that
   is not on screen. The slice *is* the graph now, so it gets its own longest
   path, and the joined tab has always worked this way. */
function layout(){
  const keep = list => FOCUS ? list.filter(inFocus) : list;
  const only = fn => id => fn(id).filter(inFocus);
  if(tab==="tasks"){
    const ids=keep(T.tasks.map(x=>x.id));
    const par=only(id=>T.derived[id].prerequisites);
    const rank=FOCUS ? rankIn(ids, par) : (id=>T.derived[id].depth);
    const r=layerLayout(ids, rank, par, only(id=>T.derived[id].unblocks));
    T.xy=r.xy; T.bends=r.bends; T.extent=r.extent; return;
  }
  if(tab==="joined" && T){
    const up=unionParents();
    const ids=keep([...G.vertices.map(v=>v.id), ...T.tasks.map(x=>x.id)]);
    const par=only(id=>up[id]||[]);
    const depth=longestPath(ids, par);
    const kids={}; ids.forEach(i=>par(i).forEach(p=>(kids[p]=kids[p]||[]).push(i)));
    const r=layerLayout(ids, id=>depth[id]||0, par, id=>kids[id]||[]);
    JOIN.xy=r.xy; JOIN.bends=r.bends; JOIN.extent=r.extent; return;
  }
  const ids=keep(G.vertices.map(v=>v.id));
  const par=only(id=>G.derived[id].depends);
  const rank=FOCUS ? rankIn(ids, par) : (id=>G.derived[id].depth);
  const r=layerLayout(ids, rank, par, only(id=>G.derived[id].children));
  G.xy=r.xy; G.bends=r.bends; G.extent=r.extent;
}

/* Depth within a slice, as a lookup the layout can call per id. */
function rankIn(ids, parentsOf){
  const d=longestPath(ids, parentsOf);
  return id => d[id]||0;
}

/* Whichever view is showing owns the canvas extent. */
function extent(){
  return tab==="tasks" ? T.extent : tab==="joined" ? JOIN.extent : G.extent;
}
function xyOf(id){
  return (tab==="tasks" ? T.xy : tab==="joined" ? JOIN.xy : G.xy)[id];
}

function bendsOf(from, to){
  const b = tab==="tasks" ? T.bends : tab==="joined" ? JOIN.bends : G.bends;
  return (b && b[from+"\u0000"+to]) || [];
}

/* What one edge is drawn as, and which records are lit, under whichever
   reading is on: an edge selection first (it is the narrowest), then a
   preview's neighbourhood, then a node selection's related set. One rule
   for the three drawers so they cannot disagree about it. */
function edgeTone(a, b, related, lit){
  if(ESEL) return (a===ESEL.from && b===ESEL.to) ? "hot" : "dim";
  if(lit) return (lit.has(a) && lit.has(b)) ? "" : "dim";
  if(related) return (related.has(a) && related.has(b)) ? "hot" : "dim";
  return "";
}
function litSet(related, lit){
  return ESEL ? new Set([ESEL.from, ESEL.to]) : (lit || related);
}

/* Two different verbs. `passes` decides what is *lit*; `inFocus` decides what
   is *drawn at all*. A node outside the focus is not dim, it is absent — the
   canvas re-ranked without it — so no caller may reach for one when it meant
   the other. */
function visible(v){ return passes("decisions", v.id); }

function tvisible(x){ return passes("tasks", x.id); }

/* An edge belongs to an induced subgraph only when both of its ends do. This
   is the whole of "induced" as far as the drawing is concerned; the vertex set
   came from the server. */
function edgeIn(a, b){ return inFocus(a) && inFocus(b); }

/* One node renderer for both stores: same box, same two wrapped title lines,
   so a decision and a task read as the same kind of thing in the joined view
   and only their outline says which. */
/* What a staged op claims about this record, or null. The panel draws the
   store — that is the decided reading model, and the tray has its own footer —
   but silence about a claim is not part of that bargain: a task reading
   `TODO · ready` while an agent holds a staged `set_status … DOING` sends the
   supervisor at work already taken. So the reading is untouched and a mark is
   added beside it. `contested` is the server's index; see there. */
function claimOn(id){
  const c = (G && G.contested && G.contested[id])
         || (T && T.contested && T.contested[id]);
  return c || null;
}

function claimNote(c){
  const who = c.by ? `by ${c.by}` : "by a writer with no name set";
  const what = c.to ? `${c.op} → ${c.to}` : c.op;
  return `staged ${what} ${who} — not applied, so the graph above still `
       + `shows the record. See the tray below.`;
}

function nodeSvg(id, title, status, area, stroke, dash, dim){
  const p=xyOf(id); if(!p) return "";
  const pv = previewMark(id);
  if(pv.status) status = pv.status;
  const s=title.length>46?title.slice(0,44)+"…":title;
  const cut = s.length>26 ? (s.lastIndexOf(" ",26)||26) : -1;
  const half = cut<0 ? s : s.slice(0,cut);
  const rest = cut<0 ? "" : s.slice(cut+1);
  const claim = claimOn(id);
  const bridge = bridgeNote(id);
  return `<g class="node${dim?" dim":""}${claim?" claimed":""}${pv.cls?" "+pv.cls:""}" data-id="${esc(id)}" transform="translate(${p.x},${p.y})">
      ${pv.note?`<title>${esc(pv.note)}</title>`:""}
      ${bridge?`<title>${esc(bridge)} — the hop is on the joined tab.</title>
      <rect class="bridge" x="-4" y="-4" width="${NW+8}" height="${NH+8}" rx="10"/>`:""}
      <rect width="${NW}" height="${NH}" rx="7" fill="${AREA_COLOR[area]||"#888"}22"
            stroke="${stroke}" ${dash}/>
      <text class="vid" x="8" y="15">${esc(id)}</text>
      <text x="34" y="15" fill="${stroke}" font-size="9.5">${esc(status)}</text>
      ${claim?`<title>${esc(claimNote(claim))}</title>
      <circle class="claim-dot" cx="${NW-9}" cy="10" r="3.5"/>`:""}
      <text x="8" y="29">${esc(half)}</text><text x="8" y="41">${esc(rest)}</text>
      ${pv.cls==="gone"?`<line class="strike" x1="0" y1="${NH/2}" x2="${NW}" y2="${NH/2}"/>`:""}
      ${pv.tag?`<text class="pv" x="${NW-8}" y="15" text-anchor="end">${esc(pv.tag)}</text>`:""}
    </g>`;
}

/* What one edge is, for the hover and for the click. An edge on this canvas
   is one of four relations, and the class already says which; the answer
   an edge carries lives on its source, which is what a click opens. */
function edgeInfo(from, to, cls){
  const has = k => (" "+cls+" ").includes(" "+k+" ");
  const prefix = has("ghost") ? "would be added by the preview — "
    : has("gone") ? "would be removed by the preview — "
    : has("assumed") ? "assumed from an earlier act — " : "";
  if(has("evidence")) return {what: prefix+`${from} is evidence for ${to}`, pick: from};
  if(has("cross")) return {what: prefix+`${to} is work because of ${from}`, pick: to};
  const task = T && T.derived && T.derived[to] && T.derived[from];
  if(task) return {what: prefix+`${from} precedes ${to}`, pick: to};
  const e = G && (G.edges||[]).find(x=>x.from===from && x.active && (x.to||[]).includes(to));
  const answer = e && e.answer ? " — "+String(e.answer).replace(/\s+/g," ").slice(0,100)
               : " — not answered yet";
  return {what: prefix+`${to} rests on ${from}`+answer, pick: from};
}

function edgeSvg(from, to, cls){
  const a=xyOf(from), b=xyOf(to);
  if(!a||!b) return "";
  const x1=a.x+NW/2, y1=a.y+NH, x2=b.x+NW/2, y2=b.y;
  /* One cubic per rank crossed, each with vertical control points, so a bent
     edge reads as the same kind of line as a short one — the alternative, a
     polyline with corners, looks like a different sort of relationship. */
  const pts=[{x:x1,y:y1}, ...bendsOf(from,to), {x:x2,y:y2}];
  let d=`M${pts[0].x},${pts[0].y}`, chev="";
  const cc = cls.replace(/\bedge\b/, "chev");
  for(let i=0;i<pts.length-1;i++){
    const s=pts[i], e=pts[i+1], my=(s.y+e.y)/2;
    d+=` C${s.x},${my} ${e.x},${my} ${e.x},${e.y}`;
    /* A chevron at the middle of each cubic — one per rank the edge
       crosses — turned to the curve's tangent there. Read off the control
       points rather than measured on the drawn path: `getPointAtLength`
       cost ~1.7 ms an edge, seconds on a large graph, and at t = ½ a cubic
       with vertical control points is where the eye expects the arrow.
       With c₁=(s.x,my), c₂=(e.x,my): B(½) = ((s.x+e.x)/2, (s.y+6my+e.y)/8)
       and B'(½) ∝ (e.x−s.x, e.y−s.y). */
    const mx=(s.x+e.x)/2, mY=(s.y+6*my+e.y)/8;
    const deg=Math.atan2(e.y-s.y, e.x-s.x)*180/Math.PI;
    const big = /\b(ghost|assumed|gone)\b/.test(cls) ? " scale(1.5)" : "";
    chev+=`<path class="${cc}" d="M-4.5,-3.5 L0.5,0 L-4.5,3.5${big?" z":""}" transform="translate(${mx.toFixed(1)},${mY.toFixed(1)}) rotate(${deg.toFixed(1)})${big}"/>`;
  }
  const info = edgeInfo(from, to, cls);
  return `<g><title>${esc(info.what)}</title><path class="${cls}" d="${d}"/>${chev}
    <path class="hit" d="${d}" data-pick="${esc(info.pick)}" data-from="${esc(from)}" data-to="${esc(to)}"/></g>`;
}

function decisionNode(v, related){
  const st=base(v.status);
  /* Waiting is derived, never stored (`D68`): an OPEN vertex whose premises
     are not all settled takes the colour BLOCKED used to, from `waiting_on`,
     which the server reads off the edges. The dash stays OPEN's. */
  const waiting = st==="OPEN" && (G.derived[v.id].waiting_on||[]).length;
  const stroke = waiting ? STATUS_COLOR.BLOCKED : (STATUS_COLOR[st]||"var(--line)");
  const dash = st==="OPEN"?'stroke-dasharray="5 4"'
             : st==="PROVISIONAL"?'stroke-dasharray="1 3"':"";
  const dim = related ? !related.has(v.id) : !visible(v);
  return nodeSvg(v.id, v.title, v.status, v.area, stroke, dash, dim);
}

function taskNode(x, related){
  const d=T.derived[x.id];
  const stroke=TASK_COLOR[x.status]||"var(--line)";
  /* Blocked is derived here, never stored — so the dashes mean "waiting",
     computed, and a task whose only obstacle is an unsettled premise gets them
     too. That is the reading `dg task` prints as "waiting on D05". */
  const waiting = x.status==="TODO" && (d.waiting_on.length || d.cross.gated_by);
  const dash = waiting?'stroke-dasharray="5 4"':"";
  const dim = related ? !related.has(x.id) : !tvisible(x);
  return nodeSvg(x.id, x.title, x.status, x.area, stroke, dash, dim);
}

function draw(){
  const vp=$("#viewport");
  /* Before rendering, not after: `nodeSvg` asks `bridgeNote` per node, so the
     "is every one of them bridged?" answer has to exist by the time the first
     node is built. */
  markBridged(tab==="tasks" ? T.tasks.map(x=>x.id).filter(inFocus)
            : tab==="joined" ? []
            : G.vertices.map(v=>v.id).filter(inFocus));
  vp.innerHTML = tab==="tasks" ? drawTasks()
               : tab==="joined" ? drawJoined() : drawDecisions();
  $("#svg").setAttribute("viewBox",view.join(" "));
  vp.querySelectorAll(".node").forEach(n=>n.onclick=()=>select(n.dataset.id));
  /* An edge opens the record its answer lives on — its source for a
     dependency, the task for a link between the stores. */
  vp.querySelectorAll(".hit[data-pick]").forEach(h=>h.onclick=()=>
    selectEdge(h.dataset.from, h.dataset.to, h.dataset.pick));
}

function drawDecisions(){
  const lit = previewLit();
  const related = lit ? null
    : sel ? new Set([sel,...G.derived[sel].depends,...G.derived[sel].children]) : null;
  let edges="", nodes="";
  G.edges.filter(e=>e.active).forEach(e=>{
    e.to.forEach(to=>{
      if(!edgeIn(e.from,to)) return;
      const cls=["edge"];
      if(!e.answer) cls.push("pending-dep");
      cls.push(edgeTone(e.from,to,related,lit));
      if(edgeAdded(e.from,to)) cls.push(edgeAdded(e.from,to));
      edges+=edgeSvg(e.from,to,cls.join(" "));
    });
  });
  edges+=goneEdges("decisions");
  G.vertices.forEach(v=>{ if(inFocus(v.id)) nodes+=decisionNode(v, litSet(related,lit)); });
  return edges+nodes;
}

function drawTasks(){
  const lit = previewLit();
  const related = lit ? null : tsel
    ? new Set([tsel,...T.derived[tsel].prerequisites,...T.derived[tsel].unblocks])
    : null;
  let edges="", nodes="";
  T.tasks.forEach(x=>T.derived[x.id].prerequisites.forEach(pq=>{
    if(!edgeIn(pq,x.id)) return;
    const cls=["edge"];
    /* An unresolved prerequisite is the thing actually holding this up; a
       resolved one is history. Same faint-dash convention the decision view
       uses for a premise that is not settled yet. */
    if(T.derived[x.id].waiting_on.includes(pq)) cls.push("pending-dep");
    cls.push(edgeTone(pq,x.id,related,lit));
    if(edgeAdded(pq,x.id)) cls.push(edgeAdded(pq,x.id));
    edges+=edgeSvg(pq,x.id,cls.join(" "));
  }));
  edges+=goneEdges("tasks");
  T.tasks.forEach(x=>{ if(inFocus(x.id)) nodes+=taskNode(x, litSet(related,lit)); });
  return edges+nodes;
}

function drawJoined(){
  const cur = sel || tsel;
  const lit = previewLit();
  let related=null;
  if(lit){ /* the preview's neighbourhood, not the selection's */ }
  else if(sel){
    const j=(JOIN.by_decision[sel]||{rests_on:[],evidence:[]});
    related=new Set([sel,...G.derived[sel].depends,...G.derived[sel].children,
                     ...j.rests_on,...j.evidence]);
  }else if(tsel){
    const d=T.derived[tsel];
    related=new Set([tsel,...d.prerequisites,...d.unblocks]);
    d.cross.premises.forEach(p=>related.add(p.id));
    if(d.cross.evidence_for) related.add(d.cross.evidence_for);
  }
  const rel=(a,b)=>edgeTone(a,b,related,lit);
  let edges="", nodes="";
  G.edges.filter(e=>e.active).forEach(e=>e.to.forEach(to=>{
    if(!edgeIn(e.from,to)) return;
    edges+=edgeSvg(e.from,to,["edge",e.answer?"":"pending-dep",rel(e.from,to),
                              edgeAdded(e.from,to)].join(" "));
  }));
  T.tasks.forEach(x=>T.derived[x.id].prerequisites.forEach(pq=>{
    if(!edgeIn(pq,x.id)) return;
    edges+=edgeSvg(pq,x.id,["edge",
      T.derived[x.id].waiting_on.includes(pq)?"pending-dep":"",rel(pq,x.id),
      edgeAdded(pq,x.id)].join(" "));
  }));
  edges+=goneEdges("decisions")+goneEdges("tasks");
  /* The join itself. Two directions, two colours: a decision justifying work,
     and work that will settle a decision. Never solid — it is a link between
     the stores, not a dependency inside either. */
  T.tasks.forEach(x=>{
    const c=T.derived[x.id].cross;
    /* One edge per premise. A task resting on three answers waits on all three,
       and drawing the first was the joined view asserting a dependency the
       store does not have while hiding two it does. A premise that resolves to
       nothing has no node to draw from — the panel names it instead. */
    c.premises.forEach(p=>{
      if(!edgeIn(p.id,x.id)) return;
      edges+=edgeSvg(p.id,x.id,["edge","cross",rel(p.id,x.id)].join(" "));
    });
    if(c.evidence_for && G.derived[c.evidence_for] && edgeIn(x.id,c.evidence_for))
      edges+=edgeSvg(x.id,c.evidence_for,
                     ["edge","cross","evidence",rel(x.id,c.evidence_for)].join(" "));
  });
  G.vertices.forEach(v=>{ if(inFocus(v.id)) nodes+=decisionNode(v, litSet(related,lit)); });
  T.tasks.forEach(x=>{ if(inFocus(x.id)) nodes+=taskNode(x, litSet(related,lit)); });
  return edges+nodes;
}

/* --- prose rendering: shared with dgraph/orgmd.py --- */
/* Stored prose comes in whichever dialect it was composed in: org (from
   `dg decide --edit`) or markdown (from the textarea below, md_import.py, or a
   future agent plugin). Render both.

   Single-marker emphasis is ambiguous between the two - org `*x*` means bold,
   markdown `*x*` means italic - so it is resolved by PROVENANCE: records
   composed through the editor carry `format: "org"`, and md() converts their
   `*bold*` and `/italic/` accordingly (outside code spans and tags). Untagged
   prose is markdown and keeps markdown's meaning, untouched.
   tests/fixtures/org_cases.json pins these rules against the Python converter,
   so the two cannot drift. */
/* Quotes included: escaped text is interpolated into attributes (data-dg,
   href, option value), and an unescaped quote there is an attribute breakout —
   stored prose must never reach the DOM as markup. */
/* `String(...)` and not `s||""`: not every caller hands this a string. A count
   of 3 arrived here from the areas table and threw — `.replace is not a
   function` — taking that whole reading down. The form harness stubs `esc` as
   a coercion, so only the real one was fussy; coercing here is what makes the
   stub honest. */
const esc=s=>String(s==null?"":s).replace(/[<>&"']/g,
  c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
const isRule=l=>/^\s*\|[-+|\s]*\|\s*$/.test(l);
/* Org single-marker emphasis, applied only to org-tagged prose and only to
   text segments — never inside a tag (an href full of slashes) or a code
   span. The boundaries are org's own, so 2*3*4 and and/or stay untouched. */
function orgEmphasis(s){
  return s.split(/(<code>[^<]*<\/code>|<[^>]+>)/g).map(seg=>
    seg.startsWith("<") ? seg : seg
      .replace(/(^|[-\u2014\s('"{])\*([^\s*](?:[^\n*]*?[^\s*])?)\*(?=[-\u2014\s.,:!?;'")}\[]|$)/g,'$1<b>$2</b>')
      .replace(/(^|[-\u2014\s('"{])\/([^\s\/](?:[^\n\/]*?[^\s\/])?)\/(?=[-\u2014\s.,:!?;'")}\[]|$)/g,'$1<i>$2</i>')
  ).join("");
}
function mdInline(s, fmt){
  s = s
    /* org links: [[target]] or [[target][label]]. dg: targets select the node
       in place; everything else opens out. Markdown has no [[ ]], so a markdown
       link or reference link is never touched here. */
    .replace(/\[\[([^\[\]]+?)\](?:\[([^\[\]]*?)\])?\]/g, (m,t,l)=>{
      t=t.trim(); l=(l||"").trim();
      if(t.startsWith("dg:")){ const v=t.slice(3).trim();
        return `<a href="#" data-dg="${v}">${l||v}</a>`; }
      if(t.startsWith("file:")) t=t.slice(5).trim();
      /* http(s) and relative targets only. Anything else carrying a scheme —
         javascript:, data:, … — must not become a clickable href. */
      if(/^[a-z][a-z0-9+.-]*:/i.test(t) && !/^https?:/i.test(t))
        return `<code>${l||t}</code>`;
      return `<a href="${t}" target="_blank" rel="noopener">${l||t}</a>`;
    })
    /* org =verbatim= / ~code~, honouring org's own emphasis boundaries so
       lr=0.001 survives. A doubled marker is markdown (~~strike~~), not org. */
    .replace(/(^|[-\u2014\s('"{])([=~])([^\s](?:[^\n]*?[^\s])?)\2(?=[-\u2014\s.,:!?;'")}\[]|$)/g,
      (m,pre,mk,body)=> (body.startsWith(mk)||body.endsWith(mk))
        ? m : `${pre}<code>${body}</code>`)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  /* single-marker emphasis is dialect-specific — see the block comment above */
  return fmt==="org" ? orgEmphasis(s)
                     : s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
}
function mdTable(lines, fmt){
  let head=lines.some(isRule), rows=[];
  for(const ln of lines){
    if(isRule(ln)){ head=false; continue; }
    const tag=head?"th":"td";
    const cells=ln.trim().replace(/^\||\|$/g,"").split("|")
      .map(c=>`<${tag}>${mdInline(c.trim(), fmt)}</${tag}>`);
    rows.push("<tr>"+cells.join("")+"</tr>");
  }
  return "<table>"+rows.join("")+"</table>";
}
function md(s, fmt){
  return esc(s||"").split(/\n\s*\n/).map(par=>{
    const lines=par.split("\n").filter(l=>l.trim());
    if(!lines.length) return "";
    /* a block of pipe rows is a table in both dialects */
    if(lines.every(l=>l.trim().startsWith("|"))) return mdTable(lines, fmt);
    return "<p>"+mdInline(par.replace(/\n/g," ").trim(), fmt)+"</p>";
  }).filter(Boolean).join("");
}
/* --- end prose rendering --- */

/* ---- the fold -------------------------------------------------------------

   How much prose the panel shows before folding the rest away. The number is
   `limits.TERSE_DEFAULT`, and the two are the same judgement about how much a
   person can take in while deciding — one applied to writing, one to reading.
   `tests/test_server.py` asserts they stay equal, since a constant duplicated
   across two languages is the drift this repo keeps finding.

   It is NOT `$DG_TERSE`. That is a launcher's rule for its own agents; this
   page is read by a supervisor, who has no such setting, and it has to fold a
   graph written before the rule existed and records a person wrote by hand.
   `dgraph/limits.py` has the argument, and what a custom count costs.

   This wraps `md` rather than living inside it, and deliberately: `md` is one
   half of a corpus shared with `dgraph/orgmd.py`, pinned by
   `tests/test_orgmd.py` against the Python half, and a renderer that sometimes
   returns a wrapper around its output is no longer the same function that
   corpus is about.

   A fold rather than a clip: nothing is unreachable and the record is still
   the record. What the panel stops doing is making you scroll past somebody's
   reasoning to reach the next question — and it is the half of this that
   reaches a graph written before the rule existed, and the records a
   supervisor wrote by hand, which no launcher policy touches. */
const FOLD_AT=400; let FOLD_N=0;
function mdFold(s, fmt){
  const html=md(s, fmt), src=(s||"").trim();
  if(src.length<=FOLD_AT) return html;
  const id="fold"+(FOLD_N++), label="show all · "+src.length+" chars";
  return `<div class="fold" id="${id}"><div class="fold-body">${html}</div>`+
    `<button class="fold-tog" data-fold="${id}" data-label="${label}">`+
    `${label}</button></div>`;
}
/* Delegated, and on the document: every panel is rebuilt by `innerHTML`, so a
   handler bound to a button dies with the next render. */
addEventListener("click",e=>{
  const b=e.target.closest(".fold-tog"); if(!b) return;
  const el=document.getElementById(b.dataset.fold); if(!el) return;
  b.textContent = el.classList.toggle("open") ? "show less" : b.dataset.label;
});

/* ---- pan & zoom ---- */
let view=[0,0,1600,1000];
function fit(){ const e=extent(); view=[-30,-30,e.w+60,e.h+60]; }
/* Back to the reading the page opens with: nothing selected, nothing
   dimmed for a selection. A chip that is there only while something is
   selected, and Escape outside a field. **Not a click on empty canvas**:
   the canvas is grabbed to pan, and a pan that started with a still hand
   would throw the reading away. Query, focus and a preview are their own
   controls with their own clears and are left alone. */
function deselect(){
  /* Whatever the inspector holds — a record, a form, a reading — goes. */
  if($("#side").hidden) return;
  captureDraft();
  sel=null; tsel=null; ESEL=null; NEWKIND=null; RELATING=null;
  draw();
  $("#side").innerHTML=`<p class="muted">${SIDE_EMPTY}</p>`;
}
addEventListener("keydown",e=>{
  const t = e.target;
  if(e.key==="Escape" && !(t && t.closest && t.closest("input,textarea,select"))) deselect();
});
$("#deselectBtn").onclick=deselect;

(function pz(){
  const svg=$("#svg"); let drag=null;
  svg.addEventListener("mousedown",e=>{ if(e.target.closest(".node,.hit"))return;
    drag={x:e.clientX,y:e.clientY,v:[...view]}; svg.classList.add("drag"); });
  addEventListener("mouseup",()=>{drag=null;svg.classList.remove("drag")});
  addEventListener("mousemove",e=>{ if(!drag)return;
    const k=view[2]/svg.clientWidth;
    view[0]=drag.v[0]-(e.clientX-drag.x)*k; view[1]=drag.v[1]-(e.clientY-drag.y)*k;
    svg.setAttribute("viewBox",view.join(" ")); });
  svg.addEventListener("wheel",e=>{ e.preventDefault();
    const k=e.deltaY>0?1.12:0.89;
    const r=svg.getBoundingClientRect();
    const mx=view[0]+(e.clientX-r.left)/r.width*view[2];
    const my=view[1]+(e.clientY-r.top)/r.height*view[3];
    view[2]*=k; view[3]*=k; view[0]=mx-(mx-view[0])*k; view[1]=my-(my-view[1])*k;
    svg.setAttribute("viewBox",view.join(" ")); },{passive:false});
})();

/* ---- the preview (D88, T80) ----------------------------------------------

   The canvas draws the store. A reader turns a preview on — one act from
   its tray row, or everything staged from the tray heading — and the page
   swaps in the payloads `/api/preview` built over the previewed copies,
   then draws the *difference* the route sent beside them: a ghost for what
   the act adds, a strike for what it removes, a ring and `was → now` for
   what it moves. A bar over the canvas names what is being previewed and
   carries the control that clears it; the tray row does too. Off puts the
   store back in one assignment. Pan and zoom are never touched: `fit()` is
   not called on either transition. */

/* The mark `nodeSvg` draws on one record, or nothing. Reads the diff for
   both stores: in the joined view a task and a decision are on one canvas. */
function previewMark(id){
  if(!PREVIEW) return {};
  /* The change first; then what it rests on, drawn as assumed (`D89`). */
  for(const d of [PREVIEW.diff.decisions, PREVIEW.diff.tasks]){
    if(!d) continue;
    if(d.added.includes(id))
