       `because` is a multi-select and `evidence for` is not. Both are still
       fields rather than edges: there is no edge list across the two stores,
       and `dgraph/cross.py` says why inventing one costs the barrier. */
    spec.seam.forEach(([field,label])=>{
      const rec = T.tasks.find(t=>t.id===id)||{};
      /* `because` is a list on the record and `evidence_for` a single id.
         Normalised here so the four branches below read one shape — the store
         keeps them different because they *are* different, and this is the one
         place the page has to care. */
      const held = field==="because" ? (rec.because||[]) : (rec[field]?[rec[field]]:[]);
      if(verb==="unlink"){
        /* Which one goes has to be said: a task rests on several premises, and
           a checkbox could name none of them. Offered from what the record
           actually holds, so a link that is not there cannot be asked for. */
        if(!held.length){
          h+=`<label class="muted">${esc(label)} — not set</label>`;
        }else if(field==="because"){
          h+=`<label>${esc(label)} — remove which? (ctrl-click)</label>
            <select id="r_${field}" multiple>${
              held.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join("")}</select>`;
        }else{
          h+=`<label style="display:flex;gap:8px;align-items:center">
            <input type="checkbox" id="r_${field}" style="width:auto"> ${esc(label)}
            <span class="muted">${esc(held[0])}</span></label>`;
        }
      }else{
        const opts=(G?idOptions(G.vertices,"id","title"):"");
        const nowSaid = held.length?` <span class="muted">(now ${esc(held.join(", "))})</span>`:"";
        if(field==="because"){
          h+=`<label>${esc(label)}${nowSaid} (ctrl-click)</label>
            <select id="r_${field}" multiple>${opts}</select>`;
        }else{
          h+=`<label>${esc(label)}${nowSaid}</label>
            <select id="r_${field}"><option value=""></option>${opts}</select>`;
        }
      }
    });
  }else{
    spec.add.forEach(([field,label])=>{
      const opts=relCandidates(store, id, field, verb);
      h+=`<label>${esc(label)}${removing?" — remove which?":""} (ctrl-click)</label>
        <select id="r_${field}" multiple>${opts||""}</select>`
        + (opts?"":`<p class="muted" style="margin:4px 0">Nothing to remove here.</p>`);
    });
    if(store==="tasks" && !removing)
      h+=`<p class="muted" style="margin:6px 0">These are different claims.
        <b>After</b> asserts an order and holds this work back;
        <b>discovered during</b> only records where it came from and blocks nothing.</p>`;
  }

  h+=`<p style="margin:12px 0;display:flex;gap:8px">
      <button class="primary" id="rGo">${removing?"Check, then stage":"Stage"}</button>
      <button class="ghost" id="rNo">Cancel</button></p>
    <div class="note" id="note"></div>`;
  $("#side").innerHTML=h;
  $("#side").querySelectorAll("button[data-v]").forEach(b=>b.onclick=()=>{
    RELATING.verb=b.dataset.v; structureForm();
  });
  $("#rNo").onclick=()=>{ RELATING=null; store==="tasks"?taskPanel():panel(); };
  $("#rGo").onclick=()=>removing?relateFallout():postRelate();
}

/* What the body of a structure post looks like, read off the form. One reader,
   so the fallout preview and the staging post cannot describe different acts —
   which would make the preview a reassurance about something else. */
function relateBody(){
  const {store, id, verb} = RELATING;
  const body={verb, id, store:REL_FORMS[store].store};
  const spec=REL_FORMS[store];
  if(verb==="link"||verb==="unlink"){
    spec.seam.forEach(([f])=>{
      const el=$("#r_"+f); if(!el) return;
      /* `because` is comma-joined ids in both directions — the server parses
         one shape for both doors. `evidence_for` is a single slot, so unlink
         stays a flag for it and only for it. Sending a bool for `because` is
         what made the unlink route raise instead of refuse (`V-F2`). */
      if(f==="because"){
        body[f] = el.multiple
          ? [...el.selectedOptions].map(o=>o.value).join(",")
          : (el.value||null);
      }else{
        body[f] = verb==="unlink" ? !!el.checked : (el.value||null);
      }
    });
  }else{
    spec.add.forEach(([f])=>{
      const el=$("#r_"+f); if(!el) return;
      body[f]=[...el.selectedOptions].map(o=>o.value);
    });
  }
  return body;
}

/* The `askFallout` pattern, for the two verbs that release something. A
   removal is refused nothing — it is legal — so this is not a gate; it is the
   sentence a person needs in order to mean it. */
async function relateFallout(){
  /* Read once, here. `postRelate` used to read the form again on the way out,
     and by then this function has replaced `#side` with the confirmation — so
     the second read found no form and posted an empty body, which the server
     correctly refused as "nothing to unlink". The act a person confirmed and
     the act that gets staged are now literally the same object. */
  const body=relateBody();
  let res;
  try{ res=await api("/api/fallout",{method:"POST",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}); }
  catch(err){ say(err.message,"bad"); return; }
  if(res.error){ say(res.error,"bad"); return; }
  const lines=[...(res.releases||[]), ...(res.findings||[])];
  if(!lines.length) return postRelate();
  let h=`<p class="warn">Removing this changes more than ${esc(RELATING.id)}:</p>
    <ul class="muted">${lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
    <p style="margin:10px 0;display:flex;gap:8px">
      <button class="primary" id="rYes">Stage it anyway</button>
      <button class="ghost" id="rBack">Back</button></p>
    <div class="note" id="note"></div>`;
  $("#side").innerHTML=h;
  $("#rBack").onclick=structureForm;
  $("#rYes").onclick=()=>postRelate(body);
}

async function postRelate(body){
  const {store, id} = RELATING;
  body = body || relateBody();
  try{
    const res=await api(REL_FORMS[store].route,{method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    RELATING=null;
    await boot(); fit(); draw();
    const n=(res.staged||[]).length;
    const notes=(res.notes||[]).map(x=>`<li>${esc(x)}</li>`).join("");
    $("#side").innerHTML = (n
        ? `<p class="muted">Staged ${n} op(s) for ${esc(id)}. Nothing is
             written until Apply.</p>`
        : `<p class="muted">Nothing staged — ${esc(id)} already held what was
             asked for.</p>`)
      + (notes?`<ul class="muted">${notes}</ul>`:"");
  }catch(err){ say(err.message,"bad"); }
}

/* ---- what a drop leaves standing -------------------------------------

   `dg task drop` refuses (exit 2, non-interactive) until every released and
   orphaned task has a keep/drop verdict, because **both defaults are wrong
   somewhere**: assuming "keep" leaves a task in the backlog whose whole
   purpose died with its prerequisite, and assuming "drop" throws away work
   that was only ever incidentally connected. This button used to post one op
   and ask nothing, which is picking one of those defaults silently.

   So it asks, and — this is the part a confirmation dialog cannot do — it can
   act on the answer: each row carries its own verdict, and the drop plus every
   `drop` verdict reach the tray as one write. */
function today(){
  /* local date, not toISOString(): that is UTC, and near midnight it disagrees
     with the date `dg task drop` would file for the same act. */
  const t=new Date(), p=n=>String(n).padStart(2,"0");
  return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
}

async function askFallout(tid){
  const w=($("#dwhy")&&$("#dwhy").value.trim())||"";
  if(!w){ say("Say why it is not being done — the record is the point.","bad"); return; }
  let res;
  try{ res=await api("/api/task-fallout?task="+encodeURIComponent(tid)); }
  catch(err){ say(err.message,"bad",tid); return; }
  if(res.error){ say(res.error,"bad",tid); return; }
  const rows=res.fallout||[];
  if(!rows.length) return dropWith(tid, w, []);   /* nothing standing: no question */

  /* Refused, not defaulted — the same refusal the CLI makes, with the same
     remedy attached rather than a bare "no". */
  let h=`<p class="warn">${rows.length} task(s) need a verdict before ${esc(tid)}
    can be dropped. Nothing is staged until each one is answered.</p>`;
  rows.forEach((r,i)=>{
    h+=`<div class="answer"><b>${esc(r.id)}</b> ${esc(r.title)}
      <div class="muted">${esc(r.why)}</div>
      <label style="display:inline;margin-right:12px">
        <input type="radio" name="fo${i}" value="keep" checked> still worth doing</label>
      <label style="display:inline">
        <input type="radio" name="fo${i}" value="drop"> drop it too</label></div>`;
  });
  h+=`<p style="margin:10px 0"><button class="primary" id="foGo">Drop ${esc(tid)}</button>
      <button class="ghost" id="foNo">Cancel</button></p>
      <div class="note" id="note"></div>`;
  $("#side").innerHTML=h;
  $("#foNo").onclick=()=>taskPanel();
  $("#foGo").onclick=()=>{
    const doomed=rows.filter((r,i)=>
      $("#side").querySelector(`input[name=fo${i}]:checked`).value==="drop")
      .map(r=>r.id);
    dropWith(tid, w, doomed);
  };
}

/* The drop and its cascade, as one write. `dg task drop` builds exactly this
   list and hands it to `_tstage_all`; a task named in `--drop-too` has its
   *own* fallout left unwalked here too — one command, one judgement, and
   `dg check` picks up whatever the cascade releases. */
function dropWith(tid, why, doomed){
  const date=today();
  postTasks([{op:"set_status",task:tid,status:"DROPPED",why,date}].concat(
    doomed.map(t=>({op:"set_status",task:t,status:"DROPPED",
                    why:`abandoned along with ${tid}`,date}))));
}

/* A reference to a node in either store, clickable when it resolves. A
   dangling one is shown as what it is rather than hidden — `dg check` reports
   it and the panel should not disagree. */
function dgLink(id, dangling){
  if(dangling) return `${esc(id)} <span class="muted">(not in the store)</span>`;
  return `<a href="#" data-dg="${esc(id)}">${esc(id)}</a>`;
}

/* Follow a reference across the two stores. In the decisions or tasks tab a
   link into the *other* store switches tab first, rather than selecting
   something the current view cannot show. */
function jump(id){
  const isTask = T && T.tasks.some(x=>x.id===id);
  const known = isTask || G.vertices.some(v=>v.id===id);
  if(!known) return;
  const need = isTask ? "tasks" : "decisions";
  if(tab!=="joined" && tab!==need){
    tab=need; tabs(); chips(); layout(); fit();
  }
  select(id);
}

/* A list of decision ids, each a link. Not decoration: an edge's targets are
   the edge, and following one is how the graph gets read. A target naming no
   vertex is shown as what it is, the same way `dgLink` does everywhere else —
   `dg check` reports it and the panel must not paper over it. */
function idList(ids, empty){
  const known=new Set(G.vertices.map(x=>x.id));
  return (ids&&ids.length)
    ? ids.map(id=>dgLink(id, !known.has(id))).join(", ") : (empty||"—");
}

/* One line of prose, escaped then rendered. Phrasing content only, for the one
   place a <p> would be wrong: inside a <summary>. */
function mdLine(s, fmt){
  return mdInline(esc(s||"").replace(/\n/g," ").trim(), fmt);
}

/* The active edge as a card of its own: the answer, and the four things that
   qualify it. `date` sits in the head rather than trailing `source`, because
   it dates the edge, not the citation. */
function edgeCard(e, children){
  return `<section class="edge-card">
    <span class="edge-head">active edge<span class="when muted">${esc(e.date||"")}</span></span>
    <div class="kv">
      <div>opens</div><div>${idList(children, "TERMINAL")}</div>
      <div>falsifier</div><div>${esc(e.falsifier||"—")}</div>
      <div>source</div><div>${esc(e.source||"—")}</div>
    </div>
    <div class="answer">${mdFold(e.answer, e.format)}</div></section>`;
}

/* A superseded edge, shown as the edge it is. Collapsed to the headline — what
   it said, what beat it, and why — with its own targets, falsifier, source and
   archived answer behind the disclosure. That last part is the point: without
   it, an active answer that explains its own reversal cannot be told apart
   from the record it replaced.

   A reversal imported from markdown, or made before those fields were kept,
   has nothing behind the disclosure; it is drawn flat rather than as a drawer
   that opens on nothing. The archived answer is rendered in this record's
   dialect — see the note on `format` in pending.py's reopen. */
/* An answer this project was offered and did not take. Its own card, never
   folded in with the superseded ones: a reversal says the project changed its
   mind, and this says somebody else answered the same question differently.
   Drawn as a reversal it would claim the first about a record where only the
   second happened. */
function declinedCard(x){
  let b=`<div class="kv"><div>from</div><div>${esc(x.from_source||"")}</div>`;
  if(x.source) b+=`<div>source</div><div>${esc(x.source)}</div>`;
  if(x.falsifier) b+=`<div>falsifier</div><div>${esc(x.falsifier)}</div>`;
  if(x.to&&x.to.length) b+=`<div>would open</div><div>${idList(x.to)}</div>`;
  b+=`</div><div class="answer">${mdFold(x.answer||"", x.format)}</div>`;
  return `<details class="edge-card super"><summary><span class="edge-head">offered and not adopted<span class="when muted">${
    esc(x.date||"")}</span></span></summary>${b}</details>`;
}

function supersededCard(x){
  const archived = x.answer && x.answer!==x.summary ? x.answer : null;
  const deep = (x.to&&x.to.length) || x.falsifier || x.source || archived;
  const head = `<span class="edge-head">superseded edge<span class="when muted">${esc(x.date||"")}</span></span>
    <div class="rev"><span class="was">${esc(x.summary||"")}</span> → <b>${esc(x.replaced_by||"(undecided)")}</b></div>
    ${x.why?`<div class="rev muted">${mdLine(x.why, x.format)}</div>`:""}`;
  if(!deep) return `<section class="edge-card super">${head}</section>`;
  let b=`<div class="kv"><div>opened</div><div>${idList(x.to)}</div>`;
  if(x.falsifier) b+=`<div>falsifier</div><div>${esc(x.falsifier)}</div>`;
  if(x.source) b+=`<div>source</div><div>${esc(x.source)}</div>`;
  b+=`</div>`;
  if(archived) b+=`<div class="answer">${mdFold(archived, x.format)}</div>`;
  return `<details class="edge-card super"><summary>${head}</summary>${b}</details>`;
}

/* One card per late result, each with its own reading. Per result rather than
   per decision, because the note is about *that* measurement — answering for
   two at once with one sentence is the box-tick this record exists not to be,
   which is why `dg confirm --against` refuses to default to "all of them". */
function lateEvidence(rows){
  let h=`<div class="answer"><b class="warn">Evidence read after this was
    settled.</b> <span class="muted">It has never been read against the
    answer.</span>`;
  rows.forEach(t=>{
    h+=`<div style="margin-top:9px">${dgLink(t.id)}
      <span class="muted">finished ${esc(t.done||"—")}</span>
      <div class="muted">${esc(t.outcome||"")}</div>
      <label>What does it show about the answer?</label>
      <input id="ev_${esc(t.id)}" placeholder="it confirms the answer, because…">
      <p style="margin:8px 0"><button class="ghost" data-ev="${esc(t.id)}">It confirms the answer</button></p>
      <p class="muted" style="margin:0">Or reopen below, if it does not.</p></div>`;
  });
  return h+`</div>`;
}

async function readEvidence(tid){
  const vid=sel, note=($("#ev_"+tid)||{}).value||"";
  if(!note.trim()){
    say("Say what it showed — without that the record says somebody clicked a button.","bad",vid);
    return;
  }
  try{
    const res=await api("/api/read-evidence",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({vertex:vid, task:tid, note:note.trim()})});
    TPEND=await api("/api/task-pending"); tray();
    /* Where it landed, said out loud: this is a *task* op staged from a
       decision panel, and a tray that gains a row the person cannot account
       for is worse than the button being absent. */
    say((res.notes||[]).join(" "), "ok", vid);
    if(vid===sel) panel();
  }catch(err){ say(err.message,"bad",vid); }
}

/* ---- the readings the page did not have ----------------------------------

   `depends on` is one hop, which is the neighbourhood rather than the
   reasoning. Each of these is computed by the function the CLI uses — a page
   deriving its own premise chain is the drift this tool exists to catch. */

async function showChain(vid){
  let r;
  try{ r=await api("/api/context?id="+encodeURIComponent(vid)); }
  catch(err){ say(err.message,"bad",vid); return; }
  if(r.error){ say(r.error,"bad",vid); return; }
  let h=`<h2>${esc(vid)} — what it rests on</h2>`;
  if(!r.chain.length) h+=`<p class="muted">Nothing. It is a root.</p>`;
  /* The reading first, because it is the reading: a chain with an unsettled
     link makes everything below it a bet rather than a conclusion. */
  if(r.shaky.length)
    h+=`<p class="warn">${esc(r.shaky.join(", "))} ${r.shaky.length===1?"is":"are"}
      not settled — anything resting on ${r.shaky.length===1?"it":"them"} is a
      bet on the answer, not a conclusion from it.</p>`;
  else if(r.chain.length)
    h+=`<p class="muted">Every premise below is settled.</p>`;
  r.chain.forEach(p=>{
    h+=`<div class="finding${p.shaky?"":" warning"}" style="border-left-color:${
      p.shaky?"var(--warn)":"var(--ok)"}">
      <b>${dgLink(p.id)}</b> ${esc(p.title)}
      <div class="muted">${esc(p.status)}${
        p.also_opened.length?` · also opened ${esc(p.also_opened.join(", "))}`:""}</div>
      ${p.answer?`<div>${mdFold(p.answer)}</div>`:""}
      ${p.falsifier?`<div class="muted">falsifier — ${esc(p.falsifier)}</div>`:""}
      ${p.depth < r.chain.length-1
        ? `<a href="#" class="muted" data-path="${esc(p.id)}|${esc(vid)}">the chain from here…</a>`
        : ""}</div>`;
  });
  h+=`<p style="margin:12px 0"><button class="ghost" id="chBack">Back to ${esc(vid)}</button></p>`;
  $("#side").innerHTML=h;
  $("#side").querySelectorAll("a[data-dg]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault(); jump(a.dataset.dg);
  });
  $("#side").querySelectorAll("a[data-path]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault();
    const [from,to]=a.dataset.path.split("|"); showPath(from,to);
  });
  $("#chBack").onclick=()=>{ sel=vid; panel(); };
}

/* `dg path`: how one decision rests on another, which the highlight cannot
   say — it shows a neighbourhood, and this is a single chain. */
async function showPath(a, b){
  let r;
  try{ r=await api(`/api/path?from=${encodeURIComponent(a)}&to=${encodeURIComponent(b)}`); }
  catch(err){ say(err.message,"bad"); return; }
  let h=`<h2>${esc(a)} → ${esc(b)}</h2>`;
  if(r.error||!r.path.length){
    h+=`<p class="muted">${esc(r.error||"no path")}</p>`;
  }else{
    r.path.forEach((n,i)=>{
      h+=`<div style="margin:8px 0"><b>${dgLink(n.id)}</b> ${esc(n.title)}
        <span class="muted">${esc(n.status)}</span></div>`;
      if(n.because) h+=`<div class="muted" style="margin-left:12px">│ ${esc(n.because)}<br>▼</div>`;
    });
  }
  h+=`<p style="margin:12px 0"><button class="ghost" id="pBack">Back</button></p>`;
  $("#side").innerHTML=h;
  $("#side").querySelectorAll("a[data-dg]").forEach(x=>x.onclick=ev=>{
    ev.preventDefault(); jump(x.dataset.dg);
  });
  $("#pBack").onclick=()=>{ sel=a; panel(); };
}

/* `dg areas`: two blocks, never one table. The stores share their areas and
   not their vocabularies — a row summing OPEN with TODO would be counting
   questions and work as if they were the same thing. */
async function showAreas(){
  let r;
  try{ r=await api("/api/areas"); }catch(err){ say(err.message,"bad"); return; }
  sel=null; tsel=null; NEWKIND=null; RELATING=null; draw();
  const block=(title, b)=>{
    if(!b) return "";
    let out=`<h3 style="font-size:12px;color:var(--dim);margin:14px 0 4px">${title}</h3><table>`;
    const statuses=[...new Set(Object.values(b.counts).flatMap(c=>Object.keys(c)))].sort();
    out+=`<tr><th>area</th>${statuses.map(s=>`<th>${esc(s)}</th>`).join("")}</tr>`;
    b.areas.forEach(a=>{
      const c=b.counts[a]||{};
      out+=`<tr><td>${esc(a)}</td>${statuses.map(s=>
        `<td>${c[s]?esc(c[s]):'<span class="muted">·</span>'}</td>`).join("")}</tr>`;
    });
    return out+`</table>`;
  };
  $("#side").innerHTML=`<h2>By area</h2>`+block("decisions", r.decisions)
    +block("work", r.tasks);
}

function panel(){
  const v=G.vertices.find(x=>x.id===sel), d=G.derived[sel];
  const e=G.edges.find(x=>x.from===sel&&x.active);
  const st=base(v.status);
  const decided = !!(e&&e.answer);
  let h=`<h2>${esc(v.id)} — ${esc(v.title)}</h2>
    <span class="pill" style="background:${STATUS_COLOR[st]};color:#04121f">${esc(v.status)}</span>
    <span class="muted"> ${esc(v.area)}</span>
    <div class="kv">
      <div>depends on</div><div>${idList(d.depends)}${
        d.depends.length?` <a href="#" data-chain="${esc(v.id)}" class="muted">why…</a>`:""}</div>`;
  /* Undecided, the targets are all the edge has, so they stay up here with the
     vertex's own facts. Decided, they are part of an answer and move into its
     card — an edge's targets belong to the edge that declared them. */
  if(!decided) h+=`<div>opens</div><div>${idList(d.children)}</div>`;
  h+=`</div>`;
  /* Above the answer card, never below it: a reader who meets the caveat
     after the answer has already read the answer as *the* answer. Red rather
     than muted — this is a store `dg check` refuses, not a note. */
  if(d.rival_answers)
    h+=`<p class="wait" style="border-color:var(--bad)">${esc(d.rival_answers)}</p>`;
  if(decided) h+=edgeCard(e, d.children);
  else if(v.note) h+=`<div class="answer muted">${mdFold(v.note, v.format)}</div>`;
  const j = (JOIN && JOIN.by_decision[sel]) || null;
  if(j && (j.rests_on.length || j.evidence.length)){
    const pend=new Set(j.pending_evidence);
    h+=`<div class="kv">`;
    if(j.rests_on.length) h+=`<div>work because</div><div>${
      j.rests_on.map(id=>dgLink(id)).join(", ")}</div>`;
    if(j.evidence.length) h+=`<div>evidence from</div><div>${
      j.evidence.map(id=>dgLink(id)+(pend.has(id)?' <span class="muted">(open)</span>':"")).join(", ")}</div>`;
    h+=`</div>`;
  }
  /* Results that landed after this answer and have never been read against it.
     The row above says the benign thing — evidence still outstanding — and this
     says the dangerous one, which the page did not say at all: an answer and a
     measurement that may contradict it, sitting in the store together while
     `dg check` reports it and the browser reads clean. */
  const late = (j && j.late_evidence) || [];
  if(late.length) h+=lateEvidence(late);
  /* No heading over these: each card says what it is. The old one had to,
     because a strikethrough line on its own does not. */
  d.history.forEach(x=>h+=supersededCard(x));
  (d.declined||[]).forEach(x=>h+=declinedCard(x));

  if(e&&e.answer){
    h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">`;
    /* A decision under review has **two** exits, and this panel used to offer
       one. Re-affirming says the premise moved and the answer still holds;
       reopening says it does not. Offering only reopen made the browser the
       interface that manufactures PROVISIONAL and cannot clear it, and the one
       act it did offer files a reversal that never happened — which
       `dg confirm`'s docstring calls a lie in the record.

       Which is primary follows which is common: a premise that settles the
       same way it was heading leaves its conclusions standing, so re-affirming
       is the ordinary outcome and reopening is the news. */
    if(st==="PROVISIONAL"){
      const waiting = (d.provisional_because||[]);
      h+= waiting.length
        ? `<p class="wait">Still resting on ${esc(waiting.join(", "))}, which
             ${waiting.length===1?"is":"are"} under review. Until that settles,
             PROVISIONAL is the accurate status.</p>`
        : `<p style="margin:0 0 10px"><button class="primary" id="doConfirm">Re-affirm — the answer still holds</button></p>
           <p class="muted" style="margin:0 0 10px">Its premise moved and settled.
             Nothing about this answer changed, so nothing is superseded.</p>`;
      h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">`;
    }
    h+=`<label>${st==="PROVISIONAL"?"Or reopen it — what challenges the answer?":"Why reopen this?"}</label>
      <textarea id="why" placeholder="what new evidence challenges it"></textarea>
      <label>Short label for the superseded answer</label>
      <input id="sumry" placeholder="e.g. 40–80M parameters">
      <p style="margin:10px 0;display:flex;gap:8px;align-items:center">
        <button class="${st==="PROVISIONAL"?"ghost":"primary"}" id="doReopen">Stage reopen</button>
        ${editBtn()}</p>
      ${editKeys()}
      <div class="note" id="note"></div>`;
  } else {
    /* Linked children are edges in the store; `apply` unions them back in, so
       a box that looked deselectable would be lying — the same rule the org
       buffer states as "(linked) ... stay regardless". */
    const linked=new Set(d.children);
    const opts=G.vertices.filter(x=>x.id!==sel)
      .map(x=>`<option value="${esc(x.id)}">${esc(x.id)} — ${esc(x.title)}${linked.has(x.id)?" (linked — stays)":""}</option>`).join("");
    h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <label>Answer — what was decided, and on what evidence</label>
      <textarea id="answer"></textarea>
      <label>Source</label><input id="source" placeholder="report/… · a script · discussion">
      <label>Falsifier — what evidence would reopen this?</label>
      <input id="fals" placeholder="… or ANALYTIC — why no measurement can overturn it">
      <label>Opens which decisions? (ctrl-click; none = terminal)</label>
      <select id="opens" multiple>${opts}</select>
      <p style="margin:10px 0;display:flex;gap:8px;align-items:center">
        <button class="primary" id="doClose">Stage decision</button>
        ${editBtn()}</p>
      ${editKeys()}
      <div class="note" id="note"></div>`;
  }
  /* Premises, separate from the answer form. Adding one to an *answered*
     question is legal and additive; removing one is refused where the premise
     is decided, because a decided edge's targets are part of its answer — both
     rules are `pending.compose_dep`/`compose_undep`, not this panel. */
  h+=structureBtn("decisions", sel);
  h+=amendForm(knownAreas(), v);
  $("#side").innerHTML=h;
  /* dg: links inside stored prose select that decision, the same jump C-c C-o
     makes in emacs. */
  $("#side").querySelectorAll("a[data-dg]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault(); jump(a.dataset.dg);
  });
  /* `why…` beside the premises. It was drawn from the start and bound by
     nothing: `showChain` sat in the file as dead code while the link did what
     an unbound `href="#"` does, which is to look like a control without being
     one. */
  $("#side").querySelectorAll("a[data-chain]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault(); showChain(a.dataset.chain);
  });
  bindStructure();
  const already=new Set(d.children);
  const holdLinked=()=>$("#opens")&&[...$("#opens").options].forEach(o=>{
    if(already.has(o.value)) o.selected=true;});
  holdLinked();
  restoreDraft();                       /* after the defaults, so it wins */
  holdLinked();                         /* ...except over an edge in the store */
  $("#opens")&&$("#opens").addEventListener("change",holdLinked);
  const n=NOTES[sel];
  if(n) say(n.msg, n.cls);
  $("#doClose")&&($("#doClose").onclick=stageClose);
  $("#doAmend")&&($("#doAmend").onclick=()=>post(amendOp("vertex", sel)));
  $("#doReopen")&&($("#doReopen").onclick=stageReopen);
  $("#doConfirm")&&($("#doConfirm").onclick=stageConfirm);
  $("#side").querySelectorAll("button[data-ev]").forEach(b=>
    b.onclick=()=>readEvidence(b.dataset.ev));
  $("#doEdit")&&($("#doEdit").onclick=()=>composeIn($("#doReopen")?"reopen":"close"));
  if(EDITING && EDITING.vertex===sel){
    /* One compose path at a time for a given decision: the editor already holds
       a copy of this form. */
    const b=$("#doClose")||$("#doReopen"); if(b) b.disabled=true;
  }
  /* Every keystroke updates the draft, so it survives a panel rebuild from any
     path, not just an explicit navigation. */
  $("#side").addEventListener("input", captureDraft);
  $("#side").addEventListener("change", captureDraft);
}

/* Every message the panel shows goes through here, so the editor's progress and
   a validation error cannot end up in two different places.

   `vid` is the decision the message is *about*, which is not always the one on
   screen: an editor session can outlive the user's attention, and a result that
   landed on whichever panel happened to be open was the bug that made a
   successful stage look like nothing at all. Remembered per decision, and
   painted only when that decision is showing. */
function say(msg, cls, vid){
  vid = vid || cur();
  if(msg) NOTES[vid]={msg, cls}; else delete NOTES[vid];
  if(vid!==cur()) return;
  const n=$("#note"); if(!n) return;
  n.className = "note" + (cls ? " "+cls : ""); n.textContent = msg;
}

async function post(op){
  const vid=op.vertex;      /* pinned: the user may navigate before this returns */
  try{
    const res=await api("/api/pending",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(op)});
    PEND=await api("/api/pending"); tray();
    delete DRAFTS[vid];     /* it is staged; it is no longer unconfirmed work */
    /* The server's notes, verbatim — `cross.deciding_ahead_of_evidence` is
       the one helper `dg decide` prints from, and a second wording here is
       the two doors disagreeing about the same act. A note, never a refusal:
       the op is staged either way. */
    const notes=(res&&res.notes)||[];
    say(`Staged ${op.op} for ${vid}.` + (notes.length?" "+notes.join(" "):""),
        notes.length?"warn":"ok", vid);
    if(vid===sel) panel();
  }catch(err){ say(err.message, "bad", vid); }
}
async function postTask(op){ return postTasks([op]); }

/* A group of task ops, staged as one tray write. `dg task drop --drop-too`
   stages the drop and its cascade together through `_tstage_all`; the button
   posts an array for the same reason — half a cascade in the tray says the
   opposite of what the operator answered. */
async function postTasks(ops){
  const tid=ops[0].task;    /* pinned: the user may navigate before this returns */
  try{
    const res=await api("/api/task-pending",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(ops.length===1?ops[0]:ops)});
    TPEND=await api("/api/task-pending"); tray();
    delete DRAFTS[tid];
    const more = ops.length>1 ? ` (+${ops.length-1} dropped with it)` : "";
    /* The server's notes, verbatim, as `post` does above:
       `tasks.starting_on_abandoned_work` is the one helper `dg task start`
       prints from, and a second wording here is the two doors disagreeing
       about the same act. */
    const notes=(res&&res.notes)||[];
    /* `status` where there is one, else the op's own name: `set_fields` has
       no status, and the line used to read "Staged undefined for T04". */
    say(`Staged ${ops[0].status||ops[0].op} for ${tid}.${more}` +
        (notes.length?" "+notes.join(" "):""), notes.length?"warn":"ok", tid);
    if(tid===tsel) taskPanel();
  }catch(err){ say(err.message, "bad", tid); }
}

function stageClose(){
  const a=$("#answer").value.trim(), s=$("#source").value.trim(),
        f=$("#fals").value.trim(),
        to=[...$("#opens").selectedOptions].map(o=>o.value);
  if(!a||!s){ say("Answer and source are required.", "bad"); return; }
  if(to.length&&!f){ say("A non-terminal decision needs a falsifier.", "bad"); return; }
  /* local date, not toISOString(): that is UTC, and near midnight it disagrees
     with the date `dg decide` would file for the same decision */
  const d=new Date(), pad=n=>String(n).padStart(2,"0");
  post({op:"close",vertex:sel,answer:a,source:s,falsifier:f||null,to,
        date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`});
}
/* Its own route, not a status control. `set_status` is derived everywhere else
   in this store — `pending.expand` and `repairs` produce it and stamp it — so a
   page that could post any status would be a second copy of the propagation
   rules. This posts an act: *the premise moved and the answer holds*. */
async function stageConfirm(){
  const vid=sel;
  try{
    const res=await api("/api/confirm",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({vertex:vid})});
    PEND=await api("/api/pending"); tray();
    const notes=(res.notes||[]);
    say(`Staged ${vid} back to DECIDED.`+(notes.length?" "+notes.join(" "):""),
        "ok", vid);
    if(vid===sel) panel();
  }catch(err){ say(err.message,"bad",vid); }
}

function stageReopen(){
  const w=$("#why").value.trim();
  if(!w){ say("Say what challenges it.", "bad"); return; }
  post({op:"reopen",vertex:sel,why:w,summary:$("#sumry").value.trim()||null});
}

/* ---- composing in an editor ----------------------------------------------
   The request blocks for the whole editing session, exactly as `dg decide
   --edit` does in a terminal. Whatever is already typed into the form is sent
   as a seed, so switching to emacs mid-thought never costs work. */
async function composeIn(kind){
  /* Pin the decision for the whole session. It can last minutes, and the user is
     free to go read the rest of the graph while it does — that is the point of
     having the graph on screen. Everything below refers to `vid`, never to
     whatever `sel` has become by the time the editor exits. */
  const vid = sel;
  const seed = kind==="close"
    ? {answer:$("#answer").value, source:$("#source").value,
       falsifier:$("#fals").value,
       to:[...$("#opens").selectedOptions].map(o=>o.value)}
    : {why:$("#why").value, summary:$("#sumry").value};
  captureDraft();                 /* keep it: the editor may come back empty */
  EDITING={vertex:vid, kind};
  panel(); tray();                /* repaint: "waiting", and Apply held back */
  say(ED.emacs
      ? "emacs is open. Compose there, then C-c C-c to stage or C-c C-k to cancel."
      : "The editor is open. Save and exit to stage, or leave it empty to cancel.",
      "wait", vid);
  try{
    const r=await api("/api/compose",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op:kind, vertex:vid, seed})});
    PEND = r.pending || PEND; tray();
    if(r.aborted) say("Cancelled in the editor — nothing staged. "
                      + "What you typed here is still here.", "", vid);
    else{
      delete DRAFTS[vid];         /* staged; the form should come back empty */
      say(`Staged ${r.staged.length} op(s) from the editor.`, "ok", vid);
    }
  }catch(err){ say(err.message, "bad", vid); }
  finally{
    EDITING=null;
    tray();
    /* Repaint whatever is on screen now: this decision to show the result, or
       another one to re-enable its editor button. */
    if(sel) panel();
  }
}

/* What a `set_fields` op writes, read off the op rather than from a copy of
   `pending.FIELDS` kept here. A hard-coded list beside a mechanism that
   derives field names is shape 8, and the first draft of this line got the
   tuple wrong — it guessed `outcome`, which `set_fields` cannot write. The
   bookkeeping keys are the ones the tray adds and the op's own address. */
const OP_KEYS = new Set(["op","vertex","task","from","id","ref","saw","by",
                         "derived_from"]);
function fieldsOf(o){ return Object.keys(o).filter(k=>!OP_KEYS.has(k)); }

/* ---- pending tray ----
   Two batches, side by side and labelled, because `apply` treats them as two:
   a task batch that will not apply cannot stop a decision batch that would,
   and a tray that merged them would imply otherwise. */
function opRow(o, i, kind){
  const det = o.op==="close"?esc((o.answer||"").slice(0,90))
    : o.op==="reopen"?esc(o.why||"")
    : o.op==="set_status"?`→ ${esc(o.status)}`
        + (o.outcome?` <span class="muted">${esc(o.outcome.slice(0,50))}</span>`:"")
        + (o.why?` <span class="muted">${esc(o.why.slice(0,50))}</span>`:"")
        + (o.derived_from?` <span class="muted">(from ${esc(o.derived_from)})</span>`:"")
    : o.op==="add_dep"||o.op==="remove_dep"?esc((o.after||[]).join(", "))
    /* `add_vertex` and `add_task` had no branch and fell through to the JSON
       dump below, which put the area next to `saw`, `ref` and `by` in a cell
       built for a sentence — so the browser's failure and the CLI's were one
       fact: no surface that reviews staged work said what a record is filed
       under, or that the area is new here. The kind was already known two
       lines down, in the list that earns a ✎ button. Audit `R-F7`. */
    : o.op==="add_vertex"||o.op==="add_task"?esc(o.title||"")
    : o.op==="set_fields"?fieldsOf(o)
        .map(f=>`${f} ${esc(o[f]||"—")}`).join(", ")
    : esc(JSON.stringify(o));
  /* Said, never refused: `refuse_area` decides from two strings and cannot
     see a sub-area, so the second line is a person told which corner this is
     filed under and whether the graph has used it before. */
  const area = (o.area||"").trim();
  /* `knownAreas` already exists above and answers exactly this — declared plus
     used, across both stores. A second copy of it was declared here returning a
     Set, and in a classic script the later declaration wins, so every
     Array-consuming caller (`areaField`, `amendForm`) started throwing. One
     definition; the Set is built at the one call site that wants membership. */
  const mark = !area ? ""
    : new Set(knownAreas()).has(area) ? ` <span class="muted">[${esc(area)}]</span>`
    : ` <span class="fresh-area">[${esc(area)} — new]</span>`;
  const node = o.vertex||o.task||o.from||o.id||"";
  /* Revise, and only where it can work: a derived op is not composed and has
     no buffer, and the editor is offered only where a windowed one exists —
     the same rule the panel's "Compose in" button follows. */
  const editable = kind==="d" && ED && ED.available &&
                   ["close","reopen","add_vertex"].includes(o.op) && o.ref;
  return `<tr><td>${i}</td><td>${esc(o.op)}</td><td>${esc(node)}</td>
    <td>${det}${mark}</td><td style="white-space:nowrap">${
      editable?`<button class="x" style="color:var(--accent)" data-edit="${esc(o.ref)}" title="Revise this op in ${esc(ED.editor||"the editor")}">✎</button>`:""
    }<button class="x" data-i="${i}" data-k="${kind}">✕</button></td></tr>`;
}

/* Rows carry the index they had in the **unfiltered** tray. `opRow` writes it
   into `data-i` and the ✕ handler reads `PEND[i]` back out of it, so a narrowed
   table renumbered from zero would delete somebody else's op. */
function trayTable(rows, kind){
  return `<table><tr><th>#</th><th>op</th><th>node</th><th>detail</th><th></th></tr>`
    + rows.map(r=>opRow(r.o,r.i,kind)).join("") + `</table>`;
}

/* The writer the tray is narrowed to, or null for everybody. Page state, not
   stored: it is a lens on one review, and a filter that survived a reload
   would be a tray reading a returning user has no reason to distrust. */
let TRAYWHO=null;

const UNOWNED="unowned";
function whoOf(o){ return o.by || UNOWNED; }

/* Who has work in the two trays, and how many ops each. Counted across both,
   for the reason `pending.roster` gives: they are staged apart and applied
   together, so a writer present in one is present in the review. Named writers
   first and `unowned` last — it is the one entry that is not a name. */
function trayRoster(){
  const c={};
  for(const o of PEND.concat(TPEND)) c[whoOf(o)]=(c[whoOf(o)]||0)+1;
  return Object.keys(c).sort((a,b)=>
    (a===UNOWNED)-(b===UNOWNED) || a.localeCompare(b)).map(n=>[n,c[n]]);
}

function rowsFor(list){
  return list.map((o,i)=>({o,i}))
             .filter(r=>!TRAYWHO || whoOf(r.o)===TRAYWHO);
}

function tray(){
  const total = PEND.length + TPEND.length;
  const roster = trayRoster();
  /* A writer who had ops and now has none — applied, or cleared — must not
     leave the tray narrowed to nobody, which renders as an empty tray and
     reads as an empty one. */
  if(TRAYWHO && !roster.some(r=>r[0]===TRAYWHO)) TRAYWHO=null;
  const dRows=rowsFor(PEND), tRows=rowsFor(TPEND);
  const shown=dRows.length+tRows.length;
  /* Applying while an editor is open would move the graph out from under a
     compose that was validated against the old one. Cheaper to refuse than to
     explain the error afterwards. */
  $("#applyBtn").disabled = shown===0 || EDITING!==null;
  $("#applyBtn").title = EDITING ? `an editor is open for ${EDITING.vertex}` : "";
  /* The button says what it will write, which under a narrowing is not the
     tray. A screen that can reject one writer's proposal but only accept every
     writer's is one that walks its user to "apply everything" and then to a
     reversal — so the accept half narrows too. */
  $("#applyBtn").textContent = !shown ? "Apply"
    : TRAYWHO ? `Apply ${shown} by ${TRAYWHO}` : `Apply ${shown}`;
  if(!total){ $("#tray").innerHTML=`<span class="muted">Nothing staged.</span>`; return; }
  let h="";
  /* The roster, and only where somebody is named: a project that never sets an
     identity is owed the reading it had before ownership existed, and a row of
     one chip saying "unowned" is noise dressed as information. Mirrors
     `_roster_line` in the CLI. */
  if(roster.some(r=>r[0]!==UNOWNED)){
    h+=`<div style="margin-bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <span class="muted">staged by</span>
      <button class="chip" data-who="" ${TRAYWHO?"":'style="font-weight:600"'}>everyone ${total}</button>`
      + roster.map(([n,c])=>
        `<button class="chip" data-who="${esc(n)}" ${TRAYWHO===n?'style="font-weight:600"':""}>${esc(n)} ${c}</button>`).join("")
      + `</div>`;
  }
  h+=`<div class="tray-split">`;
  /* A clear per tray. The count is in the button rather than behind it: the
     trays are shared, so clearing can discard something a terminal staged a
     minute ago, and the number is the only warning that would have said so.
     Under a narrowing it discards that writer's ops alone, which is the whole
     point of being able to read one proposal at a time. */
  const clearBtn = (n,k) =>
    `<button class="chip" data-clear="${k}" style="margin-left:8px">clear ${n}${TRAYWHO?` by ${esc(TRAYWHO)}`:""}</button>`;
  if(dRows.length) h+=`<div><h3>decisions (${dRows.length})${clearBtn(dRows.length,"d")}</h3>${trayTable(dRows,"d")}</div>`;
  if(tRows.length) h+=`<div><h3>tasks (${tRows.length})${clearBtn(tRows.length,"t")}</h3>${trayTable(tRows,"t")}</div>`;
  h+=`</div>`;
  $("#tray").innerHTML=h;
  $("#tray").querySelectorAll("button[data-who]").forEach(b=>b.onclick=()=>{
    TRAYWHO = b.dataset.who || null; tray();
  });
  $("#tray").querySelectorAll("button[data-clear]").forEach(b=>b.onclick=()=>
    confirmClear(b.dataset.clear==="t"));
  $("#tray").querySelectorAll("button[data-edit]").forEach(b=>b.onclick=()=>
    reviseOp(b.dataset.edit));
  $("#tray").querySelectorAll(".x[data-i]").forEach(b=>b.onclick=async()=>{
    const task = b.dataset.k==="t";
    const list = task?TPEND:PEND;
    const gone = list[b.dataset.i];
    /* The op's id when it has one, its position otherwise. The tray is shared
       and a terminal applying between this page's last refresh and this click
       shifts every position past what it removed, so a position can address a
       different op by the time it arrives. An id does not move. Audit F29. */
    const ref = (gone && gone.ref) || b.dataset.i;
    await api((task?"/api/task-pending/":"/api/pending/")+encodeURIComponent(ref),{method:"DELETE"});
    if(task) TPEND=await api("/api/task-pending"); else PEND=await api("/api/pending");
    tray();
    /* "Staged …" is no longer true of a node whose op was just dropped. */
    const node = gone && (gone.vertex||gone.task);
    if(node) say("", "", node);
    if(node && node===cur()) cur()===sel?panel():taskPanel();
  });
}

$("#applyBtn").onclick=async()=>{
  try{
    const r = await api("/api/apply",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(TRAYWHO?{agent:TRAYWHO}:{})});
    /* Every note describes a staging area that no longer exists. */
    Object.keys(NOTES).forEach(k=>delete NOTES[k]);
    sel=null; tsel=null; await boot(); fit(); draw();
    const bits=[];
    if(r.applied) bits.push(`${r.applied} decision op(s)`);
    if(r.applied_tasks) bits.push(`${r.applied_tasks} task op(s)`);
    /* What moved under the batch while it was staged. Said, never refused —
       the invariants already refuse the dangerous case, so what reaches here
       applied cleanly and rests on something that changed quietly. */
    const moved = (r.drift||[]).map(d=>`<li>${esc(d)}</li>`).join("");
    $("#side").innerHTML=`<p class="muted">Applied ${bits.join(" and ")}. Both
      stores and their generated views are up to date.</p>`
      + (moved?`<p class="warn">Moved while this batch was staged:</p>
         <ul class="muted">${moved}</ul>`:"");
  }catch(err){
    /* A refusal leaves everything staged; a partial write does not, and the
       message says which. Reload the trays either way rather than assuming. */
    PEND=await api("/api/pending").catch(()=>PEND);
    TPEND=T?await api("/api/task-pending").catch(()=>TPEND):[];
    tray();
    $("#tray").innerHTML=`<div class="err">${esc(err.message)}</div>`+$("#tray").innerHTML;
  }
};

/* Asked in the panel rather than through `confirm()`: a browser modal blocks
   every subsequent event, and this one is answerable with the count in front
   of you. */
function confirmClear(task){
  const n=rowsFor(task?TPEND:PEND).length;
  const who=TRAYWHO;
  $("#side").innerHTML=`<h2>Discard ${n} staged op(s)${who?` by ${esc(who)}`:""}?</h2>
    <p class="muted">This tray is shared with <code>dg ${task?"task ":""}pending</code>
      in a terminal, so ${who?`even ${esc(who)}'s may be mid-batch`:"some of these may not be yours"}.
      Nothing that has already been applied is affected.</p>
    <p style="margin:10px 0;display:flex;gap:8px">
      <button class="primary" id="clYes">Discard ${n}</button>
      <button class="ghost" id="clNo">Keep them</button></p>
    <div class="note" id="note"></div>`;
  $("#clNo").onclick=()=>{ $("#side").innerHTML=`<p class="muted">Click a node to inspect it.</p>`; };
  $("#clYes").onclick=async()=>{
    try{
      /* `who` is read from the closure, not from `TRAYWHO`: the chips are live
         behind this panel, and a narrowing changed between opening it and
         clicking Discard would discard a set the question was never asked
         about. */
      const r=await api((task?"/api/task-pending":"/api/pending")
                        + (who?`?agent=${encodeURIComponent(who)}`:""),
                        {method:"DELETE"});
      if(task) TPEND=await api("/api/task-pending"); else PEND=await api("/api/pending");
      Object.keys(NOTES).forEach(k=>delete NOTES[k]);
      tray(); await soundness();
      $("#side").innerHTML=`<p class="muted">Discarded ${esc(r.cleared)} op(s).</p>`;
    }catch(err){ say(err.message,"bad"); }
  };
}

/* `dg edit N`: a replacement, never a re-stage. Re-staging moves the op to the
   end of the batch and any derived `set_status` would then apply before the
   change it was derived from — which is why this posts a `ref` and lets
   `pending.replace_group` do the work. */
async function reviseOp(ref){
  EDITING={vertex:ref, kind:"edit"};
  tray();
  $("#side").innerHTML=`<p class="wait">${esc(ED.editor||"The editor")} is open on
    that op. Save and exit to replace it, or leave it empty to cancel.</p>`;
  try{
    const r=await api("/api/edit",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ref})});
    EDITING=null;
    PEND=r.pending||await api("/api/pending"); tray();
    await soundness();
    $("#side").innerHTML= r.aborted
      ? `<p class="muted">Left unchanged.</p>`
      : `<p class="muted">Replaced with ${(r.staged||[]).length} op(s).</p>`;
  }catch(err){
    EDITING=null; tray();
    $("#side").innerHTML=`<div class="err">${esc(err.message)}</div>`;
  }
}

$("#newBtn").onclick=newNode;
$("#soundBtn").onclick=soundPanel;
$("#areasBtn").onclick=showAreas;
$("#refreshBtn").onclick=refresh;

/* Stopped while the tab is hidden and asked once on the way back, so a laptop
   left open overnight does not spend the night asking, and the answer is
   current the moment somebody looks again. `pollStat` checks `document.hidden`
   too — a timer can fire between the event and the clear. */
addEventListener("visibilitychange",()=>{ if(!document.hidden) pollStat(); });

boot().then(()=>{
  fit(); draw(); refreshBadge();
  POLL = setInterval(pollStat, POLL_EVERY);
});
</script>
</body>
</html>
