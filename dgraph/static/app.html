<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Replaced per run by dgraph/server.py. A cross-origin page cannot read it,
     which is what keeps another tab from driving this API. -->
<meta name="dg-token" content="__DG_TOKEN__">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decision graph</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --line:#2a323d; --ink:#e6edf3; --dim:#8b98a5;
    --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --prov:#39c5cf;
    --reop:#bc8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.2px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--dim);
    border-radius:99px;padding:2px 10px;cursor:pointer;font-size:12px}
  .chip.on{color:var(--ink);border-color:var(--accent);background:#1c2733}
  .grow{flex:1}
  button.primary{background:var(--accent);color:#04121f;border:0;border-radius:6px;
    padding:5px 12px;font-weight:650;cursor:pointer}
  button.primary:disabled{opacity:.4;cursor:default}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);
    border-radius:6px;padding:5px 12px;font-weight:600;cursor:pointer}
  button.ghost:disabled{opacity:.45;cursor:default}
  .note{font-size:12px;margin-top:8px;white-space:pre-wrap}
  .note.wait{color:var(--prov)}
  .note.ok{color:var(--ok)}
  .note.bad{color:var(--bad)}
  .keys{color:var(--dim);font-size:11px;margin-top:6px}
  kbd{background:#0d1117;border:1px solid var(--line);border-radius:3px;
    padding:0 4px;font-size:10.5px;font-family:ui-monospace,monospace}
  main{flex:1;display:flex;min-height:0}
  #canvas{flex:1;overflow:hidden;position:relative}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg.drag{cursor:grabbing}
  .node rect{stroke-width:1.6px}
  .node text{font-size:11px;fill:var(--ink);pointer-events:none}
  .node .vid{font-weight:700;font-size:10.5px}
  .node{cursor:pointer}
  .node.dim{opacity:.16}
  .edge{fill:none;stroke:var(--line);stroke-width:1.4px}
  .edge.pending-dep{stroke-dasharray:3 4;opacity:.75}
  .edge.hot{stroke:var(--accent);stroke-width:2.4px}
  .edge.dim{opacity:.07}
  aside{width:420px;border-left:1px solid var(--line);background:var(--panel);
    overflow:auto;padding:14px}
  aside h2{font-size:14px;margin:0 0 2px}
  .muted{color:var(--dim)}
  .kv{display:grid;grid-template-columns:92px 1fr;gap:3px 8px;margin:10px 0}
  .kv div:nth-child(odd){color:var(--dim)}
  .answer{background:#0d1117;border:1px solid var(--line);
    border-radius:6px;padding:9px 11px;margin:8px 0;font-size:12.5px}
  .answer p{margin:0 0 7px}
  .answer p:last-child{margin-bottom:0}
  .answer code{background:#1c2330;border-radius:3px;padding:0 4px;font-size:11.5px}
  label{display:block;margin:9px 0 3px;color:var(--dim);font-size:12px}
  input,textarea,select{width:100%;background:#0d1117;color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
  textarea{min-height:78px;resize:vertical}
  select[multiple]{height:118px}
  footer{border-top:1px solid var(--line);background:var(--panel);max-height:34%;
    overflow:auto;padding:8px 12px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);
    vertical-align:top}
  th{color:var(--dim);font-weight:600}
  .x{background:none;border:0;color:var(--bad);cursor:pointer;font-size:14px}
  .err{color:var(--bad);white-space:pre-wrap;font-size:12px;margin-top:8px}
  .pill{display:inline-block;border-radius:99px;padding:0 7px;font-size:10.5px;
    font-weight:700;letter-spacing:.3px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;
    margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Decision graph</h1>
    <span class="muted" id="counts"></span>
    <span id="statusChips"></span>
    <button class="chip" id="frontierOnly">frontier only</button>
    <span class="grow"></span>
    <span class="legend" id="legend"></span>
    <button class="primary" id="applyBtn" disabled>Apply</button>
  </header>
  <main>
    <div id="canvas"><svg id="svg"><g id="viewport"></g></svg></div>
    <aside id="side"><p class="muted">Click a decision to inspect or decide it.</p></aside>
  </main>
  <footer id="tray"></footer>
</div>

<script>
const AREA_COLOR = {};
const PALETTE = ["#1f6feb","#8957e5","#238636","#9e6a03","#1f7a8c","#bd561d"];
const STATUS_COLOR = {DECIDED:"var(--ok)",OPEN:"var(--bad)",BLOCKED:"var(--warn)",
                      PROVISIONAL:"var(--prov)",REOPENED:"var(--reop)"};
let G=null, PEND=[], sel=null, ED=null;
/* Transient, per-decision, never persisted: the panel is rebuilt from scratch on
   every navigation, so anything the user has not committed yet has to live out
   here or it dies with the old DOM.

     DRAFTS   what is typed into a form but not staged
     NOTES    the last thing said about a decision, so a result that arrives
              after the user has navigated away is filed under the decision it
              is about rather than whichever one happens to be on screen
     EDITING  the decision an editor is currently open for, if any

   Deliberately in memory only. A draft that outlived a reload would be a draft
   the user has forgotten writing, and there is one buffer per project, so a
   restored EDITING could not refer to a live editor anyway. */
const DRAFTS={}, NOTES={};
let EDITING=null;
const TOKEN = document.querySelector('meta[name=dg-token]').content;
const filter = {status:new Set(), frontier:false};

const base = s => s.split(":")[0];
const $ = s => document.querySelector(s);

async function api(path, opts){
  opts = opts || {};
  if(opts.method && opts.method !== "GET"){
    /* The server demands this on every mutating route. Sending it as a custom
       header is half the point: it forces a preflight that a cross-origin page
       cannot get past. */
    opts.headers = Object.assign({"X-DG-Token":TOKEN}, opts.headers||{});
  }
  const r = await fetch(path, opts);
  const j = await r.json().catch(()=>({error:"bad response"}));
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function boot(){
  G = await api("/api/graph");
  G.areas.forEach((a,i)=>AREA_COLOR[a]=PALETTE[i%PALETTE.length]);
  PEND = await api("/api/pending");
  ED = ED || await api("/api/editor").catch(()=>({available:false}));
  chips(); legend(); layout(); draw(); tray();
}

function chips(){
  const seen = [...new Set(G.vertices.map(v=>base(v.status)))].sort();
  $("#statusChips").innerHTML = seen.map(s=>
    `<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join(" ");
  $("#statusChips").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const s=b.dataset.s;
    filter.status.has(s)?filter.status.delete(s):filter.status.add(s);
    b.classList.toggle("on"); draw();
  });
  $("#frontierOnly").onclick=()=>{
    filter.frontier=!filter.frontier;
    $("#frontierOnly").classList.toggle("on"); draw();
  };
  const c={}; G.vertices.forEach(v=>c[base(v.status)]=(c[base(v.status)]||0)+1);
  $("#counts").textContent = G.vertices.length+" decisions · "+
    Object.entries(c).map(([k,n])=>`${n} ${k.toLowerCase()}`).join(", ");
}

function legend(){
  $("#legend").innerHTML = G.areas.map(a=>
    `<span><i style="background:${AREA_COLOR[a]}"></i>${esc(a)}</span>`).join("");
}

/* ---- layered DAG layout: rank by longest path, barycentre within rank ---- */
const NW=168, NH=46, GAPX=26, GAPY=64;
function layout(){
  const layers={};
  G.vertices.forEach(v=>{
    const r=G.derived[v.id].depth;
    (layers[r]=layers[r]||[]).push(v.id);
  });
  const ranks=Object.keys(layers).map(Number).sort((a,b)=>a-b);
  ranks.forEach(r=>layers[r].sort());
  const pos={};
  const index=()=>ranks.forEach(r=>layers[r].forEach((id,i)=>pos[id]=i));
  index();
  const mean=(ids)=>ids.length?ids.reduce((s,i)=>s+pos[i],0)/ids.length:null;
  for(let sweep=0;sweep<4;sweep++){
    const down = sweep%2===0;
    (down?ranks:[...ranks].reverse()).forEach(r=>{
      layers[r].sort((a,b)=>{
        const ka=mean(down?G.derived[a].depends:G.derived[a].children);
        const kb=mean(down?G.derived[b].depends:G.derived[b].children);
        if(ka===null&&kb===null) return a<b?-1:1;
        if(ka===null) return 1; if(kb===null) return -1;
        return ka-kb || (a<b?-1:1);
      });
      index();
    });
  }
  const widest=Math.max(...ranks.map(r=>layers[r].length));
  const W=widest*(NW+GAPX);
  G.xy={};
  ranks.forEach(r=>{
    const row=layers[r], span=row.length*(NW+GAPX);
    row.forEach((id,i)=>{
      G.xy[id]={x:(W-span)/2 + i*(NW+GAPX), y:r*(NH+GAPY)};
    });
  });
  G.extent={w:W+GAPX, h:(Math.max(...ranks)+1)*(NH+GAPY)};
}

function visible(v){
  if(filter.frontier && !G.frontier.includes(v.id)) return false;
  if(filter.status.size && !filter.status.has(base(v.status))) return false;
  return true;
}

function draw(){
  const vp=$("#viewport");
  const related = sel ? new Set([sel,...G.derived[sel].depends,...G.derived[sel].children]) : null;
  let edges="", nodes="";
  G.edges.filter(e=>e.active).forEach(e=>{
    const a=G.xy[e.from]; if(!a) return;
    e.to.forEach(t=>{
      const b=G.xy[t]; if(!b) return;
      const x1=a.x+NW/2, y1=a.y+NH, x2=b.x+NW/2, y2=b.y;
      const my=(y1+y2)/2;
      const cls=["edge"];
      if(!e.answer) cls.push("pending-dep");
      if(related){ cls.push(related.has(e.from)&&related.has(t)?"hot":"dim"); }
      edges+=`<path class="${cls.join(' ')}" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"/>`;
    });
  });
  G.vertices.forEach(v=>{
    const p=G.xy[v.id]; if(!p) return;
    const show=visible(v);
    const st=base(v.status);
    const stroke=STATUS_COLOR[st]||"var(--line)";
    const dash = st==="OPEN"?'stroke-dasharray="5 4"':(st==="PROVISIONAL"?'stroke-dasharray="1 3"':"");
    const t=v.title.length>46?v.title.slice(0,44)+"…":v.title;
    const half = t.length>26 ? t.slice(0,t.lastIndexOf(" ",26)||26) : t;
    const rest = t.length>26 ? t.slice((t.lastIndexOf(" ",26)||26)+1) : "";
    nodes+=`<g class="node${show?"":" dim"}" data-id="${esc(v.id)}" transform="translate(${p.x},${p.y})">
      <rect width="${NW}" height="${NH}" rx="7" fill="${AREA_COLOR[v.area]}22"
            stroke="${stroke}" ${dash}/>
      <text class="vid" x="8" y="15">${esc(v.id)}</text>
      <text x="34" y="15" fill="${stroke}" font-size="9.5">${esc(v.status)}</text>
      <text x="8" y="29">${esc(half)}</text><text x="8" y="41">${esc(rest)}</text>
    </g>`;
  });
  vp.innerHTML=edges+nodes;
  $("#svg").setAttribute("viewBox",view.join(" "));
  vp.querySelectorAll(".node").forEach(n=>n.onclick=()=>select(n.dataset.id));
}
/* --- prose rendering: shared with dgraph/orgmd.py --- */
/* Stored prose comes in whichever dialect it was composed in: org (from
   `dg decide --edit`) or markdown (from the textarea below, md_import.py, or a
   future agent plugin). Render both.

   Single-marker emphasis is ambiguous between the two - org `*x*` means bold,
   markdown `*x*` means italic - so it renders as italic either way. Same
   documented limitation as dgraph/orgmd.py; see that module for why no
   heuristic can fix it. tests/fixtures/org_cases.json pins these rules against
   the Python converter, so the two cannot drift. */
/* Quotes included: escaped text is interpolated into attributes (data-dg,
   href, option value), and an unescaped quote there is an attribute breakout —
   stored prose must never reach the DOM as markup. */
const esc=s=>(s||"").replace(/[<>&"']/g,
  c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
const isRule=l=>/^\s*\|[-+|\s]*\|\s*$/.test(l);
function mdInline(s){
  return s
    /* org links: [[target]] or [[target][label]]. dg: targets select the node
       in place; everything else opens out. Markdown has no [[ ]], so a markdown
       link or reference link is never touched here. */
    .replace(/\[\[([^\[\]]+?)\](?:\[([^\[\]]*?)\])?\]/g, (m,t,l)=>{
      t=t.trim(); l=(l||"").trim();
      if(t.startsWith("dg:")){ const v=t.slice(3).trim();
        return `<a href="#" data-dg="${v}">${l||v}</a>`; }
      if(t.startsWith("file:")) t=t.slice(5).trim();
      /* http(s) and relative targets only. Anything else carrying a scheme —
         javascript:, data:, … — must not become a clickable href. */
      if(/^[a-z][a-z0-9+.-]*:/i.test(t) && !/^https?:/i.test(t))
        return `<code>${l||t}</code>`;
      return `<a href="${t}" target="_blank" rel="noopener">${l||t}</a>`;
    })
    /* org =verbatim= / ~code~, honouring org's own emphasis boundaries so
       lr=0.001 survives. A doubled marker is markdown (~~strike~~), not org. */
    .replace(/(^|[-\u2014\s('"{])([=~])([^\s](?:[^\n]*?[^\s])?)\2(?=[-\u2014\s.,:!?;'")}\[]|$)/g,
      (m,pre,mk,body)=> (body.startsWith(mk)||body.endsWith(mk))
        ? m : `${pre}<code>${body}</code>`)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>');
}
function mdTable(lines){
  let head=lines.some(isRule), rows=[];
  for(const ln of lines){
    if(isRule(ln)){ head=false; continue; }
    const tag=head?"th":"td";
    const cells=ln.trim().replace(/^\||\|$/g,"").split("|")
      .map(c=>`<${tag}>${mdInline(c.trim())}</${tag}>`);
    rows.push("<tr>"+cells.join("")+"</tr>");
  }
  return "<table>"+rows.join("")+"</table>";
}
function md(s){
  return esc(s||"").split(/\n\s*\n/).map(par=>{
    const lines=par.split("\n").filter(l=>l.trim());
    if(!lines.length) return "";
    /* a block of pipe rows is a table in both dialects */
    if(lines.every(l=>l.trim().startsWith("|"))) return mdTable(lines);
    return "<p>"+mdInline(par.replace(/\n/g," ").trim())+"</p>";
  }).filter(Boolean).join("");
}
/* --- end prose rendering --- */

/* ---- pan & zoom ---- */
let view=[0,0,1600,1000];
function fit(){ view=[-30,-30,G.extent.w+60,G.extent.h+60]; }
(function pz(){
  const svg=$("#svg"); let drag=null;
  svg.addEventListener("mousedown",e=>{ if(e.target.closest(".node"))return;
    drag={x:e.clientX,y:e.clientY,v:[...view]}; svg.classList.add("drag"); });
  addEventListener("mouseup",()=>{drag=null;svg.classList.remove("drag")});
  addEventListener("mousemove",e=>{ if(!drag)return;
    const k=view[2]/svg.clientWidth;
    view[0]=drag.v[0]-(e.clientX-drag.x)*k; view[1]=drag.v[1]-(e.clientY-drag.y)*k;
    svg.setAttribute("viewBox",view.join(" ")); });
  svg.addEventListener("wheel",e=>{ e.preventDefault();
    const k=e.deltaY>0?1.12:0.89;
    const r=svg.getBoundingClientRect();
    const mx=view[0]+(e.clientX-r.left)/r.width*view[2];
    const my=view[1]+(e.clientY-r.top)/r.height*view[3];
    view[2]*=k; view[3]*=k; view[0]=mx-(mx-view[0])*k; view[1]=my-(my-view[1])*k;
    svg.setAttribute("viewBox",view.join(" ")); },{passive:false});
})();

/* ---- side panel ---- */
function select(id){ captureDraft(); sel=id; draw(); panel(); }

/* Keyed by element id, so this works for both the decide and the reopen form
   without either having to declare its fields. */
function captureDraft(){
  if(!sel || !$("#side")) return;
  const d={};
  let any=false;
  $("#side").querySelectorAll("input[id],textarea[id],select[id]").forEach(el=>{
    const val = el.multiple ? [...el.selectedOptions].map(o=>o.value) : el.value;
    d[el.id]=val;
    if(el.multiple ? val.length : val.trim()) any=true;
  });
  /* An empty form is not a draft. Storing it would make the "opens" list
     remember a deselection the user never made. */
  if(any) DRAFTS[sel]=d; else delete DRAFTS[sel];
}

function restoreDraft(){
  const d=DRAFTS[sel]; if(!d) return;
  Object.entries(d).forEach(([id,val])=>{
    const el=document.getElementById(id); if(!el) return;
    if(el.multiple) [...el.options].forEach(o=>o.selected=val.includes(o.value));
    else el.value=val;
  });
}

/* The editor button exists only when the server says a windowed editor can
   actually be launched. A button whose failure mode is a hung request is worse
   than no button at all. */
const editBtn = () => {
  if(!(ED && ED.available)) return "";
  const name = ED.emacs ? "emacs" : "editor";
  /* While an editor holds the project's one buffer, the button says so rather
     than letting the click come back as a bare 409. */
  if(EDITING) return EDITING.vertex===sel
    ? `<button class="ghost" id="doEdit" disabled>waiting for ${name}…</button>`
    : `<button class="ghost" id="doEdit" disabled
         title="an editor is open for ${esc(EDITING.vertex)}">Compose in ${name}</button>`;
  return `<button class="ghost" id="doEdit">Compose in ${name}</button>`;
};
const editKeys = () => !(ED && ED.available) ? ""
  : ED.emacs
    ? `<div class="keys">emacs opens with this decision's context ·
       <kbd>C-c C-c</kbd> stage · <kbd>C-c C-k</kbd> cancel ·
       <kbd>C-c C-o</kbd> follow a <code>dg:</code> link</div>`
    : `<div class="keys">${esc(ED.editor)} opens on the buffer; save and exit to stage.</div>`;
function panel(){
  const v=G.vertices.find(x=>x.id===sel), d=G.derived[sel];
  const e=G.edges.find(x=>x.from===sel&&x.active);
  const st=base(v.status);
  let h=`<h2>${esc(v.id)} — ${esc(v.title)}</h2>
    <span class="pill" style="background:${STATUS_COLOR[st]};color:#04121f">${esc(v.status)}</span>
    <span class="muted"> ${esc(v.area)}</span>
    <div class="kv">
      <div>depends on</div><div>${esc(d.depends.join(", "))||"—"}</div>
      <div>opens</div><div>${esc(d.children.join(", "))|| (e&&e.answer?"TERMINAL":"—")}</div>`;
  if(e&&e.answer) h+=`<div>falsifier</div><div>${esc(e.falsifier||"—")}</div>
      <div>source</div><div>${esc(e.source||"")} <span class="muted">${e.date||""}</span></div>`;
  h+=`</div>`;
  if(e&&e.answer) h+=`<div class="answer">${md(e.answer)}</div>`;
  else if(v.note) h+=`<div class="answer muted">${md(v.note)}</div>`;
  if(d.history.length){
    h+=`<p class="muted" style="margin-bottom:4px">Superseded here</p>`;
    d.history.forEach(x=>h+=`<div class="answer" style="font-size:12px">
      <span style="text-decoration:line-through;opacity:.65">${esc(x.summary)}</span>
      → <b>${esc(x.replaced_by||"(undecided)")}</b><br>
      <span class="muted">${md(x.why||"")}</span></div>`);
  }

  if(e&&e.answer){
    h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <label>Why reopen this?</label>
      <textarea id="why" placeholder="what new evidence challenges it"></textarea>
      <label>Short label for the superseded answer</label>
      <input id="sumry" placeholder="e.g. 40–80M parameters">
      <p style="margin:10px 0;display:flex;gap:8px;align-items:center">
        <button class="primary" id="doReopen">Stage reopen</button>
        ${editBtn()}</p>
      ${editKeys()}
      <div class="note" id="note"></div>`;
  } else {
    const opts=G.vertices.filter(x=>x.id!==sel)
      .map(x=>`<option value="${esc(x.id)}">${esc(x.id)} — ${esc(x.title)}</option>`).join("");
    h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <label>Answer — what was decided, and on what evidence</label>
      <textarea id="answer"></textarea>
      <label>Source</label><input id="source" placeholder="report/… · a script · discussion">
      <label>Falsifier — what evidence would reopen this?</label>
      <input id="fals" placeholder="… or ANALYTIC — why no measurement can overturn it">
      <label>Opens which decisions? (ctrl-click; none = terminal)</label>
      <select id="opens" multiple>${opts}</select>
      <p style="margin:10px 0;display:flex;gap:8px;align-items:center">
        <button class="primary" id="doClose">Stage decision</button>
        ${editBtn()}</p>
      ${editKeys()}
      <div class="note" id="note"></div>`;
  }
  $("#side").innerHTML=h;
  /* dg: links inside stored prose select that decision, the same jump C-c C-o
     makes in emacs. */
  $("#side").querySelectorAll("a[data-dg]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault();
    if(G.vertices.some(v=>v.id===a.dataset.dg)) select(a.dataset.dg);
  });
  const already=new Set(d.children);
  $("#opens")&&[...$("#opens").options].forEach(o=>o.selected=already.has(o.value));
  restoreDraft();                       /* after the defaults, so it wins */
  const n=NOTES[sel];
  if(n) say(n.msg, n.cls);
  $("#doClose")&&($("#doClose").onclick=stageClose);
  $("#doReopen")&&($("#doReopen").onclick=stageReopen);
  $("#doEdit")&&($("#doEdit").onclick=()=>composeIn($("#doReopen")?"reopen":"close"));
  if(EDITING && EDITING.vertex===sel){
    /* One compose path at a time for a given decision: the editor already holds
       a copy of this form. */
    const b=$("#doClose")||$("#doReopen"); if(b) b.disabled=true;
  }
  /* Every keystroke updates the draft, so it survives a panel rebuild from any
     path, not just an explicit navigation. */
  $("#side").addEventListener("input", captureDraft);
  $("#side").addEventListener("change", captureDraft);
}

/* Every message the panel shows goes through here, so the editor's progress and
   a validation error cannot end up in two different places.

   `vid` is the decision the message is *about*, which is not always the one on
   screen: an editor session can outlive the user's attention, and a result that
   landed on whichever panel happened to be open was the bug that made a
   successful stage look like nothing at all. Remembered per decision, and
   painted only when that decision is showing. */
function say(msg, cls, vid){
  vid = vid || sel;
  if(msg) NOTES[vid]={msg, cls}; else delete NOTES[vid];
  if(vid!==sel) return;
  const n=$("#note"); if(!n) return;
  n.className = "note" + (cls ? " "+cls : ""); n.textContent = msg;
}

async function post(op){
  const vid=op.vertex;      /* pinned: the user may navigate before this returns */
  try{
    await api("/api/pending",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(op)});
    PEND=await api("/api/pending"); tray();
    delete DRAFTS[vid];     /* it is staged; it is no longer unconfirmed work */
    say(`Staged ${op.op} for ${vid}.`, "ok", vid);
    if(vid===sel) panel();
  }catch(err){ say(err.message, "bad", vid); }
}
function stageClose(){
  const a=$("#answer").value.trim(), s=$("#source").value.trim(),
        f=$("#fals").value.trim(),
        to=[...$("#opens").selectedOptions].map(o=>o.value);
  if(!a||!s){ say("Answer and source are required.", "bad"); return; }
  if(to.length&&!f){ say("A non-terminal decision needs a falsifier.", "bad"); return; }
  post({op:"close",vertex:sel,answer:a,source:s,falsifier:f||null,to,
        date:new Date().toISOString().slice(0,10)});
}
function stageReopen(){
  const w=$("#why").value.trim();
  if(!w){ say("Say what challenges it.", "bad"); return; }
  post({op:"reopen",vertex:sel,why:w,summary:$("#sumry").value.trim()||null});
}

/* ---- composing in an editor ----------------------------------------------
   The request blocks for the whole editing session, exactly as `dg decide
   --edit` does in a terminal. Whatever is already typed into the form is sent
   as a seed, so switching to emacs mid-thought never costs work. */
async function composeIn(kind){
  /* Pin the decision for the whole session. It can last minutes, and the user is
     free to go read the rest of the graph while it does — that is the point of
     having the graph on screen. Everything below refers to `vid`, never to
     whatever `sel` has become by the time the editor exits. */
  const vid = sel;
  const seed = kind==="close"
    ? {answer:$("#answer").value, source:$("#source").value,
       falsifier:$("#fals").value,
       to:[...$("#opens").selectedOptions].map(o=>o.value)}
    : {why:$("#why").value, summary:$("#sumry").value};
  captureDraft();                 /* keep it: the editor may come back empty */
  EDITING={vertex:vid, kind};
  panel(); tray();                /* repaint: "waiting", and Apply held back */
  say(ED.emacs
      ? "emacs is open. Compose there, then C-c C-c to stage or C-c C-k to cancel."
      : "The editor is open. Save and exit to stage, or leave it empty to cancel.",
      "wait", vid);
  try{
    const r=await api("/api/compose",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op:kind, vertex:vid, seed})});
    PEND = r.pending || PEND; tray();
    if(r.aborted) say("Cancelled in the editor — nothing staged. "
                      + "What you typed here is still here.", "", vid);
    else{
      delete DRAFTS[vid];         /* staged; the form should come back empty */
      say(`Staged ${r.staged.length} op(s) from the editor.`, "ok", vid);
    }
  }catch(err){ say(err.message, "bad", vid); }
  finally{
    EDITING=null;
    tray();
    /* Repaint whatever is on screen now: this decision to show the result, or
       another one to re-enable its editor button. */
    if(sel) panel();
  }
}

/* ---- pending tray ---- */
function tray(){
  /* Applying while an editor is open would move the graph out from under a
     compose that was validated against the old one. Cheaper to refuse than to
     explain the error afterwards. */
  $("#applyBtn").disabled = PEND.length===0 || EDITING!==null;
  $("#applyBtn").title = EDITING ? `an editor is open for ${EDITING.vertex}` : "";
  $("#applyBtn").textContent = PEND.length ? `Apply ${PEND.length}` : "Apply";
  if(!PEND.length){ $("#tray").innerHTML=`<span class="muted">Nothing staged.</span>`; return; }
  $("#tray").innerHTML=`<table><tr><th>#</th><th>op</th><th>vertex</th><th>detail</th><th></th></tr>`+
    PEND.map((o,i)=>{
      const det = o.op==="close"?esc((o.answer||"").slice(0,90))
        : o.op==="reopen"?esc(o.why||"")
        : o.op==="set_status"?`→ ${esc(o.status)}`+(o.derived_from?` <span class="muted">(from ${esc(o.derived_from)})</span>`:"")
        : esc(JSON.stringify(o));
      return `<tr><td>${i}</td><td>${esc(o.op)}</td><td>${esc(o.vertex||o.from||o.id||"")}</td>
        <td>${det}</td><td><button class="x" data-i="${i}">✕</button></td></tr>`;
    }).join("")+`</table>`;
  $("#tray").querySelectorAll(".x").forEach(b=>b.onclick=async()=>{
    const gone=PEND[b.dataset.i];
    await api("/api/pending/"+b.dataset.i,{method:"DELETE"});
    PEND=await api("/api/pending"); tray();
    /* "Staged 2 op(s)" is no longer true of a decision whose op was just
       dropped. */
    if(gone && gone.vertex) say("", "", gone.vertex);
    if(gone && gone.vertex===sel) panel();
  });
}
$("#applyBtn").onclick=async()=>{
  try{
    await api("/api/apply",{method:"POST"});
    /* Every note describes a staging area that no longer exists. */
    Object.keys(NOTES).forEach(k=>delete NOTES[k]);
    sel=null; await boot(); fit(); draw();
    $("#side").innerHTML=`<p class="muted">Applied. decisions.json and decision-graph.md updated.</p>`;
  }catch(err){ $("#tray").innerHTML=`<div class="err">${esc(err.message)}</div>`+$("#tray").innerHTML; }
};

boot().then(()=>{ fit(); draw(); });
</script>
</body>
</html>
