  const j = (JOIN && JOIN.by_decision[sel]) || null;
  if(j && (j.rests_on.length || j.evidence.length)){
    const pend=new Set(j.pending_evidence);
    h+=`<div class="kv">`;
    if(j.rests_on.length) h+=`<div>work because</div><div>${
      j.rests_on.map(id=>dgLink(id)).join(", ")}</div>`;
    if(j.evidence.length) h+=`<div>evidence from</div><div>${
      j.evidence.map(id=>dgLink(id)+(pend.has(id)?' <span class="muted">(open)</span>':"")).join(", ")}</div>`;
    h+=`</div>`;
  }
  /* Results that landed after this answer and have never been read against it.
     The row above says the benign thing — evidence still outstanding — and this
     says the dangerous one, which the page did not say at all: an answer and a
     measurement that may contradict it, sitting in the store together while
     `dg check` reports it and the browser reads clean. */
  const late = (j && j.late_evidence) || [];
  if(late.length) h+=lateEvidence(late);
  /* No heading over these: each card says what it is. The old one had to,
     because a strikethrough line on its own does not. */
  d.history.forEach(x=>h+=supersededCard(x));
  (d.declined||[]).forEach(x=>h+=declinedCard(x));

  if(e&&e.answer){
    h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">`;
    /* A decision under review has **two** exits, and this panel used to offer
       one. Re-affirming says the premise moved and the answer still holds;
       reopening says it does not. Offering only reopen made the browser the
       interface that manufactures PROVISIONAL and cannot clear it, and the one
       act it did offer files a reversal that never happened — which
       `dg confirm`'s docstring calls a lie in the record.

       Which is primary follows which is common: a premise that settles the
       same way it was heading leaves its conclusions standing, so re-affirming
       is the ordinary outcome and reopening is the news. */
    if(st==="PROVISIONAL"){
      const waiting = (d.provisional_because||[]);
      h+= waiting.length
        ? `<p class="wait">Still resting on ${esc(waiting.join(", "))}, which
             ${waiting.length===1?"is":"are"} under review. Until that settles,
             PROVISIONAL is the accurate status.</p>`
        : `<p style="margin:0 0 10px"><button class="primary" id="doConfirm">Re-affirm — the answer still holds</button></p>
           <p class="muted" style="margin:0 0 10px">Its premise moved and settled.
             Nothing about this answer changed, so nothing is superseded.</p>`;
      h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">`;
    }
    h+=`<label>${st==="PROVISIONAL"?"Or reopen it — what challenges the answer?":"Why reopen this?"}</label>
      <textarea id="why" placeholder="what new evidence challenges it"></textarea>
      <label>Short label for the superseded answer</label>
      <input id="sumry" placeholder="e.g. 40–80M parameters">
      <p style="margin:10px 0;display:flex;gap:8px;align-items:center">
        <button class="${st==="PROVISIONAL"?"ghost":"primary"}" id="doReopen">Stage reopen</button>
        ${editBtn()}</p>
      ${editKeys()}
      <div class="note" id="note"></div>`;
  } else {
    /* Linked children are edges in the store; `apply` unions them back in, so
       a box that looked deselectable would be lying — the same rule the org
       buffer states as "(linked) ... stay regardless". They are said as text
       and the picker offers only what could be added. */
    const cand=opensCandidates(sel);
    h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <label>Answer — what was decided, and on what evidence</label>
      <textarea id="answer"></textarea>
      <label>Source</label><input id="source" placeholder="report/… · a script · discussion">
      <label>Falsifier — what evidence would reopen this?</label>
      <input id="fals" placeholder="… or ANALYTIC — why no measurement can overturn it">
      <label>Opens — the questions this answer raises${cand.fixed.length ? "" : "; none = terminal"}</label>
      ${cand.fixed.length ? `<p class="muted" style="margin:2px 0 4px">Already opens ${idList(cand.fixed)} — edges in the store, kept on Apply.</p>` : ""}
      <details id="opensMore" class="more">
        <summary class="chip">+ opens another question…</summary>
        <p class="muted" style="margin:6px 0 0">An edge from ${esc(sel)} to an existing question this answer raises. A question that does not exist yet is filed with <b>+ new</b>, resting on ${esc(sel)}.</p>
        ${idPicker("opens", cand.rows)}
      </details>
      <p style="margin:10px 0;display:flex;gap:8px;align-items:center">
        <button class="primary" id="doClose">Stage decision</button>
        ${editBtn()}</p>
      ${editKeys()}
      <div class="note" id="note"></div>`;
  }
  /* Premises, separate from the answer form. Adding one to an *answered*
     question is legal and additive; removing one is refused where the premise
     is decided, because a decided edge's targets are part of its answer — both
     rules are `pending.compose_dep`/`compose_undep`, not this panel. */
  h+=structureBtn("decisions", sel);
  h+=amendForm(knownAreas(), v);
  $("#side").innerHTML=h;
  /* dg: links inside stored prose select that decision, the same jump C-c C-o
     makes in emacs. */
  $("#side").querySelectorAll("a[data-dg]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault(); jump(a.dataset.dg);
  });
  /* `why…` beside the premises. It was drawn from the start and bound by
     nothing: `showChain` sat in the file as dead code while the link did what
     an unbound `href="#"` does, which is to look like a control without being
     one. */
  $("#side").querySelectorAll("a[data-chain]").forEach(a=>a.onclick=ev=>{
    ev.preventDefault(); showChain(a.dataset.chain);
  });
  bindStructure();
  /* The linked children are no longer boxes to hold selected: the picker
     offers only what could be added, and says the linked ones as text. */
  restoreDraft();
  const n=NOTES[sel];
  if(n) say(n.msg, n.cls);
  $("#doClose")&&($("#doClose").onclick=stageClose);
  $("#doAmend")&&($("#doAmend").onclick=()=>post(amendOp("vertex", sel)));
  $("#doComposeAmend")&&($("#doComposeAmend").onclick=()=>composeAmend("decisions", sel));
  $("#doReopen")&&($("#doReopen").onclick=stageReopen);
  $("#doConfirm")&&($("#doConfirm").onclick=stageConfirm);
  $("#side").querySelectorAll("button[data-ev]").forEach(b=>
    b.onclick=()=>readEvidence(b.dataset.ev));
  $("#doEdit")&&($("#doEdit").onclick=()=>composeIn($("#doReopen")?"reopen":"close"));
  if(EDITING && EDITING.vertex===sel){
    /* One compose path at a time for a given decision: the editor already holds
       a copy of this form. */
    const b=$("#doClose")||$("#doReopen"); if(b) b.disabled=true;
  }
  /* Every keystroke updates the draft, so it survives a panel rebuild from any
     path, not just an explicit navigation. */
  $("#side").addEventListener("input", captureDraft);
  $("#side").addEventListener("change", captureDraft);
}

/* Every message the panel shows goes through here, so the editor's progress and
   a validation error cannot end up in two different places.

   `vid` is the decision the message is *about*, which is not always the one on
   screen: an editor session can outlive the user's attention, and a result that
   landed on whichever panel happened to be open was the bug that made a
   successful stage look like nothing at all. Remembered per decision, and
   painted only when that decision is showing. */
function say(msg, cls, vid){
  vid = vid || cur();
  if(msg) NOTES[vid]={msg, cls}; else delete NOTES[vid];
  if(vid!==cur()) return;
  const n=$("#note"); if(!n) return;
  n.className = "note" + (cls ? " "+cls : ""); n.textContent = msg;
}

async function post(op){
  const vid=op.vertex;      /* pinned: the user may navigate before this returns */
  try{
    const res=await api("/api/pending",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(op)});
    PEND=await api("/api/pending"); tray();
    delete DRAFTS[vid];     /* it is staged; it is no longer unconfirmed work */
    /* The server's notes, verbatim — `cross.deciding_ahead_of_evidence` is
       the one helper `dg decide` prints from, and a second wording here is
       the two doors disagreeing about the same act. A note, never a refusal:
       the op is staged either way. */
    const notes=(res&&res.notes)||[];
    say(`Staged ${op.op} for ${vid}.` + (notes.length?" "+notes.join(" "):""),
        notes.length?"warn":"ok", vid);
    if(vid===sel) panel();
  }catch(err){ say(err.message, "bad", vid); }
}
async function postTask(op){ return postTasks([op]); }

/* A group of task ops, staged as one tray write. `dg task drop --drop-too`
   stages the drop and its cascade together through `_tstage_all`; the button
   posts an array for the same reason — half a cascade in the tray says the
   opposite of what the operator answered. */
async function postTasks(ops){
  const tid=ops[0].task;    /* pinned: the user may navigate before this returns */
  try{
    const res=await api("/api/task-pending",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(ops.length===1?ops[0]:ops)});
    TPEND=await api("/api/task-pending"); tray();
    delete DRAFTS[tid];
    const more = ops.length>1 ? ` (+${ops.length-1} dropped with it)` : "";
    /* The server's notes, verbatim, as `post` does above:
       `tasks.starting_on_abandoned_work` is the one helper `dg task start`
       prints from, and a second wording here is the two doors disagreeing
       about the same act. */
    const notes=(res&&res.notes)||[];
    /* `status` where there is one, else the op's own name: `set_fields` has
       no status, and the line used to read "Staged undefined for T04". */
    say(`Staged ${ops[0].status||ops[0].op} for ${tid}.${more}` +
        (notes.length?" "+notes.join(" "):""), notes.length?"warn":"ok", tid);
    if(tid===tsel) taskPanel();
  }catch(err){ say(err.message, "bad", tid); }
}

function stageClose(){
  const a=$("#answer").value.trim(), s=$("#source").value.trim(),
        f=$("#fals").value.trim(),
        to=pickerValues("opens");
  if(!a||!s){ say("Answer and source are required.", "bad"); return; }
  if(to.length&&!f){ say("A non-terminal decision needs a falsifier.", "bad"); return; }
  /* local date, not toISOString(): that is UTC, and near midnight it disagrees
     with the date `dg decide` would file for the same decision */
  const d=new Date(), pad=n=>String(n).padStart(2,"0");
  const op={op:"close",vertex:sel,answer:a,source:s,falsifier:f||null,to,
        date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
  carryComposed(op);
  post(op);
}

/* Put back the fields an editor composed that the form has no input for —
   `summary`, `probe`, the prose `format` — so staging a composed decision
   from the form drops nothing (D99). The visible fields are the reader's,
   read straight off the form; these are carried because the form cannot show
   them. Consumed once, for the vertex it was composed against. */
function carryComposed(op){
  if(!(COMPOSED && COMPOSED.vertex===sel)) return;
  for(const k of ["summary","probe","format"])
    if(COMPOSED.op[k]!==undefined && op[k]===undefined) op[k]=COMPOSED.op[k];
  COMPOSED=null;
}
/* Its own route, not a status control. `set_status` is derived everywhere else
   in this store — `pending.expand` and `repairs` produce it and stamp it — so a
   page that could post any status would be a second copy of the propagation
   rules. This posts an act: *the premise moved and the answer holds*. */
async function stageConfirm(){
  const vid=sel;
  try{
    const res=await api("/api/confirm",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({vertex:vid})});
    PEND=await api("/api/pending"); tray();
    const notes=(res.notes||[]);
    say(`Staged ${vid} back to DECIDED.`+(notes.length?" "+notes.join(" "):""),
        "ok", vid);
    if(vid===sel) panel();
  }catch(err){ say(err.message,"bad",vid); }
}

function stageReopen(){
  const w=$("#why").value.trim();
  if(!w){ say("Say what challenges it.", "bad"); return; }
  const op={op:"reopen",vertex:sel,why:w,summary:$("#sumry").value.trim()||null};
  carryComposed(op);
  post(op);
}

/* ---- composing in an editor ----------------------------------------------
   The request blocks for the whole editing session, exactly as `dg decide
   --edit` does in a terminal. Whatever is already typed into the form is sent
   as a seed, so switching to emacs mid-thought never costs work. */
async function composeIn(kind){
  /* Pin the decision for the whole session. It can last minutes, and the user is
     free to go read the rest of the graph while it does — that is the point of
     having the graph on screen. Everything below refers to `vid`, never to
     whatever `sel` has become by the time the editor exits. */
  const vid = sel;
  const seed = kind==="close"
    ? {answer:$("#answer").value, source:$("#source").value,
       falsifier:$("#fals").value,
       to:pickerValues("opens")}
    : {why:$("#why").value, summary:$("#sumry").value};
  captureDraft();                 /* keep it: the editor may come back empty */
  EDITING={vertex:vid, kind};
  panel(); tray();                /* repaint: "waiting", and Apply held back */
  say(ED.emacs
      ? "emacs is open. Compose there, then C-c C-c to bring it back into the form, or C-c C-k to cancel."
      : `${ED.name||"The editor"} is open. Save and exit to bring what you wrote back into the form, or leave it empty to cancel.`,
      "wait", vid);
  try{
    const r=await api("/api/compose",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op:kind, vertex:vid, seed})});
    /* The server's reason travels with the abort — exited with a status,
       buffer unchanged, template untouched, empty Input — and they call for
       different next moves; one sentence for all four hid a terminal that
       was returning nonzero. Audit `AA-F5`. */
    if(r.aborted) say(`Cancelled in the editor — ${r.aborted}. `
                      + "What you typed here is still here.", "", vid);
    else{
      /* D99: the editor fills the form, it does not stage. The parsed fields
         populate the form the reader already knows (via the draft the panel
         restores below), and `COMPOSED` carries the fields the form has no
         input for — `summary`, `probe`, the prose `format` — so `stageClose`
         / `stageReopen` put them back and nothing composed is lost. The
         reader reviews and presses Stage; that is the one staging door. */
      const f = r.fields || {};
      DRAFTS[vid] = kind==="close"
        ? {answer:f.answer||"", source:f.source||"", fals:f.falsifier||"",
           opens:f.to||[]}
        : {why:f.why||"", sumry:f.summary||""};
      COMPOSED = {vertex:vid, op:f};
      say("Filled the form from the editor — review it and press Stage.",
          "ok", vid);
    }
  }catch(err){ say(err.message, "bad", vid); }
  finally{
    EDITING=null;
    tray();
    /* Repaint whatever is on screen now: this decision to show the result, or
       another one to re-enable its editor button. */
    if(sel) panel();
  }
}

/* What a `set_fields` op writes, read off the op rather than from a copy of
   `pending.FIELDS` kept here. A hard-coded list beside a mechanism that
   derives field names is shape 8, and the first draft of this line got the
   tuple wrong — it guessed `outcome`, which `set_fields` cannot write. The
   bookkeeping keys are the ones the tray adds and the op's own address. */
const OP_KEYS = new Set(["op","vertex","task","from","id","ref","saw","by",
                         "derived_from"]);
function fieldsOf(o){ return Object.keys(o).filter(k=>!OP_KEYS.has(k)); }

/* ---- pending tray ----
   Two batches, side by side and labelled, because `apply` treats them as two:
   a task batch that will not apply cannot stop a decision batch that would,
   and a tray that merged them would imply otherwise. */
/* `act` is the ops staged alongside this one, **passed in and never looked
   up**. The marker needs the row's siblings, and reaching for `PEND`/`groupOf`
   from here made this function uncuttable: `test_doors` runs the real `opRow`
   under node by slicing it out of the page, which is the right instinct
   (`R-F9`) and works only while the slice depends on nothing outside it. So
   the caller resolves the act and this renders it. Defaults to `[o]` — a
   group of one, which is what an op with no group is. */
/* The staged ops that name a record nothing will have added by the time
   they apply — the act they rested on was dropped or edited away. `D91`:
   said and marked, never refused. `pending.stranded`'s twin, read from the
   stores and trays the page already holds, so a drop in a terminal shows on
   the next refresh, before anybody runs `dg check --staged`. */
const REFS = ["vertex","task","from","to","into","because","evidence_for","derived_from"];
function strandedRefs(){
  const have = new Set([...(G?G.vertices:[]).map(v=>v.id), ...(T?T.tasks:[]).map(t=>t.id)]);
  const out = new Map();
  for(const o of PEND.concat(TPEND)){
    const named = [];
    for(const k of REFS){
      const v = o[k];
      if(typeof v==="string") named.push(v);
      else if(Array.isArray(v)) v.forEach(x=>{ if(typeof x==="string") named.push(x); });
    }
    const missing = named.filter(id=>!have.has(id)).sort();
    if(missing.length) out.set(o.ref, missing);
    if(o.op==="add_vertex"||o.op==="add_task") have.add(o.id);
  }
  return out;
}

function opRow(o, i, kind, act){
  const det = o.op==="close"?esc((o.answer||"").slice(0,90))
    : o.op==="reopen"?esc(o.why||"")
    : o.op==="set_status"?`→ ${esc(o.status)}`
        + (o.outcome?` <span class="muted">${esc(o.outcome.slice(0,50))}</span>`:"")
        + (o.why?` <span class="muted">${esc(o.why.slice(0,50))}</span>`:"")
        + (o.derived_from?` <span class="muted">(from ${esc(o.derived_from)})</span>`:"")
    : o.op==="add_dep"||o.op==="remove_dep"?esc((o.after||[]).join(", "))
    /* The decision-side edge ops. Worded as `_PENDING_DETAIL` in the CLI
       words them — subject is the premise, detail the vertex it now (or no
       longer) supports — so the two trays read the same row the same way.
       Without this branch they fell through to the JSON dump below, which is
       how "add_edge D73" came to show `saw`, `ref` and `group` in the cell
       meant to say what the edge is. */
    : o.op==="add_edge"?`→ ${esc((o.to||[]).join(", "))}`
    : o.op==="remove_edge"?`✗ ${esc((o.to||[]).join(", "))}`
    /* The three ops the domains scaffold added had no branch either, and fell
       through to the same dump one pass after the comment below was written
       (audit `N-F5`). A reprobe reads as the CLI prints it — kind, then args
       as compact JSON; a bind as the pairs it adds or drops. */
    : o.op==="reprobe"?`${esc((o.probe||{}).kind||"")} <span class="muted">${
        esc(JSON.stringify((o.probe||{}).args||{}))}</span>`
    : o.op==="bind"||o.op==="unbind"?`${o.op==="bind"?"+":"✗"} ${
        esc((o.binds||[]).map(b=>`${b.kind}:${b.ref}`).join(", "))}`
    /* `add_vertex` and `add_task` had no branch and fell through to the JSON
       dump below, which put the area next to `saw`, `ref` and `by` in a cell
       built for a sentence — so the browser's failure and the CLI's were one
       fact: no surface that reviews staged work said what a record is filed
       under, or that the area is new here. The kind was already known two
       lines down, in the list that earns a ✎ button. Audit `R-F7`. */
    : o.op==="add_vertex"||o.op==="add_task"?esc(o.title||"")
    : o.op==="set_fields"?fieldsOf(o)
        .map(f=>`${f} ${esc(o[f]||"—")}`).join(", ")
    : esc(JSON.stringify(o));
  /* Said, never refused: `refuse_area` decides from two strings and cannot
     see a sub-area, so the second line is a person told which corner this is
     filed under and whether the graph has used it before. */
  const area = (o.area||"").trim();
  /* `knownAreas` already exists above and answers exactly this — declared plus
     used, across both stores. A second copy of it was declared here returning a
     Set, and in a classic script the later declaration wins, so every
     Array-consuming caller (`areaField`, `amendForm`) started throwing. One
     definition; the Set is built at the one call site that wants membership. */
  const mark = !area ? ""
    : new Set(knownAreas()).has(area) ? ` <span class="muted">[${esc(area)}]</span>`
    : ` <span class="fresh-area">[${esc(area)} — new]</span>`;
  /* `D91`: an op naming what nothing staged or stored adds, said on its row. */
  const missing = strandedRefs().get(o.ref);
  const lost = missing
    ? ` <span class="fresh-area">· will not apply — names ${esc(missing.join(", "))}, which nothing staged or stored adds</span>` : "";
  const node = o.vertex||o.task||o.from||o.id||"";
  /* Revise, and only where it can work: a derived op is not composed and has
     no buffer, and the editor is offered only where a windowed one exists —
     the same rule the panel's "Compose in" button follows. */
  const editable = ED && ED.available && o.ref && (
    (kind==="d" && ["close","reopen","add_vertex"].includes(o.op)) ||
    (kind==="t" && (o.op==="add_task"
                    || (o.op==="set_status" && o.status==="DONE"))));
  /* **Take this one act.** The finest grain the tray can offer: one op where
     one op is the whole judgement, and all of it where it is not. Before
     groups the accept half was per *writer* at best while the reject half was
     per op, so a reviewer with three proposals from one agent took all three
     or none. `G-F11`.

     **An act is drawn as one block.** Its rows share a left rule, and the
     control cell is one cell spanning them — so the ✓ visibly belongs to
     every row it covers, and the ✕ says it drops the act. The first cut of
     this put ✓ on the head row alone and nothing on the others, and a person
     reading the second row saw an op that could only be cancelled, with no
     way to tell what accepting the first row would take with it. */
  act = act && act.length ? act : [o];
  const grouped = act.length>1;
  const pos = !grouped ? 1
    : act.indexOf(o)>=0 ? act.indexOf(o)+1
    : act.findIndex(m=>m.ref===o.ref)+1;
  const head = pos===1;
  const take = o.ref && head
    ? `<button class="x" style="color:var(--ok,#8ec07c)" data-take="${esc(o.ref)}"
         title="Apply ${grouped?`all ${act.length} ops of this act`:"this op"}, and leave the rest staged">✓</button>`
    : "";
  /* One ✕ per act, on its head. Dropping a member alone is refused by the
     server (`pending.drop` — half a cascade is not a proposal), so the act's
     ✕ carries `data-act` and opens the "drop the whole act?" confirmation
     straight away instead of asking, being refused, and then asking again. */
  const drop = grouped
    ? `<button class="x" data-i="${i}" data-k="${kind}" data-act="${esc(o.ref||"")}"
         title="Drop all ${act.length} ops of this act">✕</button>`
    : `<button class="x" data-i="${i}" data-k="${kind}" title="Drop this op">✕</button>`;
  /* Preview this act on the canvas (D88): one button per act, beside the
     ✓ that would apply the same set. While it is the act being previewed,
     the same button clears it — the way out sits where the way in was. */
  const eye = o.ref && head
    ? (PREVIEW && PREVIEW.scope===o.ref
        ? `<button class="x" style="color:var(--accent);font-weight:700" data-preview-off title="Clear the preview">◉</button>`
        : `<button class="x" style="color:var(--dim)" data-preview="${esc(o.ref)}"
             title="Preview ${grouped?`this act (${act.length} ops)`:"this op"} on the canvas — the store is unchanged">◎</button>`)
    : "";
  const ctl = head
    ? `<td style="white-space:nowrap"${grouped?` class="act-ctl" rowspan="${act.length}"`:""}>${eye}${take}${
        editable?`<button class="x" style="color:var(--accent)" data-edit="${esc(o.ref)}" data-store="${kind==="t"?"tasks":"decisions"}" title="Revise this op in ${esc(ED.name||ED.editor||"the editor")}">✎</button>`:""
      }${drop}</td>`
    : "";
  const cls = grouped ? ` class="act${head?" act-head":""}${pos===act.length?" act-last":""}"` : "";
  return `<tr${cls}><td>${i}</td><td>${esc(o.op)}</td><td>${esc(node)}</td>
    <td>${det}${mark}${grouped?` <span class="muted">· ${pos} of ${act.length} in one act</span>`:""}${lost}</td>${ctl}</tr>`;
}

/* Rows carry the index they had in the **unfiltered** tray. `opRow` writes it
   into `data-i` and the ✕ handler reads `PEND[i]` back out of it, so a narrowed
   table renumbered from zero would delete somebody else's op. */
function trayTable(rows, kind, list){
  /* The act each row belongs to, resolved here so `opRow` stays a function of
     its arguments — see there. */
  /* Rows of one act are rendered together, in the order the act's first row
     appears — a rowspan cannot cover rows that are not adjacent, and an act
     split by an unrelated op between its members would read as two. The
     narrowing by writer cannot split one (an act has one writer), but an
     act's own order in the tray is the store's business, not the table's. */
  const seen = new Set(), ordered = [];
  for(const r of rows){
    if(seen.has(r.i)) continue;
    const act = groupOf(r.o, list);
    const members = act.length>1
      ? act.map(o=>rows.find(x=>x.o===o)).filter(Boolean) : [r];
    for(const m of members){ seen.add(m.i); ordered.push([m, act]); }
  }
  return `<table><tr><th>#</th><th>op</th><th>node</th><th>detail</th><th></th></tr>`
    + ordered.map(([r,act])=>opRow(r.o,r.i,kind,act)).join("") + `</table>`;
}

/* The writer the tray is narrowed to, or null for everybody. Page state, not
   stored: it is a lens on one review, and a filter that survived a reload
   would be a tray reading a returning user has no reason to distrust. */
let TRAYWHO=null;

const UNOWNED="unowned";
function whoOf(o){ return o.by || UNOWNED; }

/* Who has work in the two trays, and how many ops each. Counted across both,
   for the reason `pending.roster` gives: they are staged apart and applied
   together, so a writer present in one is present in the review. Named writers
   first and `unowned` last — it is the one entry that is not a name. */
function trayRoster(){
  const c={};
  for(const o of PEND.concat(TPEND)) c[whoOf(o)]=(c[whoOf(o)]||0)+1;
  return Object.keys(c).sort((a,b)=>
    (a===UNOWNED)-(b===UNOWNED) || a.localeCompare(b)).map(n=>[n,c[n]]);
}

function rowsFor(list){
  return list.map((o,i)=>({o,i}))
             .filter(r=>!TRAYWHO || whoOf(r.o)===TRAYWHO);
}

function tray(){
  /* First, before the early return below: a preview of an act that was
     just dropped must end even when the tray it leaves is empty. */
  syncPreview();
  panelsApply();          /* the tray chip's count follows the trays */
  const total = PEND.length + TPEND.length;
  const roster = trayRoster();
  /* A writer who had ops and now has none — applied, or cleared — must not
     leave the tray narrowed to nobody, which renders as an empty tray and
     reads as an empty one. */
  if(TRAYWHO && !roster.some(r=>r[0]===TRAYWHO)) TRAYWHO=null;
  const dRows=rowsFor(PEND), tRows=rowsFor(TPEND);
  const shown=dRows.length+tRows.length;
  /* Applying while an editor is open would move the graph out from under a
     compose that was validated against the old one. Cheaper to refuse than to
     explain the error afterwards. */
  $("#applyBtn").disabled = shown===0 || EDITING!==null;
  $("#applyBtn").title = EDITING ? `an editor is open for ${EDITING.vertex}` : "";
  /* The button says what it will write, which under a narrowing is not the
     tray. A screen that can reject one writer's proposal but only accept every
     writer's is one that walks its user to "apply everything" and then to a
     reversal — so the accept half narrows too. */
  $("#applyBtn").textContent = !shown ? "Apply"
    : TRAYWHO ? `Apply ${shown} by ${TRAYWHO}` : `Apply ${shown}`;
  if(!total){ $("#tray").innerHTML=`<span class="muted">Nothing staged.</span>`; return; }
  let h="";
  /* The roster, and only where somebody is named: a project that never sets an
     identity is owed the reading it had before ownership existed, and a row of
     one chip saying "unowned" is noise dressed as information. Mirrors
     `_roster_line` in the CLI. */
  if(roster.some(r=>r[0]!==UNOWNED)){
    h+=`<div style="margin-bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <span class="muted">staged by</span>
      <button class="chip" data-who="" ${TRAYWHO?"":'style="font-weight:600"'}>everyone ${total}</button>`
      + roster.map(([n,c])=>
        `<button class="chip" data-who="${esc(n)}" ${TRAYWHO===n?'style="font-weight:600"':""}>${esc(n)} ${c}</button>`).join("")
      + `</div>`;
  }
  /* The tray-wide preview, narrowed with the tray: under a writer's name it
     draws that writer's ops and says so. */
  h+=`<div style="margin-bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <span class="muted">canvas</span>`
    + (PREVIEW && PREVIEW.scope==="all"
        ? `<button class="chip" data-preview-off style="color:var(--accent);font-weight:600">clear preview</button>
           <span class="muted">${esc(PREVIEW.label)}</span>`
        : `<button class="chip" data-preview="all" title="Draw the graph as it would be with ${TRAYWHO?`${esc(TRAYWHO)}'s ops`:"everything staged"} applied — the store is unchanged">preview ${TRAYWHO?`${esc(TRAYWHO)}'s ${shown}`:`all ${total}`}</button>`
          + (PREVIEW?`<span class="muted">previewing ${esc(PREVIEW.label)}</span>`:""))
    + `</div>`;
  h+=`<div class="tray-split">`;
  /* A clear per tray. The count is in the button rather than behind it: the
     trays are shared, so clearing can discard something a terminal staged a
     minute ago, and the number is the only warning that would have said so.
     Under a narrowing it discards that writer's ops alone, which is the whole
     point of being able to read one proposal at a time. */
  const clearBtn = (n,k) =>
    `<button class="chip" data-clear="${k}" style="margin-left:8px">clear ${n}${TRAYWHO?` by ${esc(TRAYWHO)}`:""}</button>`;
  if(dRows.length) h+=`<div><h3>decisions (${dRows.length})${clearBtn(dRows.length,"d")}</h3>${trayTable(dRows,"d",PEND)}</div>`;
  if(tRows.length) h+=`<div><h3>tasks (${tRows.length})${clearBtn(tRows.length,"t")}</h3>${trayTable(tRows,"t",TPEND)}</div>`;
  h+=`</div>`;
  $("#tray").innerHTML=h;
  $("#tray").querySelectorAll("button[data-who]").forEach(b=>b.onclick=()=>{
    TRAYWHO = b.dataset.who || null; tray();
  });
  $("#tray").querySelectorAll("button[data-clear]").forEach(b=>b.onclick=()=>
    confirmClear(b.dataset.clear==="t"));
  $("#tray").querySelectorAll("button[data-edit]").forEach(b=>b.onclick=()=>
    reviseOp(b.dataset.edit, b.dataset.store));
  $("#tray").querySelectorAll("button[data-preview]").forEach(b=>b.onclick=()=>
    previewOn(b.dataset.preview));
  $("#tray").querySelectorAll("button[data-preview-off]").forEach(b=>b.onclick=()=>
    previewOff());
  $("#tray").querySelectorAll(".x[data-i]").forEach(b=>b.onclick=async()=>{
    const task = b.dataset.k==="t";
    const list = task?TPEND:PEND;
    const gone = list[b.dataset.i];
    /* The op's id when it has one, its position otherwise. The tray is shared
       and a terminal applying between this page's last refresh and this click
       shifts every position past what it removed, so a position can address a
       different op by the time it arrives. An id does not move. Audit F29. */
    const ref = (gone && gone.ref) || b.dataset.i;
    const base = (task?"/api/task-pending/":"/api/pending/")+encodeURIComponent(ref);
    /* A group member cannot be dropped alone — staging it was one act, and
       removing one op would leave the rest to be applied as though they meant
       something they do not. The table draws one ✕ per act and it comes here
       with `data-act`, straight to the confirmation. The server's refusal is
       still caught below for a tray this page drew before a terminal grouped
       something into it: the page has to carry the way out either way,
       because a remedy that exists only as a CLI flag is a dead end in a
       browser. `G-F11`. */
    if(b.dataset.act!==undefined){ askDropAct(gone, list, task, ref, null); return; }
    try{
      await api(base,{method:"DELETE"});
    }catch(err){
      const act = groupOf(gone, list);
      if(act.length<2) { trayErr(err.message); return; }
      askDropAct(gone, list, task, ref, err.message.split("\n")[0]);
      return;
    }
    const stranded = strandedRefs();
    if(task) TPEND=await api("/api/task-pending"); else PEND=await api("/api/pending");
    tray(); sayStranded(stranded);
    /* "Staged …" is no longer true of a node whose op was just dropped. */
    const node = gone && (gone.vertex||gone.task);
    if(node) say("", "", node);
    if(node && node===cur()) cur()===sel?panel():taskPanel();
  });
}

/* The "drop the whole act?" confirmation, listing what goes. `why` is the
   server's refusal when one was heard, and nothing when the act's own ✕ was
   what brought the reader here. */
function askDropAct(op, list, task, ref, why){
  const act = groupOf(op, list);
  const rows = act.map(o=>`<li>${esc(opLine(o,task?"t":"d"))}</li>`).join("");
  $("#side").innerHTML=`<h2>Drop the whole act?</h2>
    <p class="muted">${why ? esc(why) : `These ${act.length} ops were staged as one act and are dropped as one.`}</p>
    <ul class="muted">${rows}</ul>
    <p class="muted">Dropping the act turns this proposal down. Leaving it
      whole keeps it reviewable — apply it, or clear this writer's work.</p>
    <button class="x" id="dropAct" data-ref="${esc(ref)}"
            data-k="${task?"t":"d"}">Drop all ${act.length}</button>`;
}

/* A refusal from a tray control, drawn in the tray. `say()` writes into the
   open record's note, and a tray control is clicked with no record open
   more often than not — the inspector may not even be on screen — so a ✓
   refused by name reached nobody (audit `L-F5`, verified in a browser: the
   click did nothing visible). Apply's own catch already drew here; this is
   that line, shared by every control in the tray. */
function trayErr(msg, cls){
  $("#tray").querySelectorAll(":scope > .err, :scope > .warn").forEach(e=>e.remove());
  $("#tray").insertAdjacentHTML("afterbegin", `<div class="${cls||"err"}">${esc(msg)}</div>`);
}

/* ---- the said line (D94, T92) ---------------------------------------------

   What a tray action did — an act applied, everything applied, an act
   dropped, a tray discarded, an op revised — is one line pinned above the
   trays, not the inspector. The inspector was the wrong place twice over: the
   sentence cost the record somebody was reading, and the inspector folds
   away, so it was written where nobody was looking. The line sits above the
   footer so it is read whether the trays are folded or not, and it stays
   until the next tray action says something else or the × dismisses it —
   never a timer, because the one thing it carries that must be read, the
   drift list under Apply, is exactly what a fading bubble loses. `trayErr` is
   the refusal's slot and stays inside the tray, beside the rows it is about. */
function said(html, cls){
  const s=$("#said");
  s.className = cls||"";
  s.innerHTML = `<div class="body">${html}</div>
    <button class="x" id="unsaid" title="Dismiss">&times;</button>`;
  s.hidden = false;
  $("#unsaid").onclick = unsay;
}
function unsay(){ const s=$("#said"); s.hidden=true; s.innerHTML=""; }

/* After a `boot()` that may have removed the open record: reselect it if it
   survived, else draw and say why the inspector is empty. `refresh` had this
   inline; the apply paths cleared the selection and never restored it, which
   is how "Applied" came to be written over the record. Returns whether the
   record is back. */
function reselect(keep){
  const here = keep && ((G && G.vertices.some(v=>v.id===keep))
                     || (T && T.tasks.some(x=>x.id===keep)));
  if(here){ select(keep); return true; }
  draw();
  if(keep) $("#side").innerHTML=`<p class="muted">${esc(keep)} is no longer
    in the graph — another writer removed it, or a staged op that added it
    was discarded or applied away.</p>`;
  return false;
}

/* The inspector as it was before a question took it: the record if one is
   open, the placeholder otherwise. */
function restorePanel(){
  if(cur()) reselect(cur());
  else $("#side").innerHTML=`<p class="muted">Click a node to inspect it.</p>`;
}

/* After a drop: the acts it stranded, said once in the tray (`D91`). `was`
   is `strandedRefs()` from before the drop, so only what this drop stranded
   is named, not what was already marked. */
function sayStranded(was){
  const now = strandedRefs();
  const fresh = [...now.keys()].filter(r=>!was.has(r));
  if(!fresh.length) return;
  const heads = [...new Set(fresh.map(r=>{
    const o = PEND.concat(TPEND).find(x=>x.ref===r);
    return groupOf(o, PEND.includes(o)?PEND:TPEND)[0].ref;
  }))];
  trayErr(`act ${heads.join(", ")} rests on what was dropped and will no longer apply — drop it, or stage what it names again`, "warn");
}

/* Every op staged in the same act as `op`. `[op]` where it carries no group,
   which is both a single-op command and every tray staged before groups
   existed — `pending.group_of`'s twin, and the two must agree. */
function groupOf(op, list){
  if(!op) return [];
  return op.group ? (list||[]).filter(o=>o.group===op.group) : [op];
}

/* One line describing an op, for a list that is not the tray table. */
function opLine(o, kind){
  const subject = o.vertex||o.task||o.id||o.from||"";
  return `${o.ref||""}  ${o.op||"?"}  ${subject}`;
}

/* Apply one act, leaving everything else staged. The accept half at the same
   grain as the reject half — see `opRow`. */
addEventListener("click", async e=>{
  const b=e.target.closest("[data-take]"); if(!b) return;
  try{
    const r = await api("/api/apply",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({group:b.dataset.take})});
    Object.keys(NOTES).forEach(k=>delete NOTES[k]);
    const keep=cur(); sel=null; tsel=null; await boot(); reselect(keep);
    const bits=[];
    if(r.applied) bits.push(`${r.applied} decision op(s)`);
    if(r.applied_tasks) bits.push(`${r.applied_tasks} task op(s)`);
    said(`Applied ${bits.join(" and ")} — one act. Everything else is still staged.`);
  }catch(err){ trayErr(err.message); }
});

/* The act-wide drop the refusal offers. */
addEventListener("click", async e=>{
  const b=e.target.closest("#dropAct"); if(!b) return;
  const task = b.dataset.k==="t";
  try{
    const stranded = strandedRefs();
    await api((task?"/api/task-pending/":"/api/pending/")
              +encodeURIComponent(b.dataset.ref)+"?group=1",{method:"DELETE"});
    if(task) TPEND=await api("/api/task-pending"); else PEND=await api("/api/pending");
    tray(); sayStranded(stranded);
    said("The act was dropped. Nothing it staged is left.");
  }catch(err){ trayErr(err.message); }
});

$("#applyBtn").onclick=async()=>{
  try{
    const r = await api("/api/apply",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(TRAYWHO?{agent:TRAYWHO}:{})});
    /* Every note describes a staging area that no longer exists. */
    Object.keys(NOTES).forEach(k=>delete NOTES[k]);
    const keep=cur(); sel=null; tsel=null; await boot(); fit(); reselect(keep);
    const bits=[];
    if(r.applied) bits.push(`${r.applied} decision op(s)`);
    if(r.applied_tasks) bits.push(`${r.applied_tasks} task op(s)`);
    /* What moved under the batch while it was staged. Said, never refused —
       the invariants already refuse the dangerous case, so what reaches here
       applied cleanly and rests on something that changed quietly. It rides
       the said line, which is why that line never fades. */
    const moved = (r.drift||[]).map(d=>`<li>${esc(d)}</li>`).join("");
    said(`Applied ${bits.join(" and ")}. Both stores and their generated views are up to date.`
      + (moved?`<div class="warn">Moved while this batch was staged:</div><ul>${moved}</ul>`:""));
  }catch(err){
    /* A refusal leaves everything staged; a partial write does not, and the
       message says which. Reload the trays either way rather than assuming. */
    PEND=await api("/api/pending").catch(()=>PEND);
    TPEND=T?await api("/api/task-pending").catch(()=>TPEND):[];
    tray();
    trayErr(err.message);
  }
};

/* Asked in the panel rather than through `confirm()`: a browser modal blocks
   every subsequent event, and this one is answerable with the count in front
   of you. */
function confirmClear(task){
  const n=rowsFor(task?TPEND:PEND).length;
  const who=TRAYWHO;
  $("#side").innerHTML=`<h2>Discard ${n} staged op(s)${who?` by ${esc(who)}`:""}?</h2>
    <p class="muted">This tray is shared with <code>dg ${task?"task ":""}pending</code>
      in a terminal, so ${who?`even ${esc(who)}'s may be mid-batch`:"some of these may not be yours"}.
      Nothing that has already been applied is affected.</p>
    <p style="margin:10px 0;display:flex;gap:8px">
      <button class="primary" id="clYes">Discard ${n}</button>
      <button class="ghost" id="clNo">Keep them</button></p>
    <div class="note" id="note"></div>`;
  $("#clNo").onclick=restorePanel;
  $("#clYes").onclick=async()=>{
    try{
      /* `who` is read from the closure, not from `TRAYWHO`: the chips are live
         behind this panel, and a narrowing changed between opening it and
         clicking Discard would discard a set the question was never asked
         about. */
      /* A discard by writer is a cut like the ✕ (`D91`, `Z-F2`): read what
         was stranded before, say what this one stranded after. */
      const stranded = strandedRefs();
      const r=await api((task?"/api/task-pending":"/api/pending")
                        + (who?`?agent=${encodeURIComponent(who)}`:""),
                        {method:"DELETE"});
      if(task) TPEND=await api("/api/task-pending"); else PEND=await api("/api/pending");
      Object.keys(NOTES).forEach(k=>delete NOTES[k]);
      tray(); await soundness();
      restorePanel();
      said(`Discarded ${esc(r.cleared)} op(s).`);
      sayStranded(stranded);
    }catch(err){ trayErr(err.message); }
  };
}

/* `dg edit N`: a replacement, never a re-stage. Re-staging moves the op to the
   end of the batch and any derived `set_status` would then apply before the
   change it was derived from — which is why this posts a `ref` and lets
   `pending.replace_group` do the work. */
async function reviseOp(ref, store){
  const tasks = store==="tasks";
  EDITING={vertex:ref, kind:"edit"};
  tray();
  said(`${esc(ED.name||ED.editor||"The editor")} is open on that op. Save and exit to
    replace it, or leave it empty to cancel.`, "wait");
  try{
    const r=await api("/api/edit",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ref, store})});
    EDITING=null;
    /* Refresh the tray the op lives in — the task route answers with the task
       tray (D102). */
    if(tasks) TPEND=r.pending||await api("/api/task-pending");
    else PEND=r.pending||await api("/api/pending");
    tray();
    await soundness();
    said(r.aborted ? `Left unchanged — ${esc(r.aborted)}.`
                   : `Replaced with ${(r.staged||[]).length} op(s).`);
  }catch(err){
    EDITING=null; tray(); unsay();
    trayErr(err.message);
  }
}

/* ---- folding the panels -------------------------------------------------
   Sometimes the canvas is the whole point — a long graph read by panning —
   and the panels are a third of the window spent on nothing.

   **The inspector is there only while it has something to show.** It opens
   when a record, a form or a reading is written into it and closes when
   what it held is cleared — an empty inspector is a third of the window
   saying "click a node". Derived from its content by an observer rather
   than toggled at each of the twenty places that write to it, so a new
   panel cannot forget to open it and a cleared one cannot leave it standing.

   The trays start folded and open behind a chip; a toggle is remembered
   per browser (a layout is a viewer's convenience, not a reading of the
   store, so keeping it is not the trap `TRAYWHO` avoids), and only a
   toggle is written — an earlier version stored the state on every load,
   which would have pinned the old default open in every browser that had
   seen it. Folded, the chip carries the staged count, so staging from the
   panel never yanks the footer open and nothing staged goes unannounced. */
const SIDE_EMPTY = "Click a node to inspect it.";
function sideSync(){
  const text = $("#side").textContent.trim();
  const empty = !text || text===SIDE_EMPTY;
  $("#side").hidden = empty;
  $("#deselectBtn").hidden = empty;
  /* Whatever form just rendered gets its pickers bound here, once for all
     of them, rather than at each site that draws one. Idempotent. */
  bindPickers();
}
new MutationObserver(sideSync).observe($("#side"), {childList:true, subtree:true, characterData:true});
sideSync();

const PANELS = {tray:false};
try{ const kept=localStorage.getItem("dg.tray");
     if(kept==="open" || kept==="closed") PANELS.tray = kept==="open"; }catch(e){}
function panelsApply(){
  $("#tray").hidden = !PANELS.tray;
  $("#trayBtn").classList.toggle("on", PANELS.tray);
  const n = PEND.length + TPEND.length;
  $("#trayBtn").textContent = PANELS.tray || !n ? "tray" : `tray ${n}`;
}
$("#trayBtn").onclick=()=>{
  PANELS.tray=!PANELS.tray; panelsApply();
  try{ localStorage.setItem("dg.tray", PANELS.tray ? "open" : "closed"); }catch(e){}
};
panelsApply();

$("#newBtn").onclick=newNode;
$("#soundBtn").onclick=soundPanel;
$("#areasBtn").onclick=showAreas;
$("#refreshBtn").onclick=refresh;

/* Stopped while the tab is hidden and asked once on the way back, so a laptop
   left open overnight does not spend the night asking, and the answer is
   current the moment somebody looks again. `pollStat` checks `document.hidden`
   too — a timer can fire between the event and the clear. */
addEventListener("visibilitychange",()=>{ if(!document.hidden) pollStat(); });

/* The first load, with the catch `refresh()` always had (T121, the other
   half of D98): a store that does not load is said in D94's line above the
   trays, with the header drawn and the findings chip never reached — not a
   blank page. The poll still starts, so a store repaired behind the page
   shows up on the badge rather than needing a reload to be noticed. */
async function firstLoad(){
  try{ await boot(); fit(); draw(); }
  catch(err){ said(esc(err.message), "bad"); }
  finally{ refreshBadge(); POLL = setInterval(pollStat, POLL_EVERY); }
}
firstLoad();
</script>
</body>
