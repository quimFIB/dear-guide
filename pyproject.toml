[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-graph-assistant"
version = "0.1.0"
description = "Track a project's decisions as a graph: what is settled, what it rests on, and what would reopen it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.9", "rich>=13"]

# The tool supplies a project's decision-graph tests (dgraph.testing), so
# pytest is part of what it offers, not just how it is developed.
[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dg = "dgraph.cli:main"

[tool.setuptools]
packages = ["dgraph"]

[tool.setuptools.package-data]
dgraph = ["static/*.html", "elisp/*.el"]
