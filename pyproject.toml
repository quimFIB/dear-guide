[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dear-guide"
version = "0.1.0"
description = "Track a project's development as two linked graphs: the decisions it has settled, and the work that follows from them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["typer>=0.9", "rich>=13"]

# The tool supplies a project's development-graph tests (dgraph.testing), so
# pytest is part of what it offers, not just how it is developed.
[project.optional-dependencies]
dev = ["pytest>=7"]
# Not in `dev`, and the line above says why: `dev` is what somebody installs to
# run *their* development-graph tests, and `pytest-xdist` is no part of what
# this tool offers them -- it is how this repo's own 2,300 tests are run in
# something under two minutes instead of three and a half.
#
# **Two phases, because two files cannot share a worker.** `test_broker.py`
# binds a real socket in a per-project channel directory, and `test_compact.py`
# asserts what a given terminal width does, which is the one thing `xdist`
# changes about the environment it hands a test. So:
#
#     COLUMNS=200 pytest -n 8 --dist loadfile \
#         --ignore=tests/test_broker.py --ignore=tests/test_compact.py
#     pytest tests/test_broker.py tests/test_compact.py
#
# `COLUMNS` is set for the first phase and *not* the second, which is the same
# split: the parallel phase needs a width fixed because `xdist` gives it none,
# and the serial phase has tests whose whole subject is the width.
contrib = ["pytest-xdist>=3"]
# `dg-agent setup` without arguments. The wizard's non-interactive form -- the
# one an agent inside Claude Code or opencode uses -- needs none of this, and
# neither does anything else here, so a two-dependency install stays a
# two-dependency install.
tui = ["textual>=0.50"]

[project.scripts]
dg = "dgraph.cli:main"

# One package, two entry points -- not two distributions. `dg-agent expire`
# stages parks into the task tray, so it needs `task_pending` and the tray
# lock; the `$DG_*` parsers in `dgraph/env.py` are shared by construction, and
# two copies of `write_policy` is the one bug the split is about arrived at
# from the other direction; and two packages that must agree on the meaning of
# `DG_DECIDE=evidence` is a coupling nobody can see in a lockfile.
dg-agent = "dgraph.agent_cli:main"

# `dgraph.testing` is a pytest plugin as well as a module to import from: the
# entry point is what lets it register `--decision-graph`, since a plugin hook
# in a file that is merely imported by a test module is never called.
[project.entry-points.pytest11]
dear-guide = "dgraph.testing"

# The test modules import each other's helpers (`from tests.conftest import
# bare`), which needs the repo root importable. `python -m pytest` puts it there
# by accident of how `-m` works; the bare `pytest` console script does not, so
# it is said here rather than left to depend on how the suite is invoked.
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["dgraph"]

[tool.setuptools.package-data]
dgraph = ["static/*.html", "elisp/*.el", "prompts/*.md"]
